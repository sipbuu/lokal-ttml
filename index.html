function setMode(mode) {
  previewMode = mode
  document.getElementById('mode-kara').className = 'mode-btn'+(mode==='karaoke'?' active':'')
  document.getElementById('mode-plain').className = 'mode-btn'+(mode==='plain'?' active':'')
  renderPreview(audio.currentTime||0)
}

function getWordProgress(word, t) {
  if (!word || word.time == null) return 0
  const start = word.time
  const end = word.end != null && word.end > start ? word.end : start + 0.12
  const raw = clamp((t - start) / (end - start), 0, 1)
  return 1 - Math.pow(1 - raw, 0.72)
}

function seekToWord(word) {
  if (!word || word.time == null || !audioDuration) return
  audio.currentTime = clamp(word.time, 0, audioDuration)
  if (waveformZoom > 1) { waveformCenter = audio.currentTime; drawWaveform() }
  updatePlayheads()
}

function buildSyncWord(word, className, index, t, type = 'main') {
  const wrapper = document.createElement('span')
  wrapper.className = className
  wrapper.dataset.wi = index
  applyWordColor(wrapper, index, type)
  if (word.time != null) {
    wrapper.classList.add('word-seekable')
    wrapper.addEventListener('click', e => { e.stopPropagation(); seekToWord(word) })
  }
  const chars = Array.from(word.word || '')
  const progress = getWordProgress(word, t)
  const litCount = progress * chars.length
  chars.forEach((ch, charIndex) => {
    const char = document.createElement('span')
    char.className = 'pc'
    const fill = clamp(litCount - charIndex, 0, 1)
    if (fill > 0) char.classList.add('lit')
    char.style.opacity = fill > 0 ? String(0.42 + fill * 0.58) : ''
    char.textContent = ch
    wrapper.appendChild(char)
  })
  if (progress >= 0.999) wrapper.classList.add('lit')
  return wrapper
}

function renderPreviewLightweight(t) {
  const container = document.getElementById('lyrics-preview')
  container.innerHTML = ''
  for (const line of lines) {
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time!=null && t>=line.time && !past
    const div = document.createElement('div')
    div.className = `pline preview-seekable ${past?'past':cur?'current':'future'}`
    div.dataset.lineId = line.id
    div.addEventListener('mouseenter', () => div.classList.add('preview-hover'))
    div.addEventListener('mouseleave', () => div.classList.remove('preview-hover'))
    div.addEventListener('click', () => {
      selectLine(line.id)
      seekToLine(line, false)
    })

    const mainDiv = document.createElement('div')
    mainDiv.className = 'pline-text'
    if (previewMode==='karaoke') {
      line.words.forEach((w,i) => {
        if (i > 0 && !w.tight) mainDiv.appendChild(document.createTextNode(' '))
        mainDiv.appendChild(buildSyncWord(w, 'pw', i, t, 'main'))
      })
    } else {
      mainDiv.textContent = line.text
    }
    div.appendChild(mainDiv)

    if (line.bgWords?.length) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'pline-bg'
      line.bgWords.forEach((w,i) => {
        if (i > 0 && !w.tight) bgDiv.appendChild(document.createTextNode(' '))
        bgDiv.appendChild(buildSyncWord(w, 'pbw', i, t, 'bg'))
      })
      div.appendChild(bgDiv)
    } else if (line.bgText) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'pline-bg'
      bgDiv.textContent = line.bgText
      div.appendChild(bgDiv)
    }

    if (line.duoWords?.length) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'pline-duo'
      line.duoWords.forEach((w,i) => {
        if (i > 0 && !w.tight) duoDiv.appendChild(document.createTextNode(' '))
        duoDiv.appendChild(buildSyncWord(w, 'pdw', i, t, 'duo'))
      })
      div.appendChild(duoDiv)
    } else if (line.duoText) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'pline-duo'
      duoDiv.textContent = line.duoText
      div.appendChild(duoDiv)
    }

    container.appendChild(div)
    if (cur) setTimeout(()=>div.scrollIntoView({behavior:'smooth',block:'center'}),0)
  }
}

function updatePreviewLiveLightweight(t) {
  const plines = document.querySelectorAll('.pline')
  plines.forEach((el, i) => {
    if (i>=lines.length) return
    const line = lines[i]
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time!=null && t>=line.time && (!past)
    const hover = el.classList.contains('preview-hover')
    const newClass = `pline preview-seekable ${hover?'preview-hover ':''}${past&&settings.dimPast?'past':cur?'current':'future'}`
    if (el.className !== newClass) el.className = newClass

    if (previewMode === 'karaoke') {
      el.querySelectorAll('.pw').forEach((sp,wi) => {
        const w = line.words[wi]
        const progress = settings.wordGlowStyle === 'none' ? 0 : getWordProgress(w, t)
        const chars = sp.querySelectorAll('.pc')
        const litCount = progress * chars.length
        chars.forEach((char, charIndex) => {
          const fill = clamp(litCount - charIndex, 0, 1)
          char.classList.toggle('lit', fill > 0)
          char.style.opacity = fill > 0 ? String(0.42 + fill * 0.58) : ''
        })
        sp.classList.toggle('lit', progress >= 0.999)
      })
      const allowAlt = settings.wordGlowStyle === 'all' || settings.wordGlowStyle === 'both'
      el.querySelectorAll('.pbw').forEach((sp,wi) => {
        const w = line.bgWords?.[wi]
        const progress = allowAlt ? getWordProgress(w, t) : 0
        const chars = sp.querySelectorAll('.pc')
        const litCount = progress * chars.length
        chars.forEach((char, charIndex) => {
          const fill = clamp(litCount - charIndex, 0, 1)
          char.classList.toggle('lit', fill > 0)
          char.style.opacity = fill > 0 ? String(0.4 + fill * 0.6) : ''
        })
        sp.classList.toggle('lit', progress >= 0.999)
      })
      el.querySelectorAll('.pdw').forEach((sp,wi) => {
        const w = line.duoWords?.[wi]
        const progress = allowAlt ? getWordProgress(w, t) : 0
        const chars = sp.querySelectorAll('.pc')
        const litCount = progress * chars.length
        chars.forEach((char, charIndex) => {
          const fill = clamp(litCount - charIndex, 0, 1)
          char.classList.toggle('lit', fill > 0)
          char.style.opacity = fill > 0 ? String(0.4 + fill * 0.6) : ''
        })
        sp.classList.toggle('lit', progress >= 0.999)
      })
      if (cur && settings.scrollPreview) el.scrollIntoView({behavior:'smooth',block:'center'})
    }
  })
}

function renderPreview(t) {
  if (settings.previewStyle === 'apple') renderPreviewApple(t)
  else renderPreviewLightweight(t)
}

function updatePreviewLive(t) {
  if (settings.previewStyle === 'apple') updatePreviewLiveApple(t)
  else updatePreviewLiveLightweight(t)
}

const HELD_WORD_THRESHOLD = 1.0
const PAUSE_DOTS_THRESHOLD = 3
const LETTER_END_TRIM = 0.25
const DOT_PRE_HIDE = 0.5
const APPLE_SCROLL_ANCHOR = 0.35
let applePreviewLastTs = 0
let appleScrollAnchorId = null
let applePredictedTime = 0
let appleTimeAnchorMedia = 0
let appleTimeAnchorPerf = 0

class AmSpring {
  constructor(value, frequencyHz, dampingRatio) {
    this.p = value; this.v = 0; this.g = value
    this.f = frequencyHz; this.d = Math.min(dampingRatio, 0.999)
  }
  setGoal(goal, snap = false) {
    this.g = goal
    if (snap) { this.p = goal; this.v = 0 }
  }
  step(dt) {
    const f = this.f * 2 * Math.PI, d = this.d, g = this.g, o = this.p - g
    const c = Math.sqrt(1 - d * d)
    const q = Math.exp(-d * f * dt)
    const i = Math.cos(dt * f * c), j = Math.sin(dt * f * c)
    const z = c > 1e-6 ? j / c : dt * f
    const y = f * c > 1e-6 ? j / (f * c) : dt
    this.p = (o * (i + z * d) + this.v * y) * q + g
    this.v = (this.v * (i - z * d) - o * (z * f)) * q
    return this.p
  }
}

class AmSpline {
  constructor(points) {
    this.xs = points.map(p => p[0])
    this.ys = points.map(p => p[1])
    const n = this.xs.length
    this.k = new Array(n).fill(0)
    if (n < 2) return
    const a = new Array(n).fill(0), b = new Array(n).fill(0), c = new Array(n).fill(0), d = new Array(n).fill(0)
    for (let i = 1; i < n - 1; i++) {
      const dxPrev = this.xs[i] - this.xs[i - 1], dxNext = this.xs[i + 1] - this.xs[i]
      a[i] = 1 / dxPrev; c[i] = 1 / dxNext; b[i] = 2 * (a[i] + c[i])
      d[i] = 3 * ((this.ys[i] - this.ys[i - 1]) / (dxPrev * dxPrev) + (this.ys[i + 1] - this.ys[i]) / (dxNext * dxNext))
    }
    const dx0 = this.xs[1] - this.xs[0]
    b[0] = 2 / dx0; c[0] = 1 / dx0; d[0] = 3 * (this.ys[1] - this.ys[0]) / (dx0 * dx0)
    const dxN = this.xs[n - 1] - this.xs[n - 2]
    a[n - 1] = 1 / dxN; b[n - 1] = 2 / dxN; d[n - 1] = 3 * (this.ys[n - 1] - this.ys[n - 2]) / (dxN * dxN)
    const cp = new Array(n).fill(0), dp = new Array(n).fill(0)
    cp[0] = c[0] / b[0]; dp[0] = d[0] / b[0]
    for (let i = 1; i < n; i++) {
      const m = b[i] - a[i] * cp[i - 1]
      cp[i] = c[i] / m; dp[i] = (d[i] - a[i] * dp[i - 1]) / m
    }
    this.k[n - 1] = dp[n - 1]
    for (let i = n - 2; i >= 0; i--) this.k[i] = dp[i] - cp[i] * this.k[i + 1]
  }
  at(t) {
    const xs = this.xs, ys = this.ys, k = this.k, n = xs.length
    if (n === 1) return ys[0]
    const clamped = Math.max(xs[0], Math.min(t, xs[n - 1]))
    let i = 0
    while (i < n - 2 && clamped > xs[i + 1]) i++
    const x0 = xs[i], x1 = xs[i + 1], y0 = ys[i], y1 = ys[i + 1], dx = x1 - x0
    const s = dx === 0 ? 0 : (clamped - x0) / dx
    const a = k[i] * dx - (y1 - y0), b = -k[i + 1] * dx + (y1 - y0)
    return (1 - s) * y0 + s * y1 + s * (1 - s) * ((1 - s) * a + s * b)
  }
}

const AM_WORD_SCALE = new AmSpline([[0, 0.95], [0.7, 1.0505], [1, 1]])
const AM_WORD_Y = new AmSpline([[0, 0.01], [0.9, -1 / 60], [1, 0]])
const AM_LETTER_SCALE = new AmSpline([[0, 0.95], [0.7, 1.175], [1, 1]])
const AM_LETTER_Y = new AmSpline([[0, 0.01], [0.9, -1 / 56], [1, 0]])
const AM_GLOW = new AmSpline([[0, 0], [0.15, 1], [0.6, 1], [1, 0]])
const AM_DOT_SCALE = new AmSpline([[0, 0.75], [0.7, 1.05], [1, 1]])
const AM_DOT_Y = new AmSpline([[0, 0], [0.9, -0.12], [1, 0]])
const AM_DOT_GLOW = new AmSpline([[0, 0], [0.6, 1], [1, 1]])
const AM_DOT_OPACITY = new AmSpline([[0, 0.35], [0.6, 1], [1, 1]])

function amEaseSinOut(t) { return Math.sin((t * Math.PI) / 2) }
function amState(t, start, end) {
  if (t < start) return 'NotSung'
  if (t >= end) return 'Sung'
  return 'Active'
}
function amProgress(t, start, end) {
  if (t <= start) return 0
  if (t >= end) return 1
  return (t - start) / Math.max(0.0001, end - start)
}
function amEnsureSprings(store, kind) {
  if (store) return store
  if (kind === 'dot') {
    return {
      scale: new AmSpring(0.75, 0.7, 0.6),
      yOffset: new AmSpring(0, 1.25, 0.4),
      glow: new AmSpring(0, 1, 0.5),
      opacity: new AmSpring(0.35, 1, 0.5),
    }
  }
  if (kind === 'letter') {
    return {
      scale: new AmSpring(0.95, 0.88, 0.64),
      yOffset: new AmSpring(0.01, 1.45, 0.4),
      glow: new AmSpring(0, 1.18, 0.56),
    }
  }
  return {
    scale: new AmSpring(0.95, 0.88, 0.64),
    yOffset: new AmSpring(0.01, 1.45, 0.4),
    glow: new AmSpring(0, 1.18, 0.56),
  }
}
function amWriteTransform(el, yEm, scale) {
  el.style.transform = `translate3d(0, calc(var(--am-font-size) * ${yEm}), 0) scale(${scale})`
}

function buildAppleWord(word, className, index, type) {
  const wrapper = document.createElement('span')
  wrapper.className = className
  wrapper.dataset.wi = index
  applyWordColor(wrapper, index, type)
  if (word?.time != null) {
    wrapper.classList.add('word-seekable')
    wrapper.addEventListener('click', e => { e.stopPropagation(); seekToWord(word) })
  }
  const dur = word?.time != null && word?.end != null ? Math.max(0, word.end - word.time) : 0
  const chars = Array.from(word?.word || '')
  const held = dur >= HELD_WORD_THRESHOLD && chars.length > 1
  wrapper._wordData = word
  wrapper._letterMode = held
  wrapper.style.setProperty('--gradient-position', '-20%')
  if (held) {
    const trimEnd = Math.max(word.time + 0.05, word.end - LETTER_END_TRIM)
    const letterDur = Math.max(0.04, (trimEnd - word.time) / chars.length)
    chars.forEach((ch, ci) => {
      const char = document.createElement('span')
      char.className = 'am-char'
      char.textContent = ch
      char._letterStart = word.time + ci * letterDur
      char._letterEnd = word.time + (ci + 1) * letterDur
      char.style.setProperty('--gradient-position', '-20%')
      wrapper.appendChild(char)
    })
  } else {
    wrapper.textContent = word?.word || ''
  }
  return wrapper
}

function appendAppleWords(container, words, className, type) {
  words.forEach((w, i) => {
    if (i > 0 && !w.tight) container.appendChild(document.createTextNode(' '))
    container.appendChild(buildAppleWord(w, className, i, type))
  })
}

function appendPauseDots(container, gapStart, gapEnd, alignRight = false) {
  const dots = document.createElement('div')
  dots.className = 'am-dots' + (alignRight ? ' align-right' : '')
  dots.dataset.start = gapStart
  dots.dataset.end = gapEnd
  const group = document.createElement('span')
  group.className = 'am-dot-group'
  const span = Math.max(0.2, (gapEnd - gapStart) / 3)
  for (let d = 0; d < 3; d++) {
    const dot = document.createElement('span')
    dot.className = 'am-dot'
    dot._dotStart = gapStart + span * d
    dot._dotEnd = gapStart + span * (d + 1)
    group.appendChild(dot)
  }
  dots.appendChild(group)
  dots.addEventListener('click', e => {
    e.stopPropagation()
    if (audioDuration) audio.currentTime = clamp(gapEnd, 0, audioDuration)
  })
  container.appendChild(dots)
}

function lineHasDuoLead(line) {
  return !!(line?.duoWords?.length || line?.duoText) && !(line?.words?.length)
}

function scrollAppleLineToAnchor(el, lineId) {
  if (!settings.scrollPreview || !el) return
  if (appleScrollAnchorId === lineId) return
  appleScrollAnchorId = lineId
  const container = document.getElementById('lyrics-preview')
  if (!container) return
  const top = el.offsetTop - (container.clientHeight * APPLE_SCROLL_ANCHOR) + (el.offsetHeight / 2)
  container.scrollTop = Math.max(0, top)
}

function getAppleClockTime() {
  const raw = audio.currentTime || 0
  const now = performance.now()
  if (raw !== appleTimeAnchorMedia) {
    appleTimeAnchorMedia = raw
    appleTimeAnchorPerf = now
  }
  let predicted = appleTimeAnchorMedia
  if (!audio.paused && !audio.ended && !audio.seeking) {
    const elapsed = Math.min((now - appleTimeAnchorPerf) / 1000, 0.28)
    predicted = appleTimeAnchorMedia + elapsed * (audio.playbackRate || 1)
  }
  applePredictedTime = predicted
  return predicted
}

function findAppleAnchorIndex(t) {
  let anchor = -1
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].time != null && lines[i].time <= t) anchor = i
  }
  return anchor
}

function applyAppleWordUnit(wrapper, t, dt, active) {
  const word = wrapper._wordData
  if (!word || word.time == null) {
    wrapper.style.setProperty('--gradient-position', '-20%')
    return
  }
  const start = word.time
  const end = word.end != null && word.end > start ? word.end : start + 0.12
  const state = amState(t, start, end)

  if (wrapper._letterMode) {
    const chars = wrapper.querySelectorAll('.am-char')
    let activeLetterIndex = -1
    let activeLetterPercentage = 0
    if (state === 'Active') {
      chars.forEach((ch, i) => {
        if (activeLetterIndex === -1 && amState(t, ch._letterStart, ch._letterEnd) === 'Active') {
          activeLetterIndex = i
          activeLetterPercentage = amProgress(t, ch._letterStart, ch._letterEnd)
        }
      })
    }
    chars.forEach((ch, k) => {
      ch._springs = amEnsureSprings(ch._springs, 'letter')
      let targetScale = AM_LETTER_SCALE.at(0)
      let targetY = AM_LETTER_Y.at(0)
      let targetGlow = AM_GLOW.at(0)
      let targetGradient = -20
      if (state === 'Sung') {
        targetScale = AM_LETTER_SCALE.at(1); targetY = AM_LETTER_Y.at(1); targetGlow = AM_GLOW.at(1); targetGradient = 100
      } else if (state === 'Active') {
        const letterState = amState(t, ch._letterStart, ch._letterEnd)
        if (activeLetterIndex !== -1) {
          const pct = activeLetterPercentage
          const baseScale = AM_LETTER_SCALE.at(pct), baseY = AM_LETTER_Y.at(pct), baseGlow = AM_GLOW.at(pct)
          const dist = Math.abs(k - activeLetterIndex)
          const scaleFalloff = Math.max(0, 1 / (1 + Math.pow(dist, 2.8)))
          const glowFalloff = Math.max(0, 1 / (1 + dist * 0.9))
          targetScale = AM_LETTER_SCALE.at(0) + (baseScale - AM_LETTER_SCALE.at(0)) * scaleFalloff
          targetY = AM_LETTER_Y.at(0) + (baseY - AM_LETTER_Y.at(0)) * scaleFalloff
          targetGlow = AM_GLOW.at(0) + (baseGlow - AM_GLOW.at(0)) * glowFalloff
        }
        if (letterState === 'NotSung') {
          targetScale = AM_LETTER_SCALE.at(0); targetY = AM_LETTER_Y.at(0); targetGlow = AM_GLOW.at(0); targetGradient = -20
        } else if (letterState === 'Sung') {
          targetGradient = 100
          if (activeLetterIndex === -1) targetGlow = AM_GLOW.at(0.2)
        } else {
          targetGradient = k === activeLetterIndex ? -20 + 120 * amEaseSinOut(activeLetterPercentage) : -20
        }
      }
      if (!active && state !== 'Active') {
        ch._springs.scale.setGoal(targetScale, true)
        ch._springs.yOffset.setGoal(targetY, true)
        ch._springs.glow.setGoal(targetGlow, true)
      } else {
        ch._springs.scale.setGoal(targetScale)
        ch._springs.yOffset.setGoal(targetY)
        ch._springs.glow.setGoal(targetGlow)
      }
      const scale = ch._springs.scale.step(dt)
      const y = ch._springs.yOffset.step(dt)
      const glow = ch._springs.glow.step(dt)
      ch.style.setProperty('--gradient-position', `${targetGradient}%`)
      amWriteTransform(ch, y * 2, scale)
      ch.style.setProperty('--text-shadow-blur-radius', `${4 + 12 * glow}px`)
      ch.style.setProperty('--text-shadow-opacity', `${glow * 35}`)
    })
    return
  }

  wrapper._springs = amEnsureSprings(wrapper._springs, 'word')
  const pct = amProgress(t, start, end)
  const shaped = state === 'NotSung' ? 0 : state === 'Sung' ? 1 : pct
  const targetScale = AM_WORD_SCALE.at(shaped)
  const targetY = AM_WORD_Y.at(shaped)
  const targetGlow = AM_GLOW.at(shaped)
  const targetGradient = state === 'NotSung' ? -20 : state === 'Sung' ? 100 : -20 + 120 * shaped
  if (!active && state !== 'Active') {
    wrapper._springs.scale.setGoal(targetScale, true)
    wrapper._springs.yOffset.setGoal(targetY, true)
    wrapper._springs.glow.setGoal(targetGlow, true)
  } else {
    wrapper._springs.scale.setGoal(targetScale)
    wrapper._springs.yOffset.setGoal(targetY)
    wrapper._springs.glow.setGoal(targetGlow)
  }
  const scale = wrapper._springs.scale.step(dt)
  const y = wrapper._springs.yOffset.step(dt)
  const glow = wrapper._springs.glow.step(dt)
  wrapper.style.setProperty('--gradient-position', `${targetGradient}%`)
  amWriteTransform(wrapper, y, scale)
  wrapper.style.setProperty('--text-shadow-blur-radius', `${4 + 2 * glow}px`)
  wrapper.style.setProperty('--text-shadow-opacity', `${Math.min(glow * 35, 100)}`)
}

function applyAppleDots(el, t, dt) {
  const start = parseFloat(el.dataset.start), end = parseFloat(el.dataset.end)
  const active = t >= start && t < end
  const preHidden = active && t > end - DOT_PRE_HIDE
  el.classList.toggle('active', active)
  el.classList.toggle('pre-hidden', preHidden)
  el.querySelectorAll('.am-dot').forEach(dot => {
    dot._springs = amEnsureSprings(dot._springs, 'dot')
    const state = amState(t, dot._dotStart, dot._dotEnd)
    const pct = amProgress(t, dot._dotStart, dot._dotEnd)
    const shaped = state === 'NotSung' ? 0 : state === 'Sung' ? 1 : pct
    if (!active) {
      dot._springs.scale.setGoal(AM_DOT_SCALE.at(0), true)
      dot._springs.yOffset.setGoal(AM_DOT_Y.at(0), true)
      dot._springs.glow.setGoal(AM_DOT_GLOW.at(0), true)
      dot._springs.opacity.setGoal(AM_DOT_OPACITY.at(0), true)
    } else {
      dot._springs.scale.setGoal(AM_DOT_SCALE.at(shaped))
      dot._springs.yOffset.setGoal(AM_DOT_Y.at(shaped))
      dot._springs.glow.setGoal(AM_DOT_GLOW.at(shaped))
      dot._springs.opacity.setGoal(AM_DOT_OPACITY.at(shaped))
    }
    const scale = dot._springs.scale.step(dt)
    const y = dot._springs.yOffset.step(dt)
    const glow = dot._springs.glow.step(dt)
    const opacity = dot._springs.opacity.step(dt)
    amWriteTransform(dot, y, scale)
    dot.style.opacity = opacity
    dot.style.setProperty('--text-shadow-blur-radius', `${4 + 6 * glow}px`)
    dot.style.setProperty('--text-shadow-opacity', `${glow * 90}`)
  })
}

function renderPreviewApple(t) {
  const container = document.getElementById('lyrics-preview')
  container.classList.add('apple-mode')
  container.innerHTML = ''
  applePreviewLastTs = performance.now()
  appleScrollAnchorId = null
  appleTimeAnchorMedia = t
  appleTimeAnchorPerf = applePreviewLastTs
  const timedLines = lines.filter(l => l.time != null)
  if (timedLines.length && timedLines[0].time >= PAUSE_DOTS_THRESHOLD) {
    appendPauseDots(container, 0, timedLines[0].time, lineHasDuoLead(timedLines[0]))
  }
  const anchorIdx = findAppleAnchorIndex(t)
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li]
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time != null && t >= line.time && !past
    const isDuoLead = !!(line.duoWords?.length || line.duoText) && !(line.words?.length)
    const div = document.createElement('div')
    div.className = `am-line preview-seekable ${isDuoLead ? 'duo-align ' : ''}${past ? 'past' : cur ? 'current' : 'future'}`
    div.dataset.lineId = line.id
    const dist = anchorIdx < 0 ? Math.min(li, 8) : Math.abs(li - anchorIdx)
    const blurAmt = cur || li === anchorIdx ? 0 : Math.min(0.9 + dist * 1.15, 5.5)
    div.style.filter = `blur(${blurAmt.toFixed(2)}px) drop-shadow(0 4px 24px rgba(0,0,0,.4))`
    if (!cur && li !== anchorIdx && settings.dimPast) {
      div.style.opacity = past ? '0.22' : String(Math.max(0.35 - dist * 0.018, 0.14))
    }
    div.addEventListener('mouseenter', () => div.classList.add('preview-hover'))
    div.addEventListener('mouseleave', () => div.classList.remove('preview-hover'))
    div.addEventListener('click', () => { selectLine(line.id); seekToLine(line, false) })

    const row = document.createElement('div')
    row.className = 'am-row'
    if (line.words?.length) {
      const mainDiv = document.createElement('div')
      mainDiv.className = 'am-main'
      appendAppleWords(mainDiv, line.words, 'am-word', 'main')
      row.appendChild(mainDiv)
    }

    if (line.duoWords?.length) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'am-duo'
      appendAppleWords(duoDiv, line.duoWords, 'am-word', 'duo')
      row.appendChild(duoDiv)
    } else if (line.duoText) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'am-duo'
      duoDiv.textContent = line.duoText
      row.appendChild(duoDiv)
    }
    div.appendChild(row)

    if (line.bgWords?.length) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'am-bg'
      appendAppleWords(bgDiv, line.bgWords, 'am-word am-bgword', 'bg')
      div.appendChild(bgDiv)
    } else if (line.bgText) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'am-bg'
      bgDiv.textContent = line.bgText
      div.appendChild(bgDiv)
    }

    container.appendChild(div)
    div.querySelectorAll('.am-word').forEach(w => applyAppleWordUnit(w, t, 1 / 60, cur || Math.abs(li - anchorIdx) <= 1))
    if (li === anchorIdx) scrollAppleLineToAnchor(div, line.id)

    const nextTimed = timedLines.find(l => l.time > (line.time ?? -Infinity))
    if (nextTimed && line.time != null) {
      const gapStart = effEnd
      const gapEnd = nextTimed.time
      if (gapEnd - gapStart >= PAUSE_DOTS_THRESHOLD) {
        appendPauseDots(container, gapStart, gapEnd, !!(nextTimed.duoWords?.length || nextTimed.duoText))
      }
    }
  }
  container.querySelectorAll('.am-dots').forEach(el => applyAppleDots(el, t, 1 / 60))
}

function updatePreviewLiveApple(t) {
  const now = performance.now()
  const dt = clamp((now - (applePreviewLastTs || now)) / 1000, 0.001, 0.05)
  applePreviewLastTs = now
  const clockT = getAppleClockTime()
  const time = Number.isFinite(t) ? Math.max(t, clockT - 0.002) : clockT

  const lineEls = [...document.querySelectorAll('.am-line')]
  const anchorIdx = findAppleAnchorIndex(time)

  if (anchorIdx >= 0 && lineEls[anchorIdx]) {
    scrollAppleLineToAnchor(lineEls[anchorIdx], lineEls[anchorIdx].dataset.lineId)
  } else {
    appleScrollAnchorId = null
  }

  lineEls.forEach((el, i) => {
    const line = lines.find(l => l.id === el.dataset.lineId) || lines[i]
    if (!line) return
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && time > effEnd
    const highlight = line.time != null && time >= line.time && !past
    const hover = el.classList.contains('preview-hover')
    const isDuoLead = el.classList.contains('duo-align')
    const dist = anchorIdx < 0 ? Math.min(i, 8) : Math.abs(i - anchorIdx)
    const blur = (i === anchorIdx) ? 0 : Math.min(0.9 + dist * 1.15, 5.5)
    const restingOpacity = Math.max(0.35 - dist * 0.018, 0.14)
    const isAnchor = i === anchorIdx
    const newClass = `am-line preview-seekable ${isDuoLead ? 'duo-align ' : ''}${hover ? 'preview-hover ' : ''}${past && settings.dimPast ? 'past' : (highlight || isAnchor) ? 'current' : 'future'}`
    if (el.className !== newClass) el.className = newClass
    if (highlight || isAnchor) {
      el.style.opacity = ''
      el.style.filter = 'blur(0px) drop-shadow(0 4px 24px rgba(0,0,0,.4))'
    } else if (settings.dimPast) {
      el.style.opacity = past ? '0.22' : String(restingOpacity)
      el.style.filter = `blur(${blur.toFixed(2)}px) drop-shadow(0 4px 24px rgba(0,0,0,.4))`
    } else {
      el.style.opacity = ''
      el.style.filter = `blur(${Math.min(blur, 2.5).toFixed(2)}px) drop-shadow(0 4px 24px rgba(0,0,0,.4))`
    }
    const near = anchorIdx < 0 || dist <= 1
    el.querySelectorAll('.am-word').forEach(w => applyAppleWordUnit(w, time, dt, near))
  })

  document.querySelectorAll('.am-dots').forEach(el => applyAppleDots(el, time, dt))
}

function isHexColor(v) {
  return typeof v === 'string' && /^#([0-9a-f]{6})$/i.test(v.trim())
}

function hexToRgba(hex, alpha) {
  const value = hex.replace('#', '')
  const r = parseInt(value.slice(0, 2), 16)
  const g = parseInt(value.slice(2, 4), 16)
  const b = parseInt(value.slice(4, 6), 16)
  return `rgba(${r},${g},${b},${alpha})`
}

function withAlphaIfHex(value, alpha) {
  return isHexColor(value) ? hexToRgba(value, alpha) : value
}

function getThemeBaseVars() {
  return { ...(THEMES[settings.theme] || THEMES.dark).vars }
}

function getThemeVars() {
  return { ...getThemeBaseVars(), ...(settings.themeOverrides || {}) }
}

function applyDerivedThemeVars(vars) {
  const hasBgImage = vars['--bg-image'] && vars['--bg-image'] !== 'none'
  if (isHexColor(vars['--accent'])) {
    vars['--accent-dim'] = hexToRgba(vars['--accent'], 0.12)
    vars['--accent-dim2'] = hexToRgba(vars['--accent'], 0.06)
    vars['--accent-20'] = hexToRgba(vars['--accent'], 0.2)
    vars['--accent-25'] = hexToRgba(vars['--accent'], 0.25)
    vars['--accent-30'] = hexToRgba(vars['--accent'], 0.3)
    vars['--accent-40'] = hexToRgba(vars['--accent'], 0.4)
    vars['--accent-50'] = hexToRgba(vars['--accent'], 0.5)
    vars['--accent-70'] = hexToRgba(vars['--accent'], 0.7)
  }
  if (isHexColor(vars['--red'])) vars['--red-dim'] = hexToRgba(vars['--red'], 0.12)
  if (isHexColor(vars['--blue'])) vars['--blue-dim'] = hexToRgba(vars['--blue'], 0.12)
  if (isHexColor(vars['--purple'])) vars['--purple-dim'] = hexToRgba(vars['--purple'], 0.12)
  if (isHexColor(vars['--orange'])) vars['--orange-dim'] = hexToRgba(vars['--orange'], 0.12)
  if (hasBgImage) {
    vars['--bg'] = withAlphaIfHex(vars['--bg'], 0.72)
    vars['--surface'] = withAlphaIfHex(vars['--surface'], 0.74)
    vars['--surface2'] = withAlphaIfHex(vars['--surface2'], 0.78)
    vars['--surface3'] = withAlphaIfHex(vars['--surface3'], 0.84)
    vars['--border'] = withAlphaIfHex(vars['--border'], 0.7)
    vars['--border2'] = withAlphaIfHex(vars['--border2'], 0.8)
  }
  return vars
}

function collectThemeOverridesFromModal() {
  const nextOverrides = {}
  const accent = document.getElementById('s-accent')?.value
  if (accent) nextOverrides['--accent'] = accent
  const textScale = document.getElementById('s-textscale')?.value
  if (textScale) nextOverrides['--text-scale'] = textScale
  const bgImageValue = document.getElementById('s-bg-image')?.value || ''
  nextOverrides['--bg-image'] = bgImageValue ? `url('${bgImageValue}')` : 'none'
  nextOverrides['--bg-overlay'] = document.getElementById('s-bg-overlay')?.value || '0'
  nextOverrides['--bg-blur'] = (document.getElementById('s-bg-blur')?.value || '0') + 'px'
  nextOverrides['--bg-size'] = document.getElementById('s-bg-size')?.value || 'cover'
  nextOverrides['--bg-position'] = document.getElementById('s-bg-position')?.value || 'center'
  document.querySelectorAll('[data-theme-key]').forEach(input => {
    const key = input.getAttribute('data-theme-key')
    const value = input.value.trim()
    if (value) nextOverrides[key] = value
  })
  return nextOverrides
}

function loadSettings() {
  try {
    const s = localStorage.getItem('ttml-editor-settings')
    if (s) {
      const parsed = JSON.parse(s)
      settings = {
        ...settings,
        ...parsed,
        themeOverrides: { ...(parsed.themeOverrides || {}) }
      }
      if (parsed.textScale && !settings.themeOverrides['--text-scale']) settings.themeOverrides['--text-scale'] = String(parsed.textScale)
    }
  } catch {}
}

function saveSettings() {
  try { localStorage.setItem('ttml-editor-settings', JSON.stringify(settings)) } catch {}
}

function applySettings() {
  const root = document.documentElement
  const vars = applyDerivedThemeVars(getThemeVars())
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v)
  document.querySelectorAll('.pline-text').forEach(el => el.style.fontSize = settings.previewFontSize + 'px')
  syncPreviewStyleButton()
  syncCenterPreviewButton()
  syncDragRetimeButton()
  audio.preservesPitch = !!settings.preservePitchAtSpeed
  audio.mozPreservesPitch = !!settings.preservePitchAtSpeed
  audio.webkitPreservesPitch = !!settings.preservePitchAtSpeed
  drawWaveform()
}

function ttmlWordSpans(words) {
  let out = ''
  words.forEach((w, i) => {
    if (i > 0 && !w.tight) out += ' '
    out += `<span begin="${fmtTTML(w.time)}" end="${fmtTTML(w.end)}">${esc(w.word)}</span>`
  })
  return out
}

function lineExportLabel(line) {
  const text = (line.text || line.duoText || '(blank line)').trim()
  return `"${text.length > 40 ? text.slice(0, 40) + '…' : text}"`
}

function validateExportIssues(sorted) {
  const issues = []
  const EPS = 0.02
  const checkAltBounds = (line, words, kind) => {
    if (!words?.length) return
    const first = words[0], last = words[words.length - 1]
    if (first.time != null && line.time != null && first.time < line.time - EPS) {
      issues.push(`${lineExportLabel(line)} - ${kind} vocals start before the line's own start time.`)
    }
    if (last.end != null && line.end != null && last.end > line.end + EPS) {
      issues.push(`${lineExportLabel(line)} - ${kind} vocals end after the line's own end time.`)
    }
    const missing = words.filter(w => w.time == null).length
    if (missing) issues.push(`${lineExportLabel(line)} has ${missing} ${kind} word${missing===1?'':'s'} missing timing.`)
  }
  for (let i = 0; i < sorted.length; i++) {
    const line = sorted[i]
    const label = lineExportLabel(line)
    if (line.time == null) { issues.push(`${label} has no start time set.`); continue }
    if (line.end != null && line.end <= line.time) issues.push(`${label} ends at or before it starts.`)
    const missingMain = (line.words || []).filter(w => w.time == null).length
    if (missingMain) issues.push(`${label} has ${missingMain} word${missingMain===1?'':'s'} missing timing.`)
    for (let w = 0; w < (line.words || []).length - 1; w++) {
      const a = line.words[w], b = line.words[w + 1]
      if (a.end != null && b.time != null && a.end > b.time + EPS) {
        issues.push(`${label} has overlapping word timing ("${a.word}" runs into "${b.word}").`)
        break
      }
    }
    checkAltBounds(line, line.bgWords, 'background')
    checkAltBounds(line, line.duoWords, 'duo')
    const next = sorted[i + 1]
    if (next && line.end != null && next.time != null && line.end > next.time + EPS) {
      issues.push(`${label} overlaps into the next line, ${lineExportLabel(next)}.`)
    }
  }
  return issues
}

function showExportConflictsModal(issues, onContinue) {
  const shown = issues.slice(0, 14).map(i => `<li style="margin-bottom:6px">${esc(i)}</li>`).join('')

  showModal('Potential Conflicts', `
    <div class="mf">
      <p style="font-size:13px;line-height:1.6;color:var(--muted)">We found a few things in your timing that might not be intentional:</p>
      <ul style="font-size:12px;color:var(--text);padding-left:18px;margin-top:10px;max-height:260px;overflow:auto">${shown}</ul>
      ${more}
      <div class="desc" style="margin-top:10px">If these are meant to be there, click Continue with Conflicts to export anyway.</div>
    </div>
  `, [
    {label:'Cancel', fn:closeModal},
    {label:'Continue with Conflicts', primary:true, fn: () => { closeModal(); onContinue() }}
  ])
}

function buildTTMLXml(sorted) {
  const hasDuet = sorted.some(l => l.duoWords?.length)
  let metaXml = `<ttm:title>${esc(songMeta.musicName||audioFileName||'Unknown')}</ttm:title>`
  if (hasDuet) metaXml += `<ttm:agent type="person" xml:id="v1"/><ttm:agent type="person" xml:id="v2"/>`
  if (songMeta.musicName) metaXml += `<amll:meta key="musicName" value="${escAttr(songMeta.musicName)}"/>`
  for (const a of (songMeta.artists||[])) metaXml += `<amll:meta key="artists" value="${escAttr(a)}"/>`
  if (songMeta.album) metaXml += `<amll:meta key="album" value="${escAttr(songMeta.album)}"/>`
  if (songMeta.songwriters?.length) {
    metaXml += `<iTunesMetadata xmlns="http://music.apple.com/lyric-ttml-internal"><songwriters>`
    for (const s of songMeta.songwriters) metaXml += `<songwriter>${esc(s)}</songwriter>`
    metaXml += `</songwriters></iTunesMetadata>`
  }
  let xml = `<?xml version="1.0" encoding="UTF-8"?>
<tt xml:lang="en" xmlns="http://www.w3.org/ns/ttml"
    xmlns:ttm="http://www.w3.org/ns/ttml#metadata"
    xmlns:itunes="http://music.apple.com/lyric-ttml-internal"
    xmlns:amll="http://www.example.com/ns/amll">
  <head>
    <metadata>${metaXml}</metadata>
    <styling><style xml:id="s1" tts:fontFamily="Arial" tts:fontSize="100%" tts:color="white" xmlns:tts="http://www.w3.org/ns/ttml#styling"/></styling>
    <layout><region xml:id="r1" tts:textAlign="center" tts:displayAlign="after" xmlns:tts="http://www.w3.org/ns/ttml#styling"/></layout>
  </head>
  <body>
    <div region="r1">\n`
  for (const line of sorted) {
    const soloDuet = !line.words?.length && line.duoWords?.length
    if (soloDuet) {
      xml += `      <p begin="${fmtTTML(line.time)}" end="${fmtTTML(line.end)}" ttm:agent="v2">`
      xml += ttmlWordSpans(line.duoWords)
      if (line.bgWords?.length) {
        xml += `<span ttm:role="x-bg" begin="${fmtTTML(line.bgWords[0].time)}" end="${fmtTTML(line.bgWords[line.bgWords.length-1].end)}">`
        xml += ttmlWordSpans(line.bgWords)
        xml += `</span>`
      }
      xml += `</p>\n`
      continue
    }
    xml += `      <p begin="${fmtTTML(line.time)}" end="${fmtTTML(line.end)}"${hasDuet?' ttm:agent="v1"':''}>`
    xml += ttmlWordSpans(line.words)
    if (line.bgWords?.length) {
      xml += `<span ttm:role="x-bg" begin="${fmtTTML(line.bgWords[0].time)}" end="${fmtTTML(line.bgWords[line.bgWords.length-1].end)}">`
      xml += ttmlWordSpans(line.bgWords)
      xml += `</span>`
    }
    if (line.duoWords?.length) {
      xml += `<span ttm:role="x-alt" ttm:agent="v2" begin="${fmtTTML(line.duoWords[0].time)}" end="${fmtTTML(line.duoWords[line.duoWords.length-1].end)}">`
      xml += ttmlWordSpans(line.duoWords)
      xml += `</span>`
    }
    xml += `</p>\n`
  }
  xml += `    </div>\n  </body>\n</tt>`
  return xml
}

const EXPORT_PRESETS_KEY = 'ttml-editor-export-presets'

function getExportPresets() {
  try {
    const raw = localStorage.getItem(EXPORT_PRESETS_KEY)
    const parsed = raw ? JSON.parse(raw) : {}
    return parsed && typeof parsed === 'object' ? parsed : {}
  } catch { return {} }
}

function exportPresetKey() {
  return sanitizeFileBase(getCurrentSongName()).toLowerCase()
}

function saveExportPreset(kind, filePath) {
  const all = getExportPresets()
  const key = exportPresetKey()
  all[key] = { ...(all[key] || {}), [kind]: filePath, updatedAt: Date.now() }
  try { localStorage.setItem(EXPORT_PRESETS_KEY, JSON.stringify(all)) } catch {}
  updateReExportButtons()
}

function getExportPreset(kind) {
  return getExportPresets()[exportPresetKey()]?.[kind] || null
}

function updateReExportButtons() {
  const ttmlBtn = document.getElementById('reexport-ttml-btn')
  const lrcBtn = document.getElementById('reexport-lrc-btn')
  const ttmlPath = getExportPreset('ttml')
  const lrcPath = getExportPreset('lrc')
  if (ttmlBtn) {
    ttmlBtn.style.display = ttmlPath ? 'inline-flex' : 'none'
    ttmlBtn.title = ttmlPath ? `Re-export straight to ${ttmlPath}` : ''
  }
  if (lrcBtn) {
    lrcBtn.style.display = lrcPath ? 'inline-flex' : 'none'
    lrcBtn.title = lrcPath ? `Re-export straight to ${lrcPath}` : ''
  }
}

function exportTTML(force, quickPath, metaOk) {
  if (!lines.length) return
  if (!metaOk && !hasSongwriterMetadata()) {
    showMissingMetadataModal(() => exportTTML(force, quickPath, true))
    return
  }
  const sorted = [...lines].sort((a,b)=>(a.time||0)-(b.time||0))
  if (!force) {
    const issues = validateExportIssues(sorted)
    if (issues.length) {
      showExportConflictsModal(issues, () => exportTTML(true, quickPath, true))
      return
    }
  }
  const xml = buildTTMLXml(sorted)
  if (quickPath) {
    window.api.writeFileDirect(quickPath, xml).then(ok => {
      if (!ok) { showRuntimeError('Re-export failed - the remembered path may no longer exist.'); return }
      flashProjectsButton()
      showModal('Re-exported!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(quickPath.replace(/\\/g,'/').split('/').pop())}</strong><div class="es-path">${esc(quickPath)}</div></div>`, [{label:'Close',fn:closeModal}])
    })
    return
  }
  const suggestedName = audioFileName.replace(/\.[^.]+$/,'')+'.ttml'
  const lastDir = getExportPreset('ttmlDir')
  window.api.saveTTML(xml, suggestedName, lastDir).then(fp => {
    if (!fp) return
    saveExportPreset('ttml', fp)
    saveExportPreset('ttmlDir', fp.replace(/\\/g,'/').split('/').slice(0,-1).join('/'))
    const parts = fp.replace(/\\/g,'/').split('/')
    const fileName = parts.pop()
    const dir = parts.join('/')
    showModal('Saved!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(fileName)}</strong><div class="es-path">${esc(dir)}</div><div class="es-note">Feel free to use this in Lokal by importing it from the lyrics view, or use it in any other program that supports TTML files. Thanks!</div></div>`, [{label:'Close',fn:closeModal}])
  })
}

function reExportTTML() {
  const path = getExportPreset('ttml')
  if (!path) { exportTTML(); return }
  exportTTML(false, path)
}

function fmtLRCTime(t) {
  if (t == null) return '00:00.00'
  const m = Math.floor(t / 60)
  const s = t - m * 60
  return `${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}`
}

function lrcLineText(line) {
  let t = line.text || ''
  if (line.duoText) t += (t ? ' ' : '') + line.duoText
  if (line.bgText) t += (t ? ' ' : '') + `(${line.bgText})`
  return t.trim()
}

function buildLRCText(timed) {
  let out = ''
  for (const line of timed) out += `[${fmtLRCTime(line.time)}]${lrcLineText(line)}\n`
  return out
}

function exportLRC(force, quickPath) {
  const timed = lines.filter(l => l.time != null).sort((a,b) => a.time - b.time)
  if (!timed.length) { showRuntimeError('No timed lines to export, please add line timing first.'); return }
  if (!force) {
    const issues = validateExportIssues(timed)
    if (issues.length) {
      showExportConflictsModal(issues, () => exportLRC(true, quickPath))
      return
    }
  }
  const out = buildLRCText(timed)
  if (quickPath) {
    window.api.writeFileDirect(quickPath, out).then(ok => {
      if (!ok) { showRuntimeError('Re-export failed - the remembered path may no longer exist.'); return }
      flashProjectsButton()
      showModal('Re-exported!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(quickPath.replace(/\\/g,'/').split('/').pop())}</strong><div class="es-path">${esc(quickPath)}</div></div>`, [{label:'Close',fn:closeModal}])
    })
    return
  }
  const suggestedName = audioFileName.replace(/\.[^.]+$/,'')+'.lrc'
  const lastDir = getExportPreset('lrcDir')
  window.api.saveLRC(out, suggestedName, lastDir).then(fp => {
    if (!fp) return
    saveExportPreset('lrc', fp)
    saveExportPreset('lrcDir', fp.replace(/\\/g,'/').split('/').slice(0,-1).join('/'))
    const parts = fp.replace(/\\/g,'/').split('/')
    const fileName = parts.pop()
    const dir = parts.join('/')
    showModal('Saved!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(fileName)}</strong><div class="es-path">${esc(dir)}</div><div class="es-note">Plain line-synced LRC, ready to submit to LRCLIB alongside your word-synced TTML.</div></div>`, [{label:'Close',fn:closeModal}])
  })
}

function reExportLRC() {
  const path = getExportPreset('lrc')
  if (!path) { exportLRC(); return }
  exportLRC(false, path)
}

function sortLines() {
  lines.sort((a,b)=>(a.time??Infinity)-(b.time??Infinity))
  renderAll()
}

function showShiftTimingModal() {
  if (!lines.length) return
  showModal('Shift All Timings', `
    <div class="mf">
      <p style="font-size:12px;color:var(--muted);line-height:1.6">Moves every line, word, and marker timing by the same offset - handy if you swapped in a different version of the audio with a longer or shorter intro and everything is now off by a fixed amount.</p>
      <label style="margin-top:8px">Offset (seconds)</label>
      <input class="mi" id="shift-seconds-input" type="number" step="0.05" placeholder="e.g. 2.5 or -1.2">
      <div class="desc" style="margin-top:6px">Positive pushes everything later, negative pulls everything earlier. Results are clamped so nothing goes below 0:00.</div>
    </div>
  `, [
    { label: 'Cancel', fn: closeModal },
    { label: 'Apply Shift', primary: true, fn: () => {
        const delta = parseFloat(document.getElementById('shift-seconds-input').value)
        if (!Number.isFinite(delta) || delta === 0) { closeModal(); return }
        closeModal()
        shiftAllTimings(delta)
      } }
  ])
  setTimeout(() => document.getElementById('shift-seconds-input')?.focus(), 50)
}

function shiftAllTimings(delta) {
  pushHistory('shift all timings')
  shiftLinesByIds(lines.map(l => l.id), delta)
  for (const m of markers) {
    if (m.time != null) m.time = Math.max(0, m.time + delta)
  }
  sortLines()
  drawWaveform()
}
function filterLines(val) { filterText=val; renderLines(); scheduleSessionSave() }
function updateStatus() {
  document.getElementById('sb-lines').textContent = lines.length
  let timed=0, missing=0
  for (const l of lines) for (const w of l.words) { (w.timingEdited && w.time!=null)?timed++:missing++ }
  document.getElementById('sb-timed').textContent = timed
  document.getElementById('sb-missing').textContent = missing
}

function showPromptModal(title, defaultValue = '', placeholder = '') {
  return new Promise(resolve => {
    let settled = false
    const settle = (val) => {
      if (settled) return
      settled = true
      observer.disconnect()
      document.removeEventListener('keydown', keyHandler)
      resolve(val)
    }
    showModal(title, `<div class="mf"><input class="mi" id="prompt-modal-input" value="${escAttr(defaultValue)}" placeholder="${escAttr(placeholder)}"></div>`, [
      { label: 'Cancel', fn: () => { settle(null); closeModal() } },
      { label: 'OK', primary: true, fn: () => { settle(document.getElementById('prompt-modal-input')?.value ?? null); closeModal() } }
    ])
    const overlay = document.getElementById('modal-overlay')
    const observer = new MutationObserver(() => {
      if (overlay.classList.contains('hidden')) settle(null)
    })
    observer.observe(overlay, { attributes: true, attributeFilter: ['class'] })
    const keyHandler = (e) => {
      if (e.key === 'Enter') { settle(document.getElementById('prompt-modal-input')?.value ?? null); closeModal() }
    }
    setTimeout(() => {
      const input = document.getElementById('prompt-modal-input')
      if (input) { input.focus(); input.select() }
      document.addEventListener('keydown', keyHandler)
    }, 50)
  })
}

function showModal(title, bodyHtml, buttons) {
  const opts = arguments[3] || {}
  document.getElementById('modal').dataset.locked = opts.locked ? 'true' : 'false'
  document.getElementById('modal-title').textContent = title
  document.getElementById('modal-body').innerHTML = bodyHtml
  const acts = document.getElementById('modal-actions')
  acts.innerHTML = ''
  for (const b of (buttons || [])) {
    const btn = document.createElement('button')
    btn.className = 'mbtn'+(b.primary?' primary':'')
    btn.textContent = b.label
    btn.addEventListener('click', b.fn)
    acts.appendChild(btn)
  }
  document.getElementById('modal-overlay').classList.remove('hidden')
}
function closeModal() {
  const modal = document.getElementById('modal')
  if (modal.dataset.locked === 'true') return
  modal.dataset.locked = 'false'
  document.getElementById('modal-overlay').classList.add('hidden')
}
function forceCloseModal() {
  const modal = document.getElementById('modal')
  modal.dataset.locked = 'false'
  document.getElementById('modal-overlay').classList.add('hidden')
}
document.getElementById('modal-overlay').addEventListener('mousedown', e => {
  if (e.target===document.getElementById('modal-overlay')) closeModal()
})

document.getElementById('wc-min').addEventListener('click', () => window.api.minimizeWindow?.())
document.getElementById('wc-max').addEventListener('click', async () => {
  try {
    const maximized = await window.api.toggleMaximizeWindow?.()
    setWindowMaximizedState(maximized)
  } catch {}
})
document.getElementById('wc-close').addEventListener('click', () => window.api.closeWindow?.())
window.api.onWindowMaximized?.(setWindowMaximizedState)
window.api.onConfirmClose?.(async () => {
  if (!projectDirty) { window.api.confirmCloseResult?.(true); return }
  showModal('Unsaved Changes', `<p style="font-size:13px;line-height:1.6;color:var(--muted)">You've got unsaved changes. Save your project before closing?</p>`, [
    {label:'Cancel', fn: () => { forceCloseModal(); window.api.confirmCloseResult?.(false) }},
    {label:"Don't Save", fn: () => { forceCloseModal(); window.api.confirmCloseResult?.(true) }},
    {label:'Save & Close', primary:true, fn: async () => {
      const name = getCurrentSongName()
      let ok = true
      if (currentProjectPath) await saveCurrentProject(name)
      else ok = !!(await saveCurrentProjectAsFile(name))
      forceCloseModal()
      window.api.confirmCloseResult?.(ok)
    }}
  ], { locked: true })
})
updateWindowControls()
document.getElementById('error-log-close').addEventListener('click', () => {
  document.getElementById('error-log').classList.remove('visible')
  document.getElementById('error-log-text').textContent = ''
})

document.getElementById('waveform-area').addEventListener('wheel', handleWaveformWheel, { passive: false })
document.getElementById('prog-track').addEventListener('wheel', handleProgressWheel, { passive: false })
window.addEventListener('resize', () => drawWaveform())
window.addEventListener('beforeunload', saveSessionNow)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveSessionNow()
})
window.addEventListener('error', (event) => {
  showRuntimeError(`${event.message || 'Unhandled error'}${event.filename ? `\n${event.filename}:${event.lineno || 0}:${event.colno || 0}` : ''}`)
})
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason
  showRuntimeError(`Unhandled rejection: ${reason?.stack || reason?.message || reason}`)
})
audio.addEventListener('error', () => {
  const mediaError = audio.error
  showRuntimeError(`Audio element error${mediaError ? ` (code ${mediaError.code})` : ''}`)
})

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName.toLowerCase()
  if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.code==='KeyZ' && tag!=='input' && tag!=='textarea') {
    e.preventDefault()
    undoLastEdit()
    return
  }
  if ((e.ctrlKey||e.metaKey) && (e.code==='KeyY' || (e.shiftKey && e.code==='KeyZ')) && tag!=='input' && tag!=='textarea') {
    e.preventDefault()
    redoLastEdit()
    return
  }
  if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.code==='KeyS' && tag!=='input' && tag!=='textarea') {
    e.preventDefault()
    saveCurrentProject(getCurrentSongName())
    return
  }
  if (tag==='input'||tag==='textarea') return
  if (tapTimingSession) {
    if (e.code==='Space') { e.preventDefault(); tapToTimeStamp(); return }
    if (e.code==='BracketLeft') { e.preventDefault(); nudgePlaybackSpeed(-1); renderTapTimingBar(); return }
    if (e.code==='BracketRight') { e.preventDefault(); nudgePlaybackSpeed(1); renderTapTimingBar(); return }
  }
  if (e.code==='Space') { e.preventDefault(); togglePlay() }
  if (e.code==='KeyS' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); setStartNow() }
  if (e.code==='KeyE') { e.preventDefault(); setEndNow() }
  if (e.code==='KeyM') { e.preventDefault(); addMarkerAtPlayhead() }
  if (e.code==='BracketLeft') { e.preventDefault(); nudgePlaybackSpeed(-1) }
  if (e.code==='BracketRight') { e.preventDefault(); nudgePlaybackSpeed(1) }
  if (e.code==='ArrowRight') { e.preventDefault(); audio.currentTime=Math.min(audioDuration,audio.currentTime+(e.shiftKey?1:.1)) }
  if (e.code==='ArrowLeft') { e.preventDefault(); audio.currentTime=Math.max(0,audio.currentTime-(e.shiftKey?1:.1)) }
  if (e.code==='Tab' && selectedWord) {
    e.preventDefault()
    const line = lines.find(l=>l.id===selectedWord.lineId)
    if (!line) return
    const words = selectedWord.type==='bg'?line.bgWords:selectedWord.type==='duo'?line.duoWords:line.words
    const next = e.shiftKey ? selectedWord.idx-1 : selectedWord.idx+1
    if (next>=0 && next<words.length) selectWord(selectedWord.lineId, next, selectedWord.type)
  }
})

loadSettings()
applySettings()
restoreUndoHistoryFromStorage()
const wasSessionUnclean = localStorage.getItem(SESSION_ACTIVE_KEY) === '1'
try { localStorage.setItem(SESSION_ACTIVE_KEY, '1') } catch {}
restoreSession().finally(() => {
  renderAll()
  drawWaveform()
  if (selectedWord) selectWord(selectedWord.lineId, selectedWord.idx, selectedWord.type)
  if (wasSessionUnclean) checkForCrashRecovery()
})
syncAppVersion().then(() => setTimeout(() => checkForUpdates(false), 2500))
startProjectAutosaveLoop()
updateQueueBadge()
updateReExportButtons()
window.addEventListener('beforeunload', () => {
  try { localStorage.setItem(SESSION_ACTIVE_KEY, '0') } catch {}
  autosaveProjectTick()
})
</script>
