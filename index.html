<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokal TTML Editor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--surface3:#222;
  --border:#2a2a2a;--border2:#333;--text:#e8e8e8;--muted:#666;--muted2:#444;
  --accent:#c8ff57;--accent-dim:rgba(200,255,87,0.12);--accent-dim2:rgba(200,255,87,0.06);
  --accent-20:rgba(200,255,87,0.2);--accent-25:rgba(200,255,87,0.25);--accent-30:rgba(200,255,87,0.3);--accent-40:rgba(200,255,87,0.4);--accent-50:rgba(200,255,87,0.5);--accent-70:rgba(200,255,87,0.7);
  --red:#ff5757;--red-dim:rgba(255,87,87,0.12);
  --blue:#57b8ff;--blue-dim:rgba(87,184,255,0.12);
  --purple:#c057ff;--purple-dim:rgba(192,87,255,0.12);
  --orange:#ffaa57;--orange-dim:rgba(255,170,87,0.12);
  --text-scale:1;--bg-image:none;--bg-overlay:0;--bg-blur:0px;--bg-size:cover;--bg-position:center;
  --r:8px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(13px * var(--text-scale))}
body{position:relative}
#theme-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--bg-image);background-size:var(--bg-size);background-position:var(--bg-position);background-repeat:no-repeat;filter:blur(var(--bg-blur));transform:scale(1.03);opacity:1}
#theme-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg);opacity:var(--bg-overlay)}
#titlebar{height:36px;display:grid;grid-template-columns:1fr 138px;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;position:relative;z-index:5}
#titlebar-drag{height:100%;-webkit-app-region:drag}
#titlebar-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;height:100%;pointer-events:none;-webkit-app-region:drag}
#titlebar span{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
#window-controls{display:flex;justify-content:flex-end;align-items:center;height:100%;min-width:138px;-webkit-app-region:no-drag;background:transparent;gap:6px;padding:0 8px}
.wc-btn{width:38px;height:26px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;appearance:none}
.wc-btn:hover{background:var(--surface3);border-color:var(--border2);color:var(--text)}
.wc-btn.close:hover{background:var(--red-dim);border-color:var(--red);color:#fff}
.wc-btn svg{width:12px;height:12px}
#app{display:flex;flex-direction:column;height:calc(100vh - 36px);position:relative;z-index:1}
#toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#main{display:flex;flex:1;min-height:0}
.tb-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--r);cursor:pointer;font-family:var(--font);font-size:12px;transition:all .15s;white-space:nowrap}
.tb-btn:hover{background:var(--surface3);border-color:var(--border2)}
.tb-btn.accent{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
.tb-btn.accent:hover{background:var(--accent-20)}
.tb-btn.flash-saved{background:var(--accent-30)!important;transition:background .2s}
#projects-dropdown-wrap{position:relative;display:flex}
#recent-audio-wrap{position:relative;display:flex;gap:6px}
#recent-audio-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:280px;max-height:min(60vh,420px);overflow-y:auto;background:var(--surface);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--border2);border-radius:10px;box-shadow:0 16px 32px rgba(0,0,0,.55);padding:10px;z-index:50;display:none}
#recent-audio-dropdown.open{display:block}
#projects-btn{position:relative}
#projects-dirty-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:1.5px solid var(--surface);opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s;pointer-events:none}
#projects-dirty-dot.visible{opacity:1;transform:scale(1)}
#queue-wrap{position:relative;display:flex}
.badge-count{display:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#111;font-size:9px;font-weight:700;align-items:center;justify-content:center;line-height:16px;text-align:center}
.badge-count.visible{display:inline-flex}
#queue-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:300px;max-height:min(65vh,480px);overflow-y:auto;background:var(--surface);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--border2);border-radius:10px;box-shadow:0 16px 32px rgba(0,0,0,.55);padding:12px;z-index:50;display:none}
#queue-dropdown.open{display:block}
#projects-dropdown{position:absolute;top:calc(100% + 8px);left:0;width:320px;max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--border2);border-radius:10px;box-shadow:0 16px 32px rgba(0,0,0,.55);padding:14px;z-index:50;display:none}
#projects-dropdown.open{display:block}
.pd-section{margin-bottom:12px}
.pd-section:last-child{margin-bottom:0}
.pd-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;display:block;margin-bottom:6px}
.pd-sep{height:1px;background:var(--border);margin:12px 0}
.pd-hint{font-size:10px;color:var(--muted2);margin-top:6px;line-height:1.4}
.pd-empty{color:var(--muted);font-size:11px;text-align:center;padding:10px 4px}
.tb-btn svg{width:14px;height:14px;flex-shrink:0}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
kbd{display:inline-block;padding:1px 5px;background:var(--surface3);border:1px solid var(--border2);border-radius:3px;font-family:var(--mono);font-size:9px;color:var(--muted)}
#track-info{display:flex;align-items:center;gap:10px;margin-left:auto}
#track-name{font-size:12px;color:var(--muted);max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#track-time{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:80px;text-align:right}

#lines-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
#lines-header{padding:12px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#lines-header h2{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
#lines-search-wrap{padding:6px 8px;border-bottom:1px solid var(--border)}
#lines-search{width:100%;padding:6px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:12px;outline:none}
#lines-search:focus{border-color:var(--accent-30)}
#lines-list{flex:1;overflow-y:auto;padding:4px}
.line-item{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:1px;transition:all .1s;user-select:none}
.line-item:hover{background:var(--surface2)}
.line-item.active{background:var(--accent-dim);border-color:var(--accent-25)}
.line-item.multi-selected{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
.line-item.multi-selected::before{content:'✓ ';color:var(--orange);font-weight:700}
.line-item.playing{border-color:var(--accent-50)!important}
.line-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:3px}
.line-indicators{display:flex;gap:3px;align-items:center}
.li-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.li-dot.li-bg{background:var(--purple);box-shadow:0 0 4px var(--purple-dim)}
.li-dot.li-duo{background:var(--orange);box-shadow:0 0 4px var(--orange-dim)}
.line-text-preview{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500}
.badge-main{background:var(--accent-dim);color:var(--accent)}
.badge-bg{background:var(--purple-dim);color:var(--purple)}
.badge-duo{background:var(--orange-dim);color:var(--orange)}
.badge-notimed{background:var(--red-dim);color:var(--red)}
#bulk-select-bar{margin:6px 6px 0;padding:8px;background:var(--orange-dim);border:1px solid rgba(255,170,87,.35);border-radius:6px;display:flex;flex-direction:column;gap:6px}
#bulk-select-bar.hidden{display:none}
#bulk-select-count{font-size:11px;font-weight:600;color:var(--orange)}
#bulk-select-actions{display:flex;flex-wrap:wrap;gap:5px}
#bulk-drag-toggle-btn.active{background:var(--orange-dim);border-color:var(--orange);color:var(--orange)}
#add-line-btn{margin:6px;padding:8px;background:var(--surface2);border:1px dashed var(--border2);border-radius:6px;color:var(--muted);cursor:pointer;text-align:center;font-size:12px;transition:all .15s}
#add-line-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim2)}

#editor-panel{flex:1;display:flex;flex-direction:column;min-width:0}
#waveform-area{height:88px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);position:relative;cursor:crosshair;overflow:hidden}
#waveform-area.wf-dragging,#waveform-area.wf-edge-hover{cursor:ew-resize}
#waveform-canvas{width:100%;height:100%;display:block}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;transform:translateX(-50%);box-shadow:0 0 8px var(--accent)}
#waveform-time-overlay{position:absolute;top:4px;left:8px;font-family:var(--mono);font-size:10px;color:var(--muted);pointer-events:none}
#waveform-zoom-overlay{position:absolute;top:4px;right:8px;font-family:var(--mono);font-size:10px;color:var(--muted2);pointer-events:none}
#waveform-markers{position:absolute;inset:0;pointer-events:none;z-index:3}
.wf-marker-line{position:absolute;top:0;bottom:0;width:1px;background:var(--purple);opacity:.7;pointer-events:none}
.wf-marker-flag{position:absolute;top:0;left:0;transform:translateX(-50%);background:var(--purple);color:#111;font-size:9px;font-weight:600;padding:1px 6px 2px;border-radius:0 0 5px 5px;white-space:nowrap;cursor:pointer;pointer-events:auto;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.wf-marker-flag:hover{filter:brightness(1.15)}
#waveform-marker-toolbar{position:absolute;bottom:4px;right:8px;display:flex;gap:4px;z-index:4}
#waveform-marker-toolbar button{padding:2px 7px;border-radius:4px;border:1px solid var(--border);background:var(--surface3);color:var(--muted);cursor:pointer;font-size:10px;font-family:var(--font)}
#waveform-marker-toolbar button:hover{color:var(--text);border-color:var(--border2)}
#waveform-marker-toolbar button.active{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
#markers-list-wrap{position:relative}
#markers-dropdown{position:absolute;bottom:calc(100% + 6px);right:0;width:250px;max-height:min(50vh,320px);overflow-y:auto;background:var(--surface);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--border2);border-radius:10px;box-shadow:0 16px 32px rgba(0,0,0,.55);padding:10px;z-index:50;display:none}
#markers-dropdown.open{display:block}

#word-editor{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;position:absolute;inset:0;gap:10px;color:var(--muted);pointer-events:none;z-index:2;background:var(--bg)}
#empty-state.hidden{display:none}
#empty-state svg{width:40px;height:40px;color:var(--muted2)}

.line-timing-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);flex-wrap:wrap;flex-shrink:0}
.line-timing-row label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.timing-sm{width:88px;padding:4px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none}
.timing-sm:focus{border-color:var(--accent-40)}

.word-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex-shrink:0}
.word-row-header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--border)}
.word-row-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.word-row-label.lbl-bg{color:var(--purple)}
.word-row-label.lbl-duo{color:var(--orange)}
.word-row-actions{margin-left:auto;display:flex;gap:5px}
.sm-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface3);color:var(--muted);cursor:pointer;font-size:10px;font-family:var(--font);transition:all .1s}
.sm-btn:hover{color:var(--text);border-color:var(--border2)}
.sm-btn.danger:hover{color:var(--red);border-color:var(--red);background:var(--red-dim)}

.words-container{display:flex;flex-wrap:wrap;gap:5px;padding:10px}
.word-gap{display:flex;align-items:center;justify-content:center;width:13px;align-self:stretch;cursor:pointer;color:var(--muted2);font-size:13px;user-select:none;border-radius:4px;transition:background .1s,color .1s}
.word-gap:hover{background:var(--surface3);color:var(--text)}
.word-gap.tight{color:var(--orange)}

.word-chip{display:flex;flex-direction:column;background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;min-width:36px}
.word-chip:hover{border-color:var(--border2);background:var(--surface3)}
.word-chip.selected{border-color:var(--accent)!important;background:var(--accent-dim)!important;box-shadow:0 0 0 1px var(--accent)}
.word-chip.active-now{border-color:var(--accent-70);background:var(--accent-dim);box-shadow:0 0 6px var(--accent-20)}
.word-chip.word-colored{border-color:color-mix(in srgb,var(--word-color),transparent 58%);box-shadow:inset 3px 0 0 color-mix(in srgb,var(--word-color),transparent 10%)}
.word-chip.word-colored:hover{background:color-mix(in srgb,var(--word-color),var(--surface2) 88%)}
.word-chip.word-colored.active-now{background:color-mix(in srgb,var(--word-color),var(--surface2) 78%);border-color:color-mix(in srgb,var(--word-color),transparent 25%);box-shadow:inset 3px 0 0 var(--word-color),0 0 8px color-mix(in srgb,var(--word-color),transparent 70%)}
.word-chip.bg-chip{border-color:rgba(192,87,255,.2)}
.word-chip.bg-chip.active-now{border-color:rgba(192,87,255,.7);background:rgba(192,87,255,.15);box-shadow:0 0 6px rgba(192,87,255,.2)}
.word-chip.duo-chip{border-color:rgba(255,170,87,.2)}
.word-chip.duo-chip.active-now{border-color:rgba(255,170,87,.7);background:rgba(255,170,87,.15);box-shadow:0 0 6px rgba(255,170,87,.2)}
.word-chip.no-time{border-color:rgba(255,87,87,.25)}
.word-chip.no-time .wt span{color:var(--red)!important}
.wt-text{padding:5px 8px 1px;font-size:13px;color:var(--text)}
.wt{padding:1px 6px 4px;font-family:var(--mono);font-size:9px;color:var(--muted);display:flex;gap:3px}
.wt span{color:var(--accent)}
.word-chip.bg-chip .wt span{color:var(--purple)}
.word-chip.duo-chip .wt span{color:var(--orange)}

#timing-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#tw-label{font-size:13px;color:var(--muted);min-width:80px;font-style:italic}
#timing-start,#timing-end{width:88px;padding:4px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none}
#timing-start:focus,#timing-end:focus{border-color:var(--accent-40)}
#set-start-btn,#set-end-btn{padding:5px 11px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:11px;font-family:var(--font);transition:all .15s}
#set-start-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
#set-end-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}

#preview-panel{width:320px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--surface)}
#preview-panel:fullscreen,#preview-panel.preview-fullscreen{width:100vw;height:100vh;border-left:none}
#preview-panel:fullscreen #lyrics-preview,#preview-panel.preview-fullscreen #lyrics-preview{padding:40px 12vw}
#preview-panel:fullscreen #lyrics-preview.apple-mode,#preview-panel.preview-fullscreen #lyrics-preview.apple-mode{--am-font-size:clamp(2rem,4.2vw,3.6rem)}
#preview-panel:fullscreen .pline-text,#preview-panel.preview-fullscreen .pline-text{font-size:30px}
#fullscreen-btn.active{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
#center-preview-btn.active{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
#preview-header{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;justify-content:space-between}
#preview-header h2{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;white-space:nowrap;flex-shrink:0;margin-right:8px}
#preview-header-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;row-gap:6px}
.mode-btn{padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-family:var(--font)}
.mode-btn.active{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
#preview-body{flex:1;overflow:hidden;position:relative;background:var(--bg)}
#lyrics-preview{position:absolute;inset:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.pline{padding:6px 4px;border-radius:5px;transition:opacity .25s}
.pline.preview-seekable{cursor:pointer}
.pline.preview-seekable:hover{background:var(--accent-dim2)}
.pline.preview-hover{background:var(--accent-dim);outline:1px solid var(--accent-25)}
.pline.past{opacity:.2}
.pline.current{opacity:1}
.pline.future{opacity:.35}
.pline-text{font-size:17px;font-weight:600;line-height:1.4;color:var(--text);letter-spacing:-.01em}
.pline.current .pline-text{color:var(--text)}
.pw{display:inline;transition:color .06s,text-shadow .06s}
.pw.lit{color:var(--accent);text-shadow:0 0 12px var(--accent-40)}
.pc{transition:opacity .06s,color .06s,text-shadow .06s;opacity:.34}
.pc.lit{color:inherit}
.pline-bg{font-size:12px;color:var(--purple);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px}
.pline-duo{font-size:13px;color:var(--orange);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px}
.pbw{display:inline;transition:color .06s,opacity .06s}
.pbw.lit{opacity:1;text-shadow:0 0 10px rgba(192,87,255,.5)}
.pdw{display:inline;transition:color .06s,opacity .06s}
.pdw.lit{opacity:1;text-shadow:0 0 10px rgba(255,170,87,.5)}
.pline-bg .pbw{opacity:.6}
.pline-duo .pdw{opacity:.6}

#lyrics-preview.apple-mode{gap:0;padding:28px 22px 48px;font-family:'Inter',var(--font);scroll-behavior:auto;--am-font-size:22px;--am-lit:#fff;--am-dim:rgba(255,255,255,.42);--am-glow:rgba(255,255,255,.55);--am-bg-lit:rgba(255,255,255,.92);--am-bg-dim:rgba(255,255,255,.5)}
.am-line{padding:2px 2px 28px;border-radius:6px;transition:opacity .28s ease,transform .28s cubic-bezier(.2,1.2,.4,1),filter .28s ease;will-change:transform,opacity,filter;transform-origin:left center}
.am-line.preview-seekable{cursor:pointer}
.am-line.preview-seekable:hover{background:var(--accent-dim2)}
.am-line.preview-hover{background:var(--accent-dim);outline:1px solid var(--accent-25)}
.am-line.past{opacity:.22}
.am-line.current{opacity:1;font-weight:700;transform:scale(1);filter:blur(0) drop-shadow(0 4px 24px rgba(0,0,0,.4))}
.am-line.future{opacity:.38;font-weight:400}
.am-line:not(.current){transform:scale(.88);font-weight:400}
.am-line.duo-align{transform-origin:right center}
.am-row{display:flex;flex-direction:column;align-items:stretch;gap:2px;transform-origin:inherit}
.am-main{font-size:var(--am-font-size);font-weight:inherit;line-height:1.16;letter-spacing:-.03em;color:var(--text);text-align:left}
.am-line.duo-align .am-main{text-align:right}
.am-duo{font-size:calc(var(--am-font-size) * .92);font-weight:inherit;line-height:1.16;letter-spacing:-.03em;text-align:right;opacity:.95;transform-origin:right center;margin-top:2px}
.am-bg{font-size:calc(var(--am-font-size) * .75);font-weight:600;letter-spacing:-.02em;opacity:.76;margin-top:2px;padding-left:.15em;line-height:1.16}
.am-line.duo-align .am-bg{padding-left:0;padding-right:.15em;text-align:right}
.am-word,.am-char{display:inline-block;position:relative;white-space:pre;will-change:transform;transform-origin:center 72%;
  -webkit-text-fill-color:transparent;background-clip:text;-webkit-background-clip:text;
  background-image:linear-gradient(90deg,var(--am-lit) 0%,var(--am-lit) var(--gradient-position,-20%),var(--am-dim) calc(var(--gradient-position,-20%) + 18%),var(--am-dim) 100%);
  text-shadow:0 0 var(--text-shadow-blur-radius,0) color-mix(in srgb,var(--am-glow) calc(var(--text-shadow-opacity,0) * 1%),transparent)}
.am-duo .am-word,.am-duo .am-char{--am-lit:#fff;--am-dim:rgba(255,255,255,.5);--am-glow:rgba(255,255,255,.5)}
.am-bgword,.am-bgword .am-char{--am-lit:var(--am-bg-lit);--am-dim:var(--am-bg-dim);--am-glow:rgba(255,255,255,.45);font-size:1em}
.word-seekable{cursor:pointer}
.word-seekable:hover{filter:brightness(1.12)}
.am-dots{display:flex;align-items:center;justify-content:flex-start;font-size:var(--am-font-size);height:0;margin:0;opacity:0;overflow:visible;pointer-events:none;transform-origin:left center;transition:opacity .15s ease,height .2s ease,margin .2s ease}
.am-dots.active{height:1.15em;margin:12px 0 28px;opacity:1;pointer-events:auto}
.am-dots.pre-hidden{opacity:1}
.am-dot-group{display:flex;align-items:center;gap:.34em;transform:scale(0);transform-origin:left center;will-change:transform;transition:transform .45s cubic-bezier(.32,1.7,.5,1)}
.am-dots.active:not(.pre-hidden) .am-dot-group{transform:scale(1);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.am-dots.pre-hidden .am-dot-group,.am-dots:not(.active) .am-dot-group{transform:scale(0);transition:transform .45s cubic-bezier(.32,1.7,.5,1)}
.am-dot{display:block;flex:0 0 auto;width:.52em;height:.52em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 70%);opacity:.35;will-change:transform,opacity;transform-origin:center;box-shadow:0 0 var(--text-shadow-blur-radius,0) rgba(255,255,255,calc(var(--text-shadow-opacity,0) / 100))}
.am-dots.align-right{justify-content:flex-end}
.am-dots.align-right .am-dot-group{transform-origin:right center}
#preview-panel:fullscreen #lyrics-preview.apple-mode,#preview-panel.preview-fullscreen #lyrics-preview.apple-mode{--am-font-size:clamp(2rem,4.2vw,3.6rem)}

#tap-timing-bar{display:none;position:fixed;left:50%;bottom:54px;transform:translateX(-50%);z-index:1200;background:rgba(12,12,14,.92);border:1px solid var(--border2);backdrop-filter:blur(16px);border-radius:12px;padding:10px 14px;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.45);font-size:12px;max-width:min(720px,92vw)}
#tap-timing-bar.visible{display:flex}
#tap-timing-bar .tt-title{font-weight:600;color:var(--accent);white-space:nowrap}
#tap-timing-bar .tt-word{color:var(--text);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tap-timing-bar .tt-meta{color:var(--muted);font-family:var(--mono);font-size:11px}
#tap-timing-bar select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11px}
.pd-progress{display:flex;align-items:center;gap:8px;margin-top:4px}
.pd-progress-track{flex:1;height:4px;background:var(--surface3);border-radius:99px;overflow:hidden}
.pd-progress-fill{height:100%;background:var(--accent);border-radius:99px;min-width:0}
.pd-progress-label{font-size:10px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

#transport{flex-shrink:0;padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
#play-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
#play-btn:hover{background:var(--accent);filter:brightness(1.08);transform:scale(1.05)}
#play-btn svg{width:15px;height:15px;color:#000}
#prog-track{flex:1;height:34px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;position:relative;overflow:hidden}
#prog-waveform{position:absolute;inset:0;width:100%;height:100%;display:block}
#prog-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-dim2),var(--accent-dim));border-right:1px solid var(--accent-40);width:0%}
#prog-playhead{position:absolute;top:5px;bottom:5px;width:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);transform:translateX(-50%)}
#vol-slider{width:56px;accent-color:var(--accent);cursor:pointer}
#speed-select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--mono);padding:3px 4px;cursor:pointer}
#tp-time{font-family:var(--mono);font-size:11px;color:var(--muted)}

#status-bar{padding:3px 14px;background:var(--bg);border-top:1px solid var(--border);font-size:10px;color:var(--muted);display:flex;gap:16px;flex-shrink:0}
#status-bar b{color:var(--text);font-weight:500}
#error-log{position:fixed;right:12px;bottom:12px;width:420px;max-height:220px;overflow:auto;background:rgba(10,10,10,.94);border:1px solid rgba(255,87,87,.25);border-radius:10px;padding:10px 12px;z-index:2000;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#error-log.visible{display:block}
#error-log h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ff8c8c;margin-bottom:8px}
#error-log pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:11px;line-height:1.45;color:#ffd7d7}
#error-log button{margin-top:8px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center}
#modal-overlay.hidden{display:none}
#modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:500px;max-height:80vh;overflow-y:auto}
#modal h3{font-size:14px;font-weight:600;margin-bottom:16px}
.mf{margin-bottom:12px}
.mf label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}
.mi{width:100%;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.mi:focus{border-color:var(--accent-40)}
.mta{min-height:100px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}
.macts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.mbtn{padding:7px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:var(--font);font-size:12px}
.mbtn.primary{background:var(--accent-dim);border-color:var(--accent-30);color:var(--accent)}
.mbtn.danger{color:var(--red)}
.mbtn.danger:hover{background:var(--red-dim);border-color:var(--red)}
.mbtn:hover{background:var(--surface3)}
.mbtn.primary:hover{background:rgba(200,255,87,.2)}

.lrclib-result{padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:6px;transition:all .1s}
.lrclib-result:hover{background:var(--surface2);border-color:var(--border2)}
.lrclib-result .rt{font-size:13px;font-weight:500;color:var(--text)}
.lrclib-result .ra{font-size:11px;color:var(--muted);margin-top:2px}
.lrclib-result .rb{display:flex;gap:6px;margin-top:5px}
.lrclib-tag{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:500}
.tag-synced{background:var(--accent-dim);color:var(--accent)}
.tag-plain{background:var(--surface3);color:var(--muted)}
.tag-dur{background:var(--surface3);color:var(--muted)}

.export-success{text-align:center;padding:4px 0}
.es-icon{font-size:28px;margin-bottom:8px}
.es-path{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--surface2);padding:6px 10px;border-radius:6px;margin:10px 0;word-break:break-all;text-align:left}
.es-note{font-size:12px;color:var(--muted);line-height:1.7;text-align:left}

.settings-section{margin-bottom:18px}
.settings-section h4{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.settings-row label{font-size:12px;color:var(--text)}
.settings-row .desc{font-size:11px;color:var(--muted);margin-top:2px}
.settings-toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.settings-toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--surface3);border-radius:10px;cursor:pointer;transition:background .2s;border:1px solid var(--border2)}
.settings-toggle input:checked+.toggle-track{background:var(--accent-dim);border-color:var(--accent-40)}
.toggle-track::after{content:'';position:absolute;left:3px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.settings-toggle input:checked+.toggle-track::after{transform:translateX(16px);background:var(--accent)}
.settings-select{padding:5px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:var(--font);font-size:12px;outline:none}
.settings-select:focus{border-color:var(--accent-40)}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.theme-option{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);cursor:pointer;transition:all .15s;font-family:var(--font);color:var(--text);text-align:left}
.theme-option.active{border-color:var(--accent);background:var(--accent-dim)}
.theme-option-name{font-size:12px;color:var(--text);font-weight:600;margin-bottom:6px}
.theme-swatches{display:flex;gap:4px}
.theme-swatches span{width:14px;height:14px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.accent-grid{display:flex;flex-wrap:wrap;gap:6px}
.accent-option{width:24px;height:24px;border-radius:7px;border:1px solid var(--border2);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.accent-option.active{transform:scale(1.08);box-shadow:0 0 0 2px rgba(255,255,255,.12);border-color:var(--text)}
.settings-range{width:100%;accent-color:var(--accent)}
.settings-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.settings-hidden{display:none}
.settings-code{font-family:var(--mono)}
.bg-preview{width:100%;height:120px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);background-size:var(--bg-size);background-position:var(--bg-position);position:relative;overflow:hidden}
.bg-preview::after{content:'';position:absolute;inset:0;background:var(--bg);opacity:var(--bg-overlay);backdrop-filter:blur(var(--bg-blur))}
.settings-note{font-size:11px;color:var(--muted2);padding-top:4px}
.settings-note strong{color:var(--text);font-weight:600}
.loading-modal{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.loading-spinner{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);border-top-color:var(--accent);animation:spin .85s linear infinite}
.loading-copy{font-size:12px;color:var(--muted);line-height:1.6}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="theme-bg"></div>
<div id="theme-overlay"></div>
<div id="titlebar">
  <div id="titlebar-drag"></div>
  <div id="titlebar-center"><span>Lokal TTML Editor</span></div>
  <div id="window-controls">
    <button class="wc-btn" id="wc-min" aria-label="Minimize">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h8"/></svg>
    </button>
    <button class="wc-btn" id="wc-max" aria-label="Maximize">
      <svg id="wc-max-icon" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="2.5" width="7" height="7"/></svg>
    </button>
    <button class="wc-btn close" id="wc-close" aria-label="Close">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l6 6M9 3L3 9"/></svg>
    </button>
  </div>
</div>
<div id="app">
  <div id="toolbar">
    <div id="projects-dropdown-wrap">
      <button class="tb-btn accent" id="projects-btn" onclick="toggleProjectsDropdown()" title="Save/Load projects">
        <span id="projects-dirty-dot" title="Unsaved changes"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:10px;height:10px;margin-left:1px"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="projects-dropdown"></div>
    </div>
    <div id="queue-wrap">
      <button class="tb-btn" id="queue-btn" onclick="toggleQueueDropdown()" title="Project queue - line up songs to work through">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Queue
        <span id="queue-count-badge" class="badge-count"></span>
      </button>
      <div id="queue-dropdown"></div>
    </div>
    <div class="tb-sep"></div>
    <div id="recent-audio-wrap">
      <button class="tb-btn" onclick="openAudio()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Open Audio
      </button>
      <button class="tb-btn" id="recent-audio-btn" onclick="toggleRecentAudioDropdown()" title="Recently opened audio" style="padding:6px 7px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
      </button>
      <div id="recent-audio-dropdown"></div>
    </div>
    <button class="tb-btn" onclick="showLRCLIBModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Search LRCLIB
    </button>
    <button class="tb-btn" onclick="openLyricsFile()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Import File
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="addLineModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Line
    </button>
    <div class="tb-sep"></div>
    <span style="font-size:11px;color:var(--muted2)">
      <kbd>S</kbd> start &nbsp;<kbd>E</kbd> end &nbsp;<kbd>Space</kbd> play &nbsp;<kbd>Tab</kbd> next &nbsp;<kbd>←→</kbd> 0.1s &nbsp;<kbd>[</kbd><kbd>]</kbd> speed
    </span>
    <div id="track-info">
      <span id="track-name">No audio loaded</span>
      <span id="track-time">0:00.000</span>
      <button class="tb-btn" onclick="showMetadataModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
        Edit Metadata
      </button>
      <button class="tb-btn accent" onclick="exportTTML()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export TTML
      </button>
      <button class="tb-btn" id="reexport-ttml-btn" onclick="reExportTTML()" title="Re-export to last TTML path" style="display:none;padding:6px 7px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="tb-btn" onclick="exportLRC()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export LRC
      </button>
      <button class="tb-btn" id="reexport-lrc-btn" onclick="reExportLRC()" title="Re-export to last LRC path" style="display:none;padding:6px 7px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="tb-btn" id="update-check-btn" onclick="checkForUpdates(true)" title="Check for updates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21,3 21,9 15,9"/></svg>
      </button>
      <button class="tb-btn" onclick="showSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div id="main">
    <div id="lines-panel">
      <div id="lines-header">
        <h2>Lines <span id="line-count" style="color:var(--accent)">0</span></h2>
        <div style="display:flex;gap:6px">
          <button class="sm-btn" onclick="showShiftTimingModal()" title="Shift every timing by a fixed offset - handy if you loaded a different audio version with a longer/shorter intro">⏱ Shift</button>
          <button class="sm-btn" onclick="sortLines()">↕ Sort</button>
        </div>
      </div>
      <div id="lines-search-wrap">
        <input id="lines-search" placeholder="Filter lines…" oninput="filterLines(this.value)">
      </div>
      <div id="lines-list"></div>
      <div id="bulk-select-bar" class="hidden">
        <div id="bulk-select-count">0 selected</div>
        <div id="bulk-select-actions">
          <button class="sm-btn" id="bulk-select-rest-btn" title="Also select every line after the last one you picked">+ Rest of Song</button>

<script>
const audio = document.getElementById('audio-el')
audio.preservesPitch = true
audio.mozPreservesPitch = true
audio.webkitPreservesPitch = true
let lines = []
let markers = []
let tapTimingCompleted = false
let tapTimingSession = null
let multiSelectedLineIds = new Set()
let multiSelectAnchorId = null
let bulkShiftArmed = false
let bulkDrag = null
let selectedLineId = null
let selectedWord = null
let audioDuration = 0
let audioFileName = ''
let songMeta = { musicName: '', album: '', artists: [], songwriters: [] }
let currentAudioPath = ''
let currentAudioMetadata = null
let previewMode = 'karaoke'
let filterText = ''
let waveformPeaks = null
let waveformZoom = 1
let waveformCenter = 0
let isWindowMaximized = false
const waveformMinWindow = 0.06
let waveformDecodeToken = 0
let waveformSupport = { native: null }
let loadingModalToken = 0
const NATIVE_WAVEFORM_POINTS = 50000
const BROWSER_WAVEFORM_POINTS = 18000
let previewAnimationFrame = 0
let autosaveTimer = 0
let restoringSession = false
const SESSION_STORAGE_KEY = 'ttml-editor-session'
let APP_VERSION = '1.2.0'
async function syncAppVersion() {
  try {
    const v = await window.api?.getVersion?.()
    if (v) {
      APP_VERSION = v
      const btn = document.getElementById('update-check-btn')
      if (btn) btn.title = `Check for updates (currently v${APP_VERSION})`
    }
  } catch {}
}
const UPDATE_REPO = 'sipbuu/lokal-ttml'
let currentProjectPath = null
let projectDirty = false
let lastAutosaveAt = 0
let projectAutosaveTimer = null
const SESSION_ACTIVE_KEY = 'ttml-editor-session-active'
let undoHistory = []
let redoHistory = []
let undoRestoring = false
const MAX_UNDO_HISTORY = 80
const UNDO_STORAGE_KEY = 'ttml-editor-undo-history'
const MAX_PERSISTED_UNDO = 15
let undoPersistTimer = 0
const RECENT_AUDIO_KEY = 'ttml-editor-recent-audio'
const MAX_RECENT_AUDIO = 10
const QUEUE_KEY = 'ttml-editor-project-queue'

function genId() { return 'l' + Math.random().toString(36).slice(2, 9) }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;') }
function decodeXmlEntities(s) {
  return String(s||'')
    .replace(/&apos;/g,"'")
    .replace(/&quot;/g,'"')
    .replace(/&lt;/g,'<')
    .replace(/&gt;/g,'>')
    .replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
    .replace(/&#x([0-9a-fA-F]+);/g,(m,d)=>String.fromCharCode(parseInt(d,16)))
    .replace(/&amp;/g,'&')
}
function fmtMs(t) {
  if (t == null) return '--:--.---'
  const m = Math.floor(t/60), s = Math.floor(t%60).toString().padStart(2,'0')
  const ms = Math.round((t%1)*1000).toString().padStart(3,'0')
  return `${m}:${s}.${ms}`
}
function fmtSec(t) { return `${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,'0')}` }
function fmtTTML(t) {
  if (t == null) t = 0
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60)
  const s = (t%60).toFixed(3).padStart(6,'0')
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${s}`
}

function splitWords(text) {
  if (!text) return []
  return text.match(/\S+/g) || []
}

function spicySplitToken(token) {
  if (!/[-\u2013\u2014]/.test(token)) return [token]
  const parts = token.split(/([-\u2013\u2014])/)
  const out = []
  let cur = ''
  for (const p of parts) {
    cur += p
    if (p === '-' || p === '\u2013' || p === '\u2014') { out.push(cur); cur = '' }
  }
  if (cur) out.push(cur)
  return out.filter(Boolean)
}

function spicyPrepWords(text) {
  const raw = text.match(/\S+/g) || []
  const out = []
  raw.forEach(tok => {
    spicySplitToken(tok).forEach((t, pi) => out.push({ word: t, tight: pi > 0 }))
  })
  return out
}

function expandBackslashSplits(tokens) {
  const out = []
  tokens.forEach(t => {
    if (!t.word.includes('\\')) { out.push(t); return }
    const parts = t.word.split('\\').filter(Boolean)
    if (!parts.length) return
    parts.forEach((p, pi) => out.push({ ...t, word: p, tight: pi === 0 ? t.tight : true }))
  })
  return out
}

function autoFillWordTimings(line, words, force = false) {
  if ((!force && !settings.autoCorrectWordTimings) || !Array.isArray(words) || !words.length) return
  let i = 0
  while (i < words.length) {
    if (words[i].time != null) { i++; continue }
    let j = i
    while (j < words.length && words[j].time == null) j++
    const prevEnd = i > 0 ? getWordEnd(words[i - 1]) : line?.time
    const nextStart = j < words.length ? getWordStart(words[j]) : line?.end
    if (force) {
      const editable = []
      for (let k = i; k <= j - 1; k++) if (!isTimingAnchor(words[k])) editable.push(k)
      if (editable.length && prevEnd != null && nextStart != null && nextStart > prevEnd) {
        const step = (nextStart - prevEnd) / editable.length
        editable.forEach((wordIdx, pos) => {
          words[wordIdx].time = prevEnd + (step * pos)
          words[wordIdx].end = pos === editable.length - 1 ? nextStart : prevEnd + (step * (pos + 1))
        })
      }
    } else {
      distributeUnlockedWords(words, i, j - 1, prevEnd, nextStart)
    }
    i = j
  }
}

function manualAutoFillWords(lineId, type) {
  const line = lines.find(l => l.id === lineId)
  if (!line) return
  const words = type === 'bg' ? line.bgWords : type === 'duo' ? line.duoWords : line.words
  if (!words?.length) return
  pushHistory('autofill timings')
  autoFillWordTimings(line, words, true)
  renderEditorFull(); renderPreview(audio.currentTime||0); scheduleSessionSave()
}

function mergeStandalonePunctuation(words) {
  const out = []
  for (const w of words) {
    if (out.length && /^[,.!?;:]+$/.test(w.word)) {
      const prev = out[out.length-1]
      prev.word += w.word
      if (w.end != null) prev.end = w.end
    } else {
      out.push({ ...w })
    }
  }
  return out
}

function extractParenBgText(text) {
  const bgParts = []
  const main = text.replace(/\(([^)]*)\)/g, (m, inner) => {
    const t = inner.trim()
    if (t) bgParts.push(t)
    return ' '
  }).replace(/\s+/g, ' ').trim()
  return { main, bg: bgParts.join(' ').trim() }
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n))
}

function getWordsForSelection(selection) {
  if (!selection) return null
  const line = lines.find(l => l.id === selection.lineId)
  if (!line) return null
  const words = selection.type === 'bg' ? line.bgWords : selection.type === 'duo' ? line.duoWords : line.words
  return { line, words }
}

function syncLineTimingFromWords(line, type) {
  if (!line || type !== 'main') return
  const ts = line.words.map(x => x.time).filter(x => x != null)
  const es = line.words.map(x => x.end).filter(x => x != null)
  if (ts.length) line.time = Math.min(...ts)
  if (es.length) line.end = Math.max(...es)
}

function markWordTimingEdited(word) {
  if (word) word.timingEdited = true
}

function isTimingAnchor(word) {
  return !!word?.timingEdited
}

function lineSignature(line) {
  if (!line) return ''
  return `${line.text||''}\u0001${line.bgText||''}\u0001${line.duoText||''}`
}

function propagatePacing(sourceWords, targetWords) {
  if (!sourceWords?.length || !targetWords?.length) return false
  if (sourceWords.length !== targetWords.length) return false
  const srcStart = sourceWords[0].time, srcEnd = sourceWords[sourceWords.length-1].end
  const tgtStart = targetWords[0].time, tgtEnd = targetWords[targetWords.length-1].end
  if (srcStart==null || srcEnd==null || tgtStart==null || tgtEnd==null) return false
  const srcDur = srcEnd - srcStart, tgtDur = tgtEnd - tgtStart
  if (srcDur <= 0 || tgtDur <= 0) return false
  let changed = false
  for (let i = 0; i < sourceWords.length; i++) {
    if (sourceWords[i].time == null || sourceWords[i].end == null) continue
    const fracStart = (sourceWords[i].time - srcStart) / srcDur
    const fracEnd = (sourceWords[i].end - srcStart) / srcDur
    const newTime = tgtStart + fracStart * tgtDur
    const newEnd = tgtStart + fracEnd * tgtDur
    if (targetWords[i].time !== newTime || targetWords[i].end !== newEnd) changed = true
    targetWords[i].time = newTime
    targetWords[i].end = newEnd
  }
  return changed
}

function propagatePacingToMatches(sourceLineId) {
  if (!settings.syncMatchingLinePacing) return false
  const source = lines.find(l => l.id === sourceLineId)
  if (!source) return false
  const sig = lineSignature(source)
  if (!sig || sig === '\u0001\u0001') return false
  let changed = false
  for (const target of lines) {
    if (target.id === sourceLineId) continue
    if (lineSignature(target) !== sig) continue
    if (propagatePacing(source.words, target.words)) changed = true
    if (source.bgWords?.length && propagatePacing(source.bgWords, target.bgWords)) changed = true
    if (source.duoWords?.length && propagatePacing(source.duoWords, target.duoWords)) changed = true
  }
  return changed
}

function getWordStart(word) {
  return word?.time != null ? word.time : null
}

function getWordEnd(word) {
  return word?.end != null ? word.end : getWordStart(word)
}

function getWordColor(index, type = 'main') {
  const offsets = { main: 0, bg: 38, duo: 74 }
  const hue = (index * 41 + (offsets[type] || 0)) % 360
  return `hsl(${hue} 84% 64%)`
}

function applyWordColor(el, index, type) {
  if (!settings.colorWordMarkers || !el) return
  el.classList.add('word-colored')
  el.style.setProperty('--word-color', getWordColor(index, type))
}

function drawSelectedWordMarkers(ctx, width, height, view) {
  if (!settings.colorWordMarkers || !selectedLineId || !view?.duration) return
  const line = lines.find(l => l.id === selectedLineId)
  if (!line) return
  const activeType = (selectedWord && selectedWord.lineId === selectedLineId) ? selectedWord.type : 'main'
  const words = activeType === 'bg' ? line.bgWords : activeType === 'duo' ? line.duoWords : line.words
  if (!words?.length) return
  ctx.save()
  words.forEach((word, index) => {
    if (word.time == null) return
    const start = word.time
    const end = word.end != null && word.end > start ? word.end : start + 0.08
    if (end < view.start || start > view.end) return
    const x1 = clamp(timeToWaveX(start, width, view), 0, width)
    const x2 = clamp(timeToWaveX(end, width, view), 0, width)
    const w = Math.max(2, x2 - x1)
    ctx.fillStyle = getWordColor(index, activeType)
    ctx.globalAlpha = 0.16
    ctx.fillRect(x1, 0, w, height)
    ctx.globalAlpha = 0.72
    ctx.fillRect(x1, 0, 2, height)
  })
  ctx.restore()
}

function seekToLine(line, play = true) {
  if (!line || line.time == null) return
  audio.currentTime = clamp(line.time, 0, audioDuration || line.time)
  waveformCenter = audio.currentTime
  updatePlayheads()
  if (waveformZoom > 1) drawWaveform()
  if (play) {
    audio.play()
    setPlayIcon(false)
  }
}

function selectLine(lineId) {
  const line = lines.find(l => l.id === lineId)
  if (!line) return
  selectedLineId = line.id
  selectedWord = null
  document.getElementById('tw-label').textContent = 'No word selected'
  document.getElementById('tw-label').style.color = 'var(--muted)'
  document.getElementById('timing-start').value = ''
  document.getElementById('timing-end').value = ''
  renderLines()
  renderEditorFull()
  updatePreviewLive(audio.currentTime||0)
  scheduleSessionSave()
}

function distributeUnlockedWords(words, startIdx, endIdx, startTime, endTime) {
  if (!settings.autoCorrectWordTimings) return
  if (!Array.isArray(words) || startIdx > endIdx) return
  if (startTime == null || endTime == null || endTime <= startTime) return
  const editable = []
  for (let i = startIdx; i <= endIdx; i++) {
    if (!isTimingAnchor(words[i])) editable.push(i)
  }
  if (!editable.length) return
  const step = (endTime - startTime) / editable.length
  editable.forEach((wordIdx, pos) => {
    words[wordIdx].time = startTime + (step * pos)
    words[wordIdx].end = pos === editable.length - 1 ? endTime : startTime + (step * (pos + 1))
  })
}

function autoCorrectAfterWordEdit(line, words, idx, field) {
  if (!settings.autoCorrectWordTimings || !line || !Array.isArray(words)) return
  const word = words[idx]
  if (!word) return
  const lineEnd = line.end != null ? line.end : getWordEnd(words[words.length - 1])
  const lineStart = line.time != null ? line.time : getWordStart(words[0])

  if (field === 'time' && idx > 0) {
    const prevAnchorIdx = (() => {
      for (let i = idx - 1; i >= 0; i--) if (isTimingAnchor(words[i])) return i
      return -1
    })()
    const startTime = prevAnchorIdx >= 0 ? getWordEnd(words[prevAnchorIdx]) : lineStart
    distributeUnlockedWords(words, prevAnchorIdx + 1, idx - 1, startTime, word.time)
  }

  const startTime = field === 'end' ? word.end : getWordEnd(word)
  if (startTime == null) return
  let nextAnchorIdx = -1
  for (let i = idx + 1; i < words.length; i++) {
    if (isTimingAnchor(words[i]) && getWordStart(words[i]) != null) {
      nextAnchorIdx = i
      break
    }
  }
  const endTime = nextAnchorIdx >= 0 ? getWordStart(words[nextAnchorIdx]) : lineEnd
  distributeUnlockedWords(words, idx + 1, nextAnchorIdx >= 0 ? nextAnchorIdx - 1 : words.length - 1, startTime, endTime)
}

function autoCorrectLineWords(line, changedField) {
  if (!settings.autoCorrectWordTimings || !line?.words?.length) return
  const words = line.words
  const lineStart = line.time
  const lineEnd = line.end
  if (changedField === 'time' && lineStart != null) {
    const firstAnchor = words.findIndex(w => isTimingAnchor(w) && getWordStart(w) != null)
    const endTime = firstAnchor >= 0 ? getWordStart(words[firstAnchor]) : lineEnd
    distributeUnlockedWords(words, 0, firstAnchor >= 0 ? firstAnchor - 1 : words.length - 1, lineStart, endTime)
  }
  if (changedField === 'end' && lineEnd != null) {
    let lastAnchor = -1
    for (let i = words.length - 1; i >= 0; i--) {
      if (isTimingAnchor(words[i]) && getWordEnd(words[i]) != null) {
        lastAnchor = i
        break
      }
    }
    const startTime = lastAnchor >= 0 ? getWordEnd(words[lastAnchor]) : lineStart
    distributeUnlockedWords(words, lastAnchor + 1, words.length - 1, startTime, lineEnd)
  }
}

function extractTrackGuess(name) {
  const cleaned = String(name || '')
    .replace(/\.[^.]+$/, '')
    .replace(/\[[^\]]*]/g, ' ')
    .replace(/\([^)]*(official|audio|video|lyrics|visualizer|mv)[^)]*\)/ig, ' ')
    .replace(/\s+/g, ' ')
    .trim()
  const patterns = [' - ', ' – ', ' — ', ' by ']
  for (const sep of patterns) {
    const idx = cleaned.indexOf(sep)
    if (idx > 0 && idx < cleaned.length - sep.length) {
      const left = cleaned.slice(0, idx).trim()
      const right = cleaned.slice(idx + sep.length).trim()
      if (left && right) {
        if (sep === ' by ') return { title: left, artist: right }
        return { artist: left, title: right }
      }
    }
  }
  return { title: cleaned, artist: '' }
}

async function loadAudioMetadata(fp) {
  currentAudioMetadata = null
  try {
    const metadata = await window.api.getAudioMetadata?.(fp)
    if (metadata && (metadata.title || metadata.artist || metadata.album)) {
      currentAudioMetadata = metadata
    }
  } catch {}
}

async function loadAudioFromPath(fp, opts = {}) {
  if (!fp) return
  await ensureWaveformSupport()
  const showLoader = opts.showLoader !== false
  const loadingToken = showLoader ? showLoadingModal('Loading Audio', 'Preparing playback and building the waveform...') : 0
  currentAudioPath = fp
  loadAudioMetadata(fp).catch(() => {})
  audioFileName = opts.audioFileName || fp.split(/[\\/]/).pop()
  document.getElementById('track-name').textContent = audioFileName
  document.getElementById('track-name').style.color = 'var(--text)'
  waveformPeaks = null
  waveformDecodeToken++
  audio.src = pathToFileUrl(fp)
  audio.load()
  setPlaybackSpeed(1)
  waveformZoom = Number.isFinite(opts.waveformZoom) ? opts.waveformZoom : 1
  waveformCenter = Number.isFinite(opts.waveformCenter) ? opts.waveformCenter : 0
  audio.onloadedmetadata = () => {
    audioDuration = audio.duration
    if (!Number.isFinite(opts.waveformCenter)) waveformCenter = audio.duration / 2
    const resumeTime = clamp(Number(opts.currentTime) || 0, 0, audio.duration || 0)
    audio.currentTime = resumeTime
    drawWaveform()
    updatePlayheads()
  }
  document.getElementById('sb-file').textContent = audioFileName
  setTimeout(async () => {
    try {
      await loadWaveformPeaks(fp)
    } catch (err) {
      showRuntimeError(`Waveform setup failed: ${err?.message || err}`)
    } finally {
      if (showLoader) hideLoadingModal(loadingToken)
    }
  }, 0)
}

async function restoreSession() {
  restoringSession = true
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY)
    if (!raw) return
    const session = JSON.parse(raw)
    lines = Array.isArray(session.lines) ? session.lines : []
    markers = Array.isArray(session.markers) ? session.markers : []
    selectedLineId = session.selectedLineId || null
    selectedWord = session.selectedWord || null
    audioFileName = session.audioFileName || ''
    songMeta = session.songMeta || { musicName: '', album: '', artists: [], songwriters: [] }
    currentAudioPath = session.currentAudioPath || ''
    currentAudioMetadata = session.currentAudioMetadata || null
    previewMode = session.previewMode || 'karaoke'
    filterText = session.filterText || ''
    waveformZoom = Number.isFinite(session.waveformZoom) ? session.waveformZoom : 1
    waveformCenter = Number.isFinite(session.waveformCenter) ? session.waveformCenter : 0
    currentProjectPath = session.currentProjectPath || null
    tapTimingCompleted = !!session.tapTimingCompleted
    if (currentProjectPath && window.api?.fileExists) {
      try {
        const exists = await window.api.fileExists(currentProjectPath)
        if (!exists) currentProjectPath = null
      } catch {}
    }
    if (currentAudioPath) {
      await loadAudioFromPath(currentAudioPath, {
        showLoader: false,
        audioFileName,
        currentTime: session.audioCurrentTime,
        waveformZoom,
        waveformCenter,
      })
    }
  } catch {}
  finally {
    restoringSession = false
  }
}

function ensurePreviewTicker() {
  if (previewAnimationFrame) return
  const tick = () => {
    previewAnimationFrame = 0
    if (!audio.paused && !audio.ended) {
      const t = settings.previewStyle === 'apple' ? getAppleClockTime() : (audio.currentTime || 0)
      updatePreviewLive(t)
      maybeKeepPlayheadVisible()
      updatePlayheads()
      previewAnimationFrame = requestAnimationFrame(tick)
    }
  }
  previewAnimationFrame = requestAnimationFrame(tick)
}

function stopPreviewTicker() {
  if (!previewAnimationFrame) return
  cancelAnimationFrame(previewAnimationFrame)
  previewAnimationFrame = 0
}

function getSessionSnapshot() {
  return {
    version: 1,
    savedAt: Date.now(),
    lines,
    markers,
    selectedLineId,
    selectedWord,
    audioFileName,
    songMeta,
    currentAudioPath,
    currentAudioMetadata,
    audioCurrentTime: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
    audioDuration,
    waveformZoom,
    waveformCenter,
    previewMode,
    filterText,
    currentProjectPath,
    tapTimingCompleted,
  }
}

function setProjectDirty(v) {
  projectDirty = v
  const dot = document.getElementById('projects-dirty-dot')
  if (dot) dot.classList.toggle('visible', v)
}

function saveSessionNow() {
  if (restoringSession) return
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(getSessionSnapshot()))
  } catch {}
  setProjectDirty(true)
}

function scheduleSessionSave() {
  if (restoringSession || undoRestoring) return
  clearTimeout(autosaveTimer)
  autosaveTimer = setTimeout(saveSessionNow, 250)
}

function sanitizeFileBase(name) {
  const safe = String(name || 'Untitled').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80)
  return safe || 'Untitled'
}

function getCurrentSongName() {
  return songMeta.musicName?.trim() || (audioFileName || '').replace(/\.[^.]+$/, '').trim() || 'Untitled'
}

function getProjectFileJSON(name) {
  return JSON.stringify({
    version: 1,
    name: name || getCurrentSongName(),
    savedAt: Date.now(),
    snapshot: getSessionSnapshot(),
  }, null, 2)
}

async function autosaveProjectTick() {
  if (!window.api?.autosaveProject) return
  if (!(settings.autosaveIntervalMinutes > 0)) return
  if (!projectDirty) return
  if (!lines.length && !audioFileName) return
  try {
    const json = getProjectFileJSON()
    await window.api.autosaveProject(getCurrentSongName(), json)
    setProjectDirty(false)
    lastAutosaveAt = Date.now()
    flashProjectsButton()
    if (document.getElementById('projects-dropdown')?.classList.contains('open')) renderProjectsDropdown()
  } catch (err) {
    showRuntimeError(`Autosave failed: ${err?.message || err}`)
  }
}

function startProjectAutosaveLoop() {
  if (projectAutosaveTimer) clearInterval(projectAutosaveTimer)
  const minutes = settings.autosaveIntervalMinutes > 0 ? settings.autosaveIntervalMinutes : 5
  projectAutosaveTimer = setInterval(autosaveProjectTick, minutes * 60 * 1000)
}

function flashProjectsButton() {
  const btn = document.getElementById('projects-btn')
  if (!btn) return
  btn.classList.add('flash-saved')
  setTimeout(() => btn.classList.remove('flash-saved'), 900)
}

async function applyProjectSnapshot(s, filePath, isAutosave) {
  restoringSession = true
  clearUndoHistory()
  try {
    lines = Array.isArray(s.lines) ? s.lines : []
    markers = Array.isArray(s.markers) ? s.markers : []
    selectedLineId = s.selectedLineId || null
    selectedWord = s.selectedWord || null
    audioFileName = s.audioFileName || ''
    songMeta = s.songMeta || { musicName: '', album: '', artists: [], songwriters: [] }
    currentAudioPath = s.currentAudioPath || ''
    currentAudioMetadata = s.currentAudioMetadata || null
    previewMode = s.previewMode || 'karaoke'
    filterText = s.filterText || ''
    waveformZoom = Number.isFinite(s.waveformZoom) ? s.waveformZoom : 1
    waveformCenter = Number.isFinite(s.waveformCenter) ? s.waveformCenter : 0
    currentProjectPath = isAutosave ? null : (filePath || null)
    tapTimingCompleted = !!s.tapTimingCompleted
    if (currentAudioPath) {
      await loadAudioFromPath(currentAudioPath, {
        showLoader: true,
        audioFileName,
        currentTime: s.audioCurrentTime,
        waveformZoom,
        waveformCenter,
      })
    }
  } finally {
    restoringSession = false
  }
  renderAll()
  drawWaveform()
  if (selectedWord) selectWord(selectedWord.lineId, selectedWord.idx, selectedWord.type)
  saveSessionNow()
  setProjectDirty(false)
}

function resetProjectToBlank() {
  restoringSession = true
  clearUndoHistory()
  try {
    lines = []
    markers = []
    multiSelectedLineIds.clear()
    multiSelectAnchorId = null
    bulkShiftArmed = false
    selectedLineId = null
    selectedWord = null
    audioFileName = ''
    songMeta = { musicName: '', album: '', artists: [], songwriters: [] }
    currentAudioPath = ''
    currentAudioMetadata = null
    previewMode = 'karaoke'
    filterText = ''
    waveformZoom = 1
    waveformCenter = 0
    currentProjectPath = null
    tapTimingCompleted = false
    if (tapTimingSession) endTapToTime(false)
    waveformDecodeToken++
    waveformPeaks = null
    audioDuration = 0
    audio.pause()
    audio.removeAttribute('src')
    audio.load()
    document.getElementById('track-name').textContent = 'No audio loaded'
    document.getElementById('track-name').style.color = ''
    document.getElementById('sb-file').textContent = ''
    document.getElementById('lines-search').value = ''
  } finally {
    restoringSession = false
  }
  renderAll()
  syncBulkSelectBar()
  drawWaveform()
  updatePlayheads()
  saveSessionNow()
  setProjectDirty(false)
}

async function loadProjectFromPath(filePath, isAutosave) {
  if (!window.api?.loadProjectFile) return
  try {
    const res = await window.api.loadProjectFile(filePath)
    if (!res?.content) return
    const parsed = JSON.parse(res.content)
    await applyProjectSnapshot(parsed.snapshot || {}, filePath, isAutosave)
  } catch (err) {
    showRuntimeError(`Couldn't load project: ${err?.message || err}`)
  }
}

async function saveCurrentProject(name) {
  if (!currentProjectPath) return saveCurrentProjectAsFile(name)
  if (!window.api?.saveProject) return
  const json = getProjectFileJSON(name)
  try {
    await window.api.saveProject(currentProjectPath, json)
    setProjectDirty(false)
    flashProjectsButton()
  } catch (err) {
    showRuntimeError(`Couldn't save project: ${err?.message || err}`)
  }
}

async function saveCurrentProjectAsFile(name) {
  if (!window.api?.saveProjectAs) return null
  const json = getProjectFileJSON(name)
  const suggested = `${sanitizeFileBase(name)}.ltproj`
  try {
    const fp = await window.api.saveProjectAs(json, suggested)
    if (!fp) return null
    currentProjectPath = fp
    setProjectDirty(false)
    flashProjectsButton()
    return fp
  } catch (err) {
    showRuntimeError(`Couldn't save project: ${err?.message || err}`)
    return null

async function deleteProjectFile(filePath) {
  if (!window.api?.deleteProjectFile) return
  await window.api.deleteProjectFile(filePath)

function fmtProjTime(ts) {
  try { return new Date(ts).toLocaleString() } catch { return '' }
}

function fmtRelTime(ms) {
  if (!ms) return ''
  const diff = Math.max(0, Date.now() - ms)
  if (diff < 45000) return 'just now'
  const mins = Math.round(diff / 60000)
  if (mins < 60) return `${mins}m ago`
  const hrs = Math.round(mins / 60)
  if (hrs < 24) return `${hrs}h ago`
  return `${Math.round(hrs / 24)}d ago`
}

function getQueue() {
  try {
    const raw = localStorage.getItem(QUEUE_KEY)
    const parsed = raw ? JSON.parse(raw) : []
    return Array.isArray(parsed) ? parsed : []
  } catch { return [] }
}

function saveQueue(list) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(list)) } catch {}
  updateQueueBadge()
}

function updateQueueBadge() {
  const n = getQueue().length
  const badge = document.getElementById('queue-count-badge')
  if (!badge) return
  badge.textContent = String(n)
  badge.classList.toggle('visible', n > 0)
}

function addToQueue(item) {
  if (!item?.path) return
  const list = getQueue().filter(q => q.path !== item.path)
  list.push({ ...item, queuedAt: Date.now() })
  saveQueue(list)
  if (document.getElementById('queue-dropdown')?.classList.contains('open')) renderQueueDropdown()
}

function removeFromQueue(path) {
  saveQueue(getQueue().filter(q => q.path !== path))
  renderQueueDropdown()
}

function clearQueue() {
  saveQueue([])
  renderQueueDropdown()
}

async function loadQueueItem(path, isAutosave) {
  removeFromQueue(path)
  closeQueueDropdown()
  await loadProjectFromPath(path, isAutosave)
}

async function loadNextInQueue() {
  const list = getQueue()
  if (!list.length) return
  const [next, ...rest] = list
  saveQueue(rest)
  closeQueueDropdown()
  await loadProjectFromPath(next.path, next.isAutosave)
}

function closeQueueDropdown() {

async function checkForCrashRecovery() {
  if (lines.length || audioFileName) return
  try {
    const [projects, autosaves] = await Promise.all([
      window.api?.listProjects?.() || [],
      window.api?.listAutosaves?.() || [],
    ])
    const candidates = [
      ...(projects || []).map(p => ({ ...p, isAutosave: false })),
      ...(autosaves || []).map(p => ({ ...p, isAutosave: true })),
    ].filter(p => (p.lineCount || 0) > 0)
    if (!candidates.length) return
    candidates.sort((a, b) => (b.savedAt || b.mtimeMs || 0) - (a.savedAt || a.mtimeMs || 0))
    const best = candidates[0]
    showModal('Recover Unsaved Work?', `
      <div class="mf">
        <p style="font-size:13px;line-height:1.6">Your last session didn't close properly, and nothing was restored automatically. We found <strong>${esc(best.name)}</strong>${best.isAutosave?' (autosave)':''} from ${esc(fmtProjTime(best.savedAt))} with ${best.lineCount||0} lines - want to load it back?</p>
      </div>
    `, [
      {label:"Don't Recover", fn:closeModal},
      {label:'Load It', primary:true, fn: async () => { closeModal(); await loadProjectFromPath(best.path, best.isAutosave) }}
    ])
  } catch {}
}

function compareVersions(a, b) {
  const pa = String(a||'').replace(/^v/i,'').split('.').map(n => parseInt(n,10)||0)
  const pb = String(b||'').replace(/^v/i,'').split('.').map(n => parseInt(n,10)||0)
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const da = pa[i]||0, db = pb[i]||0
    if (da > db) return 1
    if (da < db) return -1
  }
  return 0
}

function openUpdateUrl(url) {
  if (!url) return
  if (window.api?.openExternal) window.api.openExternal(url)
  else window.open(url, '_blank')
}

async function getUpdatePlatformInfo() {
  try {
    const info = await window.api?.getPlatform?.()
    if (info?.platform) return { platform: info.platform, arch: info.arch || 'x64' }
  } catch {}
  const ua = navigator.userAgent || ''
  if (/Mac/i.test(ua)) return { platform: 'darwin', arch: /arm|aarch64/i.test(ua) ? 'arm64' : 'x64' }
  if (/Linux/i.test(ua)) return { platform: 'linux', arch: /aarch64|arm64/i.test(ua) ? 'arm64' : 'x64' }
  return { platform: 'win32', arch: 'x64' }
}

function assetMatchesArch(name, arch) {
  const n = String(name || '').toLowerCase()
  const hasArm = /arm64|aarch64/.test(n)
  const hasX64 = /x64|amd64|x86_64/.test(n)
  if (arch === 'arm64') {
    if (hasArm) return 2
    if (!hasX64) return 1
    return 0
  }
  if (hasX64) return 2
  if (!hasArm) return 1
  return 0
}

function pickReleaseAsset(assets, platform, arch) {
  const list = Array.isArray(assets) ? assets.filter(a => a?.browser_download_url && a?.name) : []
  if (!list.length) return null

  const scored = []
  for (const asset of list) {
    const name = String(asset.name)
    const lower = name.toLowerCase()
    if (/\.(blockmap|yml|yaml|png|jpg|jpeg|gif|txt|md)$/i.test(lower)) continue
    if (/builder-debug/i.test(lower)) continue

    let platformScore = 0
    let kindScore = 0
    if (platform === 'win32') {
      if (!/\.exe$/i.test(lower)) continue
      platformScore = 3
      kindScore = /lokal-ttml-editor\.exe$/i.test(lower) ? 3 : 2
    } else if (platform === 'darwin') {
      if (!/\.(dmg|zip)$/i.test(lower)) continue
      if (!/(mac|darwin|osx|\.dmg$)/i.test(lower) && !/-mac\.zip$/i.test(lower)) continue
      platformScore = 3
      kindScore = /\.dmg$/i.test(lower) ? 3 : 2
    } else if (platform === 'linux') {
      if (!/\.(appimage|deb|rpm)$/i.test(lower)) continue
      platformScore = 3
      if (/\.appimage$/i.test(lower)) kindScore = 3
      else if (/\.deb$/i.test(lower)) kindScore = 2
      else kindScore = 1
    } else {
      continue
    }

    const archScore = assetMatchesArch(name, arch)
    if (!archScore && (platform === 'darwin' || platform === 'linux')) continue
    scored.push({ asset, score: platformScore * 100 + kindScore * 10 + archScore })
  }

  scored.sort((a, b) => b.score - a.score)
  return scored[0]?.asset || null
}

function platformLabel(platform) {
  if (platform === 'darwin') return 'macOS'
  if (platform === 'linux') return 'Linux'
  if (platform === 'win32') return 'Windows'
  return platform || 'this platform'
}

async function checkForUpdates(manual) {
  try {
    const res = await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`)
    if (!res.ok) throw new Error(`GitHub API error ${res.status}`)
    const data = await res.json()
    const latestTag = data.tag_name || data.name || ''
    if (!latestTag) throw new Error('No release found')
    if (compareVersions(latestTag, APP_VERSION) > 0) {
      const { platform, arch } = await getUpdatePlatformInfo()
      const asset = pickReleaseAsset(data.assets, platform, arch)
      const releaseUrl = data.html_url || `https://github.com/${UPDATE_REPO}/releases/latest`
      const downloadUrl = asset?.browser_download_url || null
      const assetName = asset?.name || ''
      const plat = platformLabel(platform)
      const assetHint = downloadUrl
        ? `<p style="font-size:12px;color:var(--muted);margin-top:8px">Download for ${esc(plat)}: <strong>${esc(assetName)}</strong></p>`
        : `<p style="font-size:12px;color:var(--muted);margin-top:8px">No direct ${esc(plat)} build was found in this release — open the release page to pick a download.</p>`
      const buttons = [
        {label:'Later', fn:closeModal},
        {label:'View Release', fn:() => { openUpdateUrl(releaseUrl); closeModal() }},
      ]
      if (downloadUrl) {
        buttons.push({label:'Download Update', primary:true, fn:() => { openUpdateUrl(downloadUrl); closeModal() }})
      } else {
        buttons[1].primary = true
      }
      showModal('Update Available', `
        <div class="mf">
          <p style="font-size:13px;line-height:1.6">A new version is available: <strong>${esc(latestTag)}</strong> - you're on <strong>v${esc(APP_VERSION)}</strong>.</p>
          ${assetHint}
          <div class="desc" style="margin-top:10px;white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--surface2);padding:10px;border-radius:6px">${esc((data.body||'').slice(0,700))}</div>
        </div>
      `, buttons)
    } else if (manual) {
      showModal('Up to Date', `<p style="font-size:13px;color:var(--muted)">You're on the latest version, v${esc(APP_VERSION)}.</p>`, [{label:'Close', fn:closeModal}])
    }
  } catch (err) {
    if (manual) showRuntimeError(`Update check failed: ${err?.message || err}`)
  }
}

  undoRestoring = true
  lines = Array.isArray(state.lines) ? state.lines : []
  selectedLineId = state.selectedLineId || null

  previewMode = state.previewMode || 'karaoke'

function pathToFileUrl(fp) {
  const normalized = String(fp || '').replace(/\\/g, '/')
  const withSlash = normalized.startsWith('/') ? normalized : `/${normalized}`
  return encodeURI(`file://${withSlash}`)
}

function normalizeWaveformBuckets(peaks) {
  return Array.isArray(peaks) ? peaks.map(bucket => {
    if (bucket && typeof bucket === 'object') {
      return {
        min: clamp(Number(bucket.min) || 0, -1, 1),
        max: clamp(Number(bucket.max) || 0, -1, 1),
        rms: clamp(Number(bucket.rms) || 0, 0, 1),
      }
    }
    const peak = clamp(Number(bucket) || 0, 0, 1)
    return { min: -peak, max: peak, rms: peak }
  }) : []
}

function getWaveformEngine() {
  return settings.waveformEngine || 'auto'
}

async function ensureWaveformSupport() {
  if (typeof waveformSupport.native === 'boolean') return waveformSupport
  try {
    waveformSupport.native = !!(await window.api.hasNativeWaveformDecoder?.())
  } catch {
    waveformSupport.native = false
  }
  return waveformSupport
}

function getEffectiveWaveformEngine() {
  const preferred = getWaveformEngine()
  if (preferred === 'native') return waveformSupport.native ? 'native' : 'browser'
  if (preferred === 'browser') return 'browser'
  return waveformSupport.native ? 'native' : 'browser'
}

async function loadWaveformPeaksNative(fp) {
  const result = await window.api.getWaveformPeaks(fp, NATIVE_WAVEFORM_POINTS)
  return normalizeWaveformBuckets(result?.peaks)
}

async function loadWaveformPeaksBrowser(fp) {
  const response = await fetch(pathToFileUrl(fp))
  if (!response.ok) throw new Error(`Failed to read audio file (${response.status})`)
  const arrayBuffer = await response.arrayBuffer()
  const AudioContextCtor = window.AudioContext || window.webkitAudioContext
  if (!AudioContextCtor) throw new Error('Web Audio API is unavailable')
  const ctx = new AudioContextCtor()
  try {
    const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0))
    const channelCount = Math.min(2, decoded.numberOfChannels || 1)
    const channels = Array.from({ length: channelCount }, (_, i) => decoded.getChannelData(i))
    const totalSamples = decoded.length || channels[0]?.length || 0
    if (!totalSamples) return []
    const points = BROWSER_WAVEFORM_POINTS
    const bucketSize = Math.max(1, Math.floor(totalSamples / points))
    const peaks = []
    for (let start = 0; start < totalSamples; start += bucketSize) {
      const end = Math.min(totalSamples, start + bucketSize)
      let min = 1
      let max = -1
      let sumSquares = 0
      for (let i = start; i < end; i++) {
        let value = 0
        for (let c = 0; c < channels.length; c++) value += channels[c][i] || 0
        value /= Math.max(1, channels.length)
        if (value < min) min = value
        if (value > max) max = value
        sumSquares += value * value
      }
      const count = Math.max(1, end - start)
      peaks.push({
        min: clamp(min, -1, 1),
        max: clamp(max, -1, 1),
        rms: clamp(Math.sqrt(sumSquares / count), 0.001, 1),
      })
    }
    return peaks
  } finally {
    try { await ctx.close() } catch {}
  }
}
