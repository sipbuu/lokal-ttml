async function loadWaveformPeaks(fp) {
  const token = ++waveformDecodeToken
  try {
    await ensureWaveformSupport()
    if (token !== waveformDecodeToken) return
    const effectiveEngine = getEffectiveWaveformEngine()
    const peaks = effectiveEngine === 'native'
      ? await loadWaveformPeaksNative(fp)
      : await loadWaveformPeaksBrowser(fp)
    if (token !== waveformDecodeToken) return
    waveformPeaks = peaks
    drawWaveform()
  } catch (err) {
    if (token !== waveformDecodeToken) return
    if (getWaveformEngine() === 'native') {
      showRuntimeError(`Waveform generation failed: ${err?.message || err}`)
      return
    }
    try {
      const fallbackPeaks = await loadWaveformPeaksBrowser(fp)
      if (token !== waveformDecodeToken) return
      waveformPeaks = fallbackPeaks
      drawWaveform()
    } catch (fallbackErr) {
      showRuntimeError(`Waveform generation failed: ${fallbackErr?.message || fallbackErr}`)
    }
  }
}

function getWaveformViewFor(center, zoom) {
  if (!audioDuration) return { start: 0, end: 0, duration: 0 }
  const visible = clamp(audioDuration / zoom, waveformMinWindow, audioDuration)
  const clampedCenter = clamp(center, visible / 2, Math.max(visible / 2, audioDuration - visible / 2))
  const start = clamp(clampedCenter - visible / 2, 0, Math.max(0, audioDuration - visible))
  return { start, end: start + visible, duration: visible }
}

function getCurrentWaveformCenter() {
  return Number.isFinite(waveformCenter) ? waveformCenter : (audio.currentTime || 0)
}

function zoomWaveformAtTime(anchorTime, anchorRatio, factor) {
  const nextZoom = clamp(waveformZoom * factor, 1, Math.max(1, audioDuration / waveformMinWindow))
  const nextVisible = clamp(audioDuration / nextZoom, waveformMinWindow, audioDuration)
  const boundedRatio = clamp(anchorRatio, 0, 1)
  waveformZoom = nextZoom
  waveformCenter = clamp(
    anchorTime - (boundedRatio * nextVisible) + (nextVisible / 2),
    nextVisible / 2,
    Math.max(nextVisible / 2, audioDuration - nextVisible / 2)
  )
  drawWaveform()
}

function getVisibleDuration() {
  if (!audioDuration) return 0
  return clamp(audioDuration / waveformZoom, waveformMinWindow, audioDuration)
}

function getWaveformView() {
  return getWaveformViewFor(getCurrentWaveformCenter(), waveformZoom)
}

function timeToWaveX(time, width, view = getWaveformView()) {
  if (!view.duration) return 0
  return ((time - view.start) / view.duration) * width
}

function waveXToTime(x, width, view = getWaveformView()) {
  if (!view.duration || !width) return 0
  return clamp(view.start + (x / width) * view.duration, 0, audioDuration)
}

function updateWaveformZoomLabel() {
  const el = document.getElementById('waveform-zoom-overlay')
  if (el) el.textContent = `${Math.round(waveformZoom * 100)}%`
}

function drawWaveformBars(ctx, width, height, opts = {}) {
  const view = opts.view || getWaveformView()
  const { start, end, duration } = view
  ctx.clearRect(0, 0, width, height)
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#111'
  ctx.fillRect(0, 0, width, height)
  if (!audioDuration || !duration) return

  const mid = height / 2
  const baseColor = getComputedStyle(document.documentElement).getPropertyValue('--muted2').trim() || '#555'
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e8ff57'
  const accentDim = getComputedStyle(document.documentElement).getPropertyValue('--accent-dim').trim() || 'rgba(200,255,87,0.12)'
  const border = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#222'
  const orange = getComputedStyle(document.documentElement).getPropertyValue('--orange').trim() || '#ffaa57'
  const orangeDim = getComputedStyle(document.documentElement).getPropertyValue('--orange-dim').trim() || 'rgba(255,170,87,0.2)'

  if (waveformPeaks && waveformPeaks.length) {
    const totalPeaks = waveformPeaks.length
    const startIndex = Math.max(0, Math.floor((start / audioDuration) * totalPeaks))
    const endIndex = Math.min(totalPeaks, Math.ceil((end / audioDuration) * totalPeaks))
    ctx.fillStyle = baseColor
    for (let x = 0; x < width; x++) {
      const pixelStart = startIndex + ((x / Math.max(1, width)) * (endIndex - startIndex))
      const pixelEnd = startIndex + (((x + 1) / Math.max(1, width)) * (endIndex - startIndex))
      const sliceStart = Math.max(startIndex, Math.floor(pixelStart))
      if (sliceStart >= endIndex) break
      const sliceEnd = Math.max(sliceStart + 1, Math.min(endIndex, Math.ceil(pixelEnd)))
      let min = 1
      let max = -1
      let rms = 0
      for (let i = sliceStart; i < sliceEnd; i++) {
        const bucket = waveformPeaks[i] || { min: 0, max: 0, rms: 0 }
        if (bucket.min < min) min = bucket.min
        if (bucket.max > max) max = bucket.max
        if (bucket.rms > rms) rms = bucket.rms
      }
      const top = Math.max(0, Math.min(height, mid - max * (height * 0.46)))
      const bottom = Math.max(top + 1, Math.min(height, mid - min * (height * 0.46)))
      ctx.globalAlpha = 0.35 + (rms * 0.65)
      ctx.fillRect(x, top, 1, Math.max(1, bottom - top))
    }
    ctx.globalAlpha = 1
  }

  ctx.strokeStyle = border
  ctx.lineWidth = 1
  const tickStep = duration <= 1 ? 0.05 : duration <= 4 ? 0.1 : duration <= 12 ? 0.25 : duration <= 40 ? 0.5 : duration <= 120 ? 1 : 2
  const firstTick = Math.ceil(start / tickStep) * tickStep
  for (let sec = firstTick; sec <= end; sec += tickStep) {
    const x = timeToWaveX(sec, width, view)
    ctx.beginPath()
    ctx.moveTo(x, 0)
    ctx.lineTo(x, height)
    ctx.stroke()
  }

  for (const line of lines) {
    if (line.time == null || line.time > end || effectiveEnd(line) < start) continue
    const x1 = clamp(timeToWaveX(line.time, width, view), 0, width)
    const x2 = clamp(timeToWaveX(line.end ?? line.time, width, view), 0, width)
    const isMultiSelected = multiSelectedLineIds.has(line.id)
    ctx.fillStyle = isMultiSelected ? orangeDim : accentDim
    ctx.fillRect(x1, 0, Math.max(2, x2 - x1), height)
    ctx.fillStyle = isMultiSelected ? orange : accent
    ctx.fillRect(x1, 0, 2, height)
  }
  drawSelectedWordMarkers(ctx, width, height, view)

  if (markers.length) {
    const purple = getComputedStyle(document.documentElement).getPropertyValue('--purple').trim() || '#a78bfa'
    ctx.fillStyle = purple
    for (const m of markers) {
      if (m.time < start || m.time > end) continue
      const x = timeToWaveX(m.time, width, view)
      ctx.fillRect(x, 0, 1, height)
      ctx.beginPath()
      ctx.moveTo(x - 4, 0)
      ctx.lineTo(x + 4, 0)
      ctx.lineTo(x, 6)
      ctx.closePath()
      ctx.fill()
    }
  }
}

function updatePlayheads() {
  if (!audioDuration) return
  const main = document.getElementById('waveform-canvas')
  const prog = document.getElementById('prog-track')
  const mainX = clamp(timeToWaveX(audio.currentTime, main.offsetWidth || 1), 0, main.offsetWidth || 1)
  document.getElementById('playhead').style.left = `${mainX}px`
  document.getElementById('prog-playhead').style.left = `${clamp((audio.currentTime / audioDuration) * (prog.clientWidth || 1), 0, prog.clientWidth || 1)}px`
}

function maybeKeepPlayheadVisible(force) {
  if (!force && settings.autoScrollWaveform === false) return
  const view = getWaveformView()
  if (!view.duration || waveformZoom <= 1) return
  const margin = view.duration * 0.15
  if (audio.currentTime < view.start + margin || audio.currentTime > view.end - margin) {
    waveformCenter = audio.currentTime
    drawWaveform()
  }
}

const speedSteps = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2]
function setPlaybackSpeed(rate) {
  audio.playbackRate = rate
  audio.preservesPitch = !!settings.preservePitchAtSpeed
  audio.mozPreservesPitch = !!settings.preservePitchAtSpeed
  audio.webkitPreservesPitch = !!settings.preservePitchAtSpeed
  const sel = document.getElementById('speed-select')
  if (sel && sel.value !== String(rate)) sel.value = String(rate)
}
function captureAudioTime() {
  const t = audio.currentTime || 0
  const rate = audio.playbackRate || 1
  if (rate === 1 || !settings.speedTimingOffsetMs) return t
  return clamp(t - (settings.speedTimingOffsetMs / 1000), 0, audioDuration || t)
}
function nudgePlaybackSpeed(dir) {
  const cur = audio.playbackRate || 1
  let idx = speedSteps.reduce((best,s,i) => Math.abs(s-cur) < Math.abs(speedSteps[best]-cur) ? i : best, 0)
  idx = clamp(idx + dir, 0, speedSteps.length-1)
  setPlaybackSpeed(speedSteps[idx])
}

function findWordEdgeAtX(x, width, view) {
  if (!settings.waveformDragRetime || !settings.colorWordMarkers || !selectedLineId || !view?.duration) return null
  const line = lines.find(l => l.id === selectedLineId)
  if (!line) return null
  const type = (selectedWord && selectedWord.lineId === selectedLineId) ? selectedWord.type : 'main'
  const words = type === 'bg' ? line.bgWords : type === 'duo' ? line.duoWords : line.words
  if (!words?.length) return null
  for (let i = 0; i < words.length; i++) {
    const w = words[i]
    if (w.time == null) continue
    const start = w.time
    const end = w.end != null && w.end > start ? w.end : start + 0.08
    const x1 = timeToWaveX(start, width, view)
    const x2 = timeToWaveX(end, width, view)
    if (Math.abs(x - x2) <= WF_EDGE_HIT_PX) return { line, words, idx: i, edge: 'end', type }
    if (Math.abs(x - x1) <= WF_EDGE_HIT_PX) return { line, words, idx: i, edge: 'time', type }
  }
  return null
}

function updateWfDragUiTick(drag) {

function waveformMouseDown(e) {

  }
  const hit = findWordEdgeAtX(x, rect.width, getWaveformView())

    if (!selectedWord || selectedWord.lineId !== hit.line.id || selectedWord.idx !== hit.idx || selectedWord.type !== hit.type) {

function waveformMouseMove(e) {
  if (bulkDrag) {
    const rect = document.getElementById('waveform-canvas').getBoundingClientRect()
    const x = clamp(e.clientX - rect.left, 0, rect.width)
    const t = waveXToTime(x, rect.width, getWaveformView())
    const totalDelta = t - bulkDrag.startTime
    const step = totalDelta - bulkDrag.appliedDelta
    if (step !== 0) {
      shiftLinesByIds(multiSelectedLineIds, step)
      bulkDrag.appliedDelta = totalDelta
      renderLines()
      if (selectedLineId && multiSelectedLineIds.has(selectedLineId)) renderEditorFull()
      drawWaveform()
    }
    return
  }
  if (wfDrag) {
    const rect = document.getElementById('waveform-canvas').getBoundingClientRect()
    const x = clamp(e.clientX - rect.left, 0, rect.width)
    const view = getWaveformView()
    let t = waveXToTime(x, rect.width, view)
    const { words, idx, edge } = wfDrag
    const w = words[idx]
    if (edge === 'time') {
      const prevEnd = idx > 0 ? (words[idx - 1].end ?? words[idx - 1].time ?? 0) : 0
      const maxT = (w.end != null ? w.end : audioDuration) - 0.01
      w.time = clamp(t, prevEnd, Math.max(prevEnd, maxT))
    } else {
      const nextStart = idx < words.length - 1 ? (words[idx + 1].time ?? audioDuration) : audioDuration
      const minT = (w.time != null ? w.time : 0) + 0.01
      w.end = clamp(t, minT, Math.max(minT, nextStart))
    }
    markWordTimingEdited(w)
    drawWaveform()
    updateWfDragUiTick(wfDrag)
    return
  }
  if (e.buttons === 1) { waveformSeek(e); return }
  const rect = document.getElementById('waveform-canvas').getBoundingClientRect()
  const x = clamp(e.clientX - rect.left, 0, rect.width)
  const hit = findWordEdgeAtX(x, rect.width, getWaveformView())
  document.getElementById('waveform-area').classList.toggle('wf-edge-hover', !!hit)
}

function buildSpicyLineParts(text) {
  const spicy = !!settings.spicyLyricsPrep
  let lineText = text
  let bgText = null
  if (spicy) {
    const extracted = extractParenBgText(lineText)
    lineText = extracted.main
    bgText = extracted.bg || null
  }
  const rawW = mergeStandalonePunctuation(spicy ? spicyPrepWords(lineText) : splitWords(lineText).map(w => ({ word: w, tight: false })))
  const bgRaw = bgText ? mergeStandalonePunctuation(spicy ? spicyPrepWords(bgText) : splitWords(bgText).map(w => ({ word: w, tight: false }))) : []
  return { lineText, bgText, rawW, bgRaw }
}

function parseLRC(lrc) {
  if (!lrc) return []
  const base = lrc.split('\n').map(raw => {
    const m = raw.match(/\[(\d+):(\d+\.?\d*)\](.*)/)
    if (!m) return null
    return { time: parseInt(m[1])*60+parseFloat(m[2]), text: m[3].trim() }
  }).filter(l => l && l.text).sort((a,b) => a.time-b.time)
  return base.map((line, i, arr) => {
    const nextTime = arr[i+1]?.time
    const end = nextTime || line.time+3
    const dur = Math.max(0.01, end-line.time)
    const { lineText, bgText, rawW, bgRaw } = buildSpicyLineParts(line.text)
    const words = rawW.map((rw,wi) => ({
      word:rw.word, tight:!!rw.tight, time:line.time+(wi*dur/rawW.length), end:line.time+((wi+1)*dur/rawW.length)
    }))
    const bgWords = bgRaw.map((rw,wi) => ({
      word:rw.word, tight:!!rw.tight, time:line.time+(wi*dur/bgRaw.length), end:line.time+((wi+1)*dur/bgRaw.length)
    }))
    return { id:genId(), time:line.time, end, text:lineText, words, bgWords, bgText, duoWords:[], duoText:null }
  })
}

function buildLineFromPlainText(text) {
  const { lineText, bgText, rawW, bgRaw } = buildSpicyLineParts(text)
  return {
    id:genId(), time:null, end:null, text:lineText,
    words:rawW.map(rw => ({ word:rw.word, tight:!!rw.tight, time:null, end:null })),
    bgWords:bgRaw.map(rw => ({ word:rw.word, tight:!!rw.tight, time:null, end:null })),
    bgText, duoWords:[], duoText:null
  }
}

function joinWordsText(words) {
  let s = ''
  words.forEach((w,i) => { s += (i>0 && !w.tight ? ' ' : '') + w.word })
  return s
}

function joinWordsForEditing(words) {
  let s = ''
  words.forEach((w,i) => { s += (i>0 ? (w.tight ? '\\' : ' ') : '') + w.word })
  return s
}

function parseSongMetaFromTTML(xml) {
  const meta = { musicName: '', album: '', artists: [], songwriters: [] }
  const metaBlockMatch = xml.match(/<metadata[\s\S]*?<\/metadata>/i)
  const metaBlock = metaBlockMatch ? metaBlockMatch[0] : ''
  const titleMatch = metaBlock.match(/<ttm:title>([\s\S]*?)<\/ttm:title>/i)
  if (titleMatch) meta.musicName = decodeXmlEntities(titleMatch[1]).trim()
  const metaTagRe = /<amll:meta\b[^>]*\bkey="([^"]+)"[^>]*\bvalue="([^"]*)"[^>]*\/?>/ig
  let mm
  while ((mm = metaTagRe.exec(metaBlock)) !== null) {
    const key = mm[1], val = decodeXmlEntities(mm[2]).trim()
    if (key === 'musicName') meta.musicName = val
    else if (key === 'album') meta.album = val
    else if (key === 'artists') meta.artists.push(val)
  }
  const swRe = /<songwriter>([\s\S]*?)<\/songwriter>/ig
  let sm
  while ((sm = swRe.exec(metaBlock)) !== null) meta.songwriters.push(decodeXmlEntities(sm[1]).trim())
  return meta
}

function parseTTML(xml) {
  if (!xml) return []
  songMeta = parseSongMetaFromTTML(xml)
  const out = []
  const norm = xml.replace(/\r/g,'').replace(/\n+/g,' ')
  function pt(t) {
    if (!t) return null
    const p = t.split(':')
    if (p.length===3) return +p[0]*3600 + +p[1]*60 + parseFloat(p[2])
    if (p.length===2) return +p[0]*60 + parseFloat(p[1])
    return parseFloat(p[0])
  }
  function extractRole(str, role) {
    const results = []
    const openReg = new RegExp(`<span\\b[^>]*\\b(?:ttm:role|role)\\s*=\\s*"\\s*${role}\\s*"[^>]*>`,'ig')
    let m
    while ((m = openReg.exec(str)) !== null) {
      const oi = m.index, ot = m[0]
      let depth = 1
      const nr = /<\/?span\b/ig; nr.lastIndex = oi+ot.length
      let nm
      while ((nm = nr.exec(str)) !== null) {
        const ti = nm.index
        if (str.slice(ti,ti+7).toLowerCase().startsWith('</span')) {
          depth--
          const cgt = str.indexOf('>',ti)
          if (depth===0) {
            const fe = cgt!==-1?cgt+1:ti+7
            const fg = str.indexOf('>',oi)
            results.push({ full:str.slice(oi,fe), inner:fg!==-1?str.slice(fg+1,ti):'' })
            openReg.lastIndex = fe; break
          } else { nr.lastIndex = cgt+1 }
        } else { depth++; nr.lastIndex = ti+6 }
      }
      if (nm===null) break
    }
    return results
  }
  function parseTimedWords(inner) {
    const words = []
    const wr = /<span\b[^>]*\bbegin="([^"]+)"(?:[^>]*\bend="([^"]+)")?[^>]*>([\s\S]*?)<\/span>/ig
    let prevEnd = null
    let prevHadTrailingSpace = false
    for (const wm of inner.matchAll(wr)) {
      const raw = decodeXmlEntities((wm[3]||'').replace(/<[^>]+>/g,''))
      const trimmed = raw.replace(/^\s+|\s+$/g,'')
      if (!trimmed) continue
      const st = pt(wm[1]), en = wm[2]?pt(wm[2]):null
      const gapBetween = prevEnd!=null ? inner.slice(prevEnd, wm.index) : ' '
      const tightNext = prevEnd!=null && !/\s/.test(gapBetween) && !prevHadTrailingSpace
      const hasTrailingSpace = raw.endsWith(' ')
      if (!hasTrailingSpace && trimmed.indexOf(' ') === -1) {
        words.push({word:trimmed, time:st, end:en, tight:tightNext, timingEdited:true})
      } else {
        const pieces = splitWords(trimmed)
        if (pieces.length === 1) { words.push({word:pieces[0],time:st,end:en,tight:tightNext,timingEdited:true}) }
        else {
          const dur = Math.max(0.001,(en?en-st:pieces.length*0.3))
          pieces.forEach((p,pi) => words.push({word:p,time:st+pi*(dur/pieces.length),end:st+(pi+1)*(dur/pieces.length),tight:pi===0?tightNext:false,timingEdited:true}))
        }
      }
      prevHadTrailingSpace = hasTrailingSpace
      prevEnd = wm.index + wm[0].length
    }
    return words
  }
  const pReg = /<p\b[^>]*\bbegin="([^"]+)"(?:[^>]*\bend="([^"]+)")?[^>]*>([\s\S]*?)<\/p>/ig
  for (const pm of norm.matchAll(pReg)) {
    const ls = pt(pm[1]), le = pm[2]?pt(pm[2]):null
    const openTag = pm[0].slice(0, pm[0].indexOf('>')+1)
    const agentMatch = openTag.match(/\bttm:agent\s*=\s*"([^"]+)"/)
    const isSecondaryAgent = !!agentMatch && agentMatch[1] !== 'v1'
    let inner = (pm[3]||'').trim()
    const bgMatches = extractRole(inner, 'x-bg')
    const duoMatches = extractRole(inner, 'x-alt')
    let bgWords = [], bgText = '', duoWords = [], duoText = ''
    for (const bm of bgMatches) { const w = mergeStandalonePunctuation(parseTimedWords(bm.inner)); bgWords.push(...w); bgText += (bgText?' ':'')+joinWordsText(w) }
    for (const dm of duoMatches) { const w = mergeStandalonePunctuation(parseTimedWords(dm.inner)); duoWords.push(...w); duoText += (duoText?' ':'')+joinWordsText(w) }
    for (const bm of [...bgMatches,...duoMatches]) inner = inner.split(bm.full).join(' ')
    const mw = parseTimedWords(inner)
    for (let i = 0; i < mw.length; i++) { if (mw[i].end==null) mw[i].end = mw[i+1]?.time||(le||(mw[i].time+0.5)) }
    for (let i = 0; i < bgWords.length; i++) { if (bgWords[i].end==null) bgWords[i].end = bgWords[i+1]?.time||(le||(bgWords[i].time+0.5)) }
    for (let i = 0; i < duoWords.length; i++) { if (duoWords[i].end==null) duoWords[i].end = duoWords[i+1]?.time||(le||(duoWords[i].time+0.5)) }
    const mwMerged = mergeStandalonePunctuation(mw)
    const bgWordsMerged = mergeStandalonePunctuation(bgWords)
    let duoWordsMerged = mergeStandalonePunctuation(duoWords)
    let mainWords = mwMerged
    let text = joinWordsText(mwMerged)
    if (isSecondaryAgent && mwMerged.length) {
      duoWordsMerged = duoWordsMerged.concat(mwMerged)
      duoText = duoText ? duoText+' '+text : text
      mainWords = []
      text = ''
    }
    if (mainWords.length||bgText||duoText) {
      out.push({
        id:genId(), time:ls, end:le, text,
        words:mainWords, bgWords:bgWordsMerged, bgText:bgText||null,
        duoWords:duoWordsMerged, duoText:duoText||null
      })
    }
  }
  return out.sort((a,b)=>(a.time||0)-(b.time||0))
}

async function openLyricsFile() {
  const result = await window.api.openLyrics()
  if (!result) return
  const { content, ext } = result
  let source = 'plain'
  if (ext==='lrc') { lines = parseLRC(content); source = 'lrc' }
  else if (ext==='ttml'||ext==='xml') { lines = parseTTML(content); source = 'ttml' }
  else lines = content.split('\n').filter(l=>l.trim()).map(l=>buildLineFromPlainText(l.trim()))
  tapTimingCompleted = source === 'ttml' && projectHasSolidWordTimings()
  renderAll(); drawWaveform()
  maybeOfferTapToTime(source)
}

function collectMainWordRefs() {
  const refs = []
  for (const line of lines) {
    ;(line.words || []).forEach((word, idx) => {
      refs.push({ line, word, idx, type: 'main' })
    })
  }
  return refs
}

function projectHasSolidWordTimings() {
  const refs = collectMainWordRefs()
  if (!refs.length) return false
  let timed = 0
  for (const { word } of refs) {
    if (word.time != null && word.end != null) timed++
  }
  return timed / refs.length >= 0.85
}

function projectNeedsFirstTapTiming(source) {
  if (tapTimingCompleted || tapTimingSession) return false
  if (!lines.length) return false
  if (source === 'ttml' && projectHasSolidWordTimings()) return false
  return true
}

function maybeOfferTapToTime(source) {
  if (!projectNeedsFirstTapTiming(source)) return
  setTimeout(() => {
    if (!projectNeedsFirstTapTiming(source)) return
    const isLrc = source === 'lrc'
    const body = isLrc ? `
      <p style="font-size:13px;line-height:1.65;color:var(--muted)">Your lyrics already have <strong>line</strong> timings (e.g. from LRCLIB). Word start/end times were only <strong>auto-estimated</strong> by evenly spreading each line's duration across its words — they are not real word-synced timings.</p>
      <p style="font-size:13px;line-height:1.65;color:var(--muted);margin-top:10px"><strong>Start Tap to Time</strong> does <em>not</em> auto-estimate anything for you. It clears those estimates so you can stamp each word yourself while the song plays.</p>
      <p style="font-size:13px;line-height:1.65;color:var(--muted);margin-top:10px"><strong>Skip for now</strong> keeps the current auto-estimated version from those LRCLIB/line timings, and you can still edit words manually later.</p>
      <p style="font-size:12px;line-height:1.6;color:var(--muted2);margin-top:10px">During tap mode: <kbd>Space</kbd> stamps the next word, <kbd>[</kbd>/<kbd>]</kbd> change speed, <kbd>Esc</kbd> exits. Slowing playback down is recommended.</p>
    ` : `
      <p style="font-size:13px;line-height:1.65;color:var(--muted)">This looks like a first pass on this project. Word timings are not locked in yet.</p>
      <p style="font-size:13px;line-height:1.65;color:var(--muted);margin-top:10px"><strong>Start Tap to Time</strong> does <em>not</em> auto-estimate words for you — you stamp each word live while the song plays (great first draft).</p>
      <p style="font-size:13px;line-height:1.65;color:var(--muted);margin-top:10px"><strong>Skip for now</strong> leaves things as they are so you can edit timings manually instead.</p>
      <p style="font-size:12px;line-height:1.6;color:var(--muted2);margin-top:10px">During tap mode: <kbd>Space</kbd> stamps the next word, <kbd>[</kbd>/<kbd>]</kbd> change speed, <kbd>Esc</kbd> exits. Slowing playback down is recommended.</p>
    `
    showModal('Tap to Time?', body, [
      { label: 'Skip for now', fn: () => {
        tapTimingCompleted = true
        scheduleSessionSave()

function renderTapTimingBar() {
  const bar = document.getElementById('tap-timing-bar')
  if (!bar) return
  if (!tapTimingSession) {
    bar.classList.remove('visible')
    bar.innerHTML = ''
    return
  }
  const { refs, index } = tapTimingSession
  const cur = refs[index]
  const speedOpts = [0.25, 0.5, 0.75, 1].map(r => `<option value="${r}" ${Math.abs((audio.playbackRate||1)-r)<0.01?'selected':''}>${r}x</option>`).join('')
  bar.innerHTML = `
    <div class="tt-title">Tap to Time</div>
    <div class="tt-meta">${Math.min(index + 1, refs.length)}/${refs.length}</div>
    <div class="tt-word">${cur ? esc(cur.word.word) : 'Done'}</div>
    <select id="tt-speed">${speedOpts}</select>
    <button class="sm-btn" id="tt-play">${audio.paused ? 'Play' : 'Pause'}</button>
    <button class="sm-btn" id="tt-undo" ${index<=0?'disabled':''}>Undo</button>
    <button class="sm-btn danger" id="tt-exit">Exit</button>
  `
  bar.classList.add('visible')
  document.getElementById('tt-speed')?.addEventListener('change', e => setPlaybackSpeed(parseFloat(e.target.value) || 0.5))
  document.getElementById('tt-play')?.addEventListener('click', () => { togglePlay(); renderTapTimingBar() })
  document.getElementById('tt-undo')?.addEventListener('click', () => undoTapToTime())
  document.getElementById('tt-exit')?.addEventListener('click', () => endTapToTime(true))
}

function startTapToTime() {
  const refs = collectMainWordRefs()
  if (!refs.length) return
  if (!currentAudioPath && !audio.src) {
    showModal('Need Audio', `<p style="font-size:13px;color:var(--muted)">Load an audio file first, then start Tap to Time.</p>`, [{ label: 'Close', fn: closeModal }])
    return
  }
  pushHistory('tap to time start')
  tapTimingSession = { refs, index: 0, stamps: [] }
  for (const { line, word } of refs) {
    word.time = null
    word.end = null
    word.timingEdited = false
    line.time = null
    line.end = null
  }
  setPlaybackSpeed(0.75)
  audio.currentTime = 0
  selectWord(refs[0].line.id, refs[0].idx, 'main')
  renderAll()
  drawWaveform()
  renderTapTimingBar()
  if (audio.paused) togglePlay()
}

function undoTapToTime() {
  if (!tapTimingSession || tapTimingSession.index <= 0) return
  const { refs, index, stamps } = tapTimingSession
  const prevIdx = index - 1
  const prev = refs[prevIdx]
  const stamp = stamps.pop()
  if (prev) {
    prev.word.time = stamp?.time ?? null
    prev.word.end = null
    prev.word.timingEdited = prev.word.time != null
    if (prevIdx === 0) prev.line.time = prev.word.time
  }
  if (index < refs.length) {
    const cur = refs[index]
    cur.word.time = null
    cur.word.end = null
    cur.word.timingEdited = false
  }
  tapTimingSession.index = prevIdx
  if (prev) {
    selectWord(prev.line.id, prev.idx, 'main')
    if (prev.word.time != null) audio.currentTime = Math.max(0, prev.word.time - 0.05)
  }
  renderAll(); drawWaveform(); renderTapTimingBar()
}

function tapToTimeStamp() {
  if (!tapTimingSession) return
  const { refs, index, stamps } = tapTimingSession
  if (index >= refs.length) {
    endTapToTime(true)
    return
  }
  const t = captureAudioTime()
  const cur = refs[index]
  cur.word.time = t
  markWordTimingEdited(cur.word)
  if (index > 0) {
    const prev = refs[index - 1]
    if (prev.word.time != null && t > prev.word.time) prev.word.end = t
    markWordTimingEdited(prev.word)
    syncLineTimingFromWords(prev.line, 'main')
  }
  if (index === 0 || cur.line.time == null || t < cur.line.time) cur.line.time = t
  stamps.push({ time: t })
  tapTimingSession.index = index + 1
  if (tapTimingSession.index >= refs.length) {
    const last = refs[refs.length - 1]
    if (last.word.time != null) {
      last.word.end = last.word.time + 0.35
      markWordTimingEdited(last.word)
      syncLineTimingFromWords(last.line, 'main')
    }
    endTapToTime(true)
    return
  }
  const next = refs[tapTimingSession.index]
  selectWord(next.line.id, next.idx, 'main')
  renderLines(); renderEditorFull(); renderPreview(audio.currentTime || 0); drawWaveform(); updateStatus()
  renderTapTimingBar()
  scheduleSessionSave()
}

function endTapToTime(markDone) {
  if (!tapTimingSession) return
  const { refs } = tapTimingSession
  for (let i = 0; i < refs.length; i++) {
    const cur = refs[i]
    if (cur.word.time != null && cur.word.end == null) {
      const next = refs[i + 1]
      cur.word.end = next?.word?.time != null && next.word.time > cur.word.time
        ? next.word.time
        : cur.word.time + 0.35
      markWordTimingEdited(cur.word)
    }
    syncLineTimingFromWords(cur.line, 'main')
  }
  tapTimingSession = null
  if (markDone) tapTimingCompleted = true
  renderTapTimingBar()
  renderAll()
  drawWaveform()
  scheduleSessionSave()
}

function tokenizeLyricsText(text) {
  return String(text || '').split(/\s+/).map(w => w.trim()).filter(Boolean)
}

function normLyricsWord(w) {
  return String(w || '').toLowerCase().replace(/[^\p{L}\p{N}']/gu, '')
}

function diffWordArrays(a, b) {
  const n = a.length, m = b.length
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0))
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = normLyricsWord(a[i]) === normLyricsWord(b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
    }
  }
  const ops = []
  let i = 0, j = 0
  while (i < n && j < m) {
    if (normLyricsWord(a[i]) === normLyricsWord(b[j])) { ops.push({ type: 'same', word: a[i] }); i++; j++ }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ type: 'remove', word: a[i] }); i++ }
    else { ops.push({ type: 'add', word: b[j] }); j++ }
  }
  while (i < n) { ops.push({ type: 'remove', word: a[i] }); i++ }
  while (j < m) { ops.push({ type: 'add', word: b[j] }); j++ }
  return ops
}

function showLyricsDiffModal(sourceLabel, sourceText) {
  const currentText = lines.map(l => joinWordsText(l.words || [])).filter(Boolean).join(' ')
  const cleanedSource = String(sourceText || '').replace(/\[\d+:\d+\.?\d*\]/g, '')
  const a = tokenizeLyricsText(currentText)
  const b = tokenizeLyricsText(cleanedSource)
  const ops = diffWordArrays(a, b)
  const addCount = ops.filter(o => o.type === 'add').length
  const removeCount = ops.filter(o => o.type === 'remove').length
  const html = ops.map(o => {
    if (o.type === 'same') return `<span>${esc(o.word)}</span>`
    if (o.type === 'remove') return `<span style="color:var(--red);text-decoration:line-through;opacity:.85" title="In your lyrics, not in ${escAttr(sourceLabel)}">${esc(o.word)}</span>`
    return `<span style="color:var(--accent);text-decoration:underline" title="In ${escAttr(sourceLabel)}, missing from yours">${esc(o.word)}</span>`
  }).join(' ')
  showModal(`Compare with ${esc(sourceLabel)}`, `
    <div class="mf">
      <p style="font-size:12px;color:var(--muted);line-height:1.6">
        <span style="color:var(--red)">Struck-through red</span> words are in your lyrics but not in ${esc(sourceLabel)} - possible typos or extras.
        <span style="color:var(--accent)">Underlined accent</span> words are in ${esc(sourceLabel)} but missing from yours.
      </p>
      <div class="desc" style="margin-top:10px;line-height:1.9;max-height:320px;overflow:auto;background:var(--surface2);padding:10px;border-radius:6px">${html || '<span style="color:var(--muted)">Nothing to compare.</span>'}</div>
      <div class="pd-hint" style="margin-top:8px">${addCount} missing word${addCount===1?'':'s'} · ${removeCount} extra/mismatched word${removeCount===1?'':'s'}</div>
    </div>
  `, [{ label: 'Close', fn: closeModal }])
}

async function searchLRCLIB() {
  const titleEl = document.getElementById('lr-title')
  const artistEl = document.getElementById('lr-artist')
  const t = titleEl?.value?.trim()
  const a = artistEl?.value?.trim()
  if (!t) return
  document.getElementById('lrclib-spinner').style.display = 'block'
  document.getElementById('lrclib-results').innerHTML = ''
  try {
    const q = new URLSearchParams({track_name:t})
    if (a) q.set('artist_name',a)
    const res = await fetch(`https://lrclib.net/api/search?${q}`)
    const data = await res.json()
    document.getElementById('lrclib-spinner').style.display = 'none'
    if (!data.length) { document.getElementById('lrclib-results').innerHTML = '<p style="color:var(--muted);font-size:12px;text-align:center;padding:12px">No results found</p>'; return }
    const container = document.getElementById('lrclib-results')
    for (const r of data.slice(0,12)) {
      const dur = r.duration ? `${Math.floor(r.duration/60)}:${String(Math.floor(r.duration%60)).padStart(2,'0')}` : ''
      const el = document.createElement('div')
      el.className = 'lrclib-result'
      const hasLyrics = !!(r.syncedLyrics || r.plainLyrics)
      el.innerHTML = `<div class="rt">${esc(r.trackName)}</div><div class="ra">${esc(r.artistName)}${r.albumName?' · '+esc(r.albumName):''}</div><div class="rb">${r.syncedLyrics?'<span class="lrclib-tag tag-synced">Synced</span>':'<span class="lrclib-tag tag-plain">Plain</span>'}${dur?`<span class="lrclib-tag tag-dur">${dur}</span>`:''}${hasLyrics && lines.length ? `<button class="sm-btn lr-compare-btn">Compare to current</button>` : ''}</div>`
      el.addEventListener('click', () => {
        const source = r.syncedLyrics ? 'lrc' : 'plain'
        if (r.syncedLyrics) lines = parseLRC(r.syncedLyrics)
        else if (r.plainLyrics) lines = r.plainLyrics.split('\n').filter(l=>l.trim()).map(l=>buildLineFromPlainText(l.trim()))
        tapTimingCompleted = false
        scheduleSessionSave()
        closeModal(); renderAll(); drawWaveform()
        maybeOfferTapToTime(source)
      })
      el.querySelector('.lr-compare-btn')?.addEventListener('click', e => {
        e.stopPropagation()
        showLyricsDiffModal(`${r.trackName} (LRCLIB)`, r.syncedLyrics || r.plainLyrics || '')
      })
      container.appendChild(el)
    }
  } catch(e) {
    document.getElementById('lrclib-spinner').style.display = 'none'
    document.getElementById('lrclib-results').innerHTML = '<p style="color:var(--red);font-size:12px;text-align:center;padding:12px">Failed to connect to LRCLIB</p>'
  }
}

function renderLines() {
  const list = document.getElementById('lines-list')
  list.innerHTML = ''
  const filtered = lines.filter(l => !filterText || l.text.toLowerCase().includes(filterText.toLowerCase()))
  for (const line of filtered) {
    const el = document.createElement('div')
    el.className = 'line-item' + (line.id===selectedLineId?' active':'') + (multiSelectedLineIds.has(line.id)?' multi-selected':'')
    el.dataset.id = line.id
    const untimed = line.words.filter(w=>w.time==null).length
    el.innerHTML = `<div style="display:flex;align-items:center;gap:6px"><div class="line-indicators">${line.bgWords?.length?'<span class="li-dot li-bg" title="Has background vocals"></span>':''}${line.duoWords?.length?'<span class="li-dot li-duo" title="Has duo/harmony vocals"></span>':''}</div><div class="line-time">${fmtMs(line.time)}</div></div><div class="line-text-preview">${esc(line.text)||'<em style="color:var(--muted)">(empty)</em>'}</div><div class="line-badges"><span class="badge badge-main">${line.words.length}w</span>${line.bgWords?.length?`<span class="badge badge-bg">bg ${line.bgWords.length}w</span>`:''}${line.duoWords?.length?`<span class="badge badge-duo">duo ${line.duoWords.length}w</span>`:''}${untimed?`<span class="badge badge-notimed">${untimed} untimed</span>`:''}</div>`
    el.addEventListener('click', (e) => {
      if (e.ctrlKey || e.metaKey) { toggleMultiSelectLine(line.id); return }
      if (e.shiftKey) { rangeSelectLinesTo(line.id); return }
      selectLine(line.id)
    })
    el.addEventListener('dblclick', () => {
      selectLine(line.id)
      seekToLine(line, true)
    })
    list.appendChild(el)
  }
  document.getElementById('line-count').textContent = lines.length
}

function toggleMultiSelectLine(id) {
  if (multiSelectedLineIds.has(id)) multiSelectedLineIds.delete(id)
  else multiSelectedLineIds.add(id)
  multiSelectAnchorId = id
  renderLines()
  syncBulkSelectBar()
}

function rangeSelectLinesTo(id) {
  const anchorIdx = lines.findIndex(l => l.id === (multiSelectAnchorId || id))
  const targetIdx = lines.findIndex(l => l.id === id)
  if (anchorIdx === -1 || targetIdx === -1) { toggleMultiSelectLine(id); return }
  const [from, to] = anchorIdx <= targetIdx ? [anchorIdx, targetIdx] : [targetIdx, anchorIdx]
  for (let i = from; i <= to; i++) multiSelectedLineIds.add(lines[i].id)
  multiSelectAnchorId = id
  renderLines()
  syncBulkSelectBar()
}

function selectRestOfSongFromSelection() {
  if (!multiSelectedLineIds.size) return
  let lastIdx = -1
  lines.forEach((l, i) => { if (multiSelectedLineIds.has(l.id)) lastIdx = Math.max(lastIdx, i) })
  for (let i = lastIdx + 1; i < lines.length; i++) multiSelectedLineIds.add(lines[i].id)
  renderLines()
  syncBulkSelectBar()
}

function clearMultiSelection() {
  multiSelectedLineIds.clear()
  multiSelectAnchorId = null
  bulkShiftArmed = false
  renderLines()
  syncBulkSelectBar()
  drawWaveform()
}

function syncBulkSelectBar() {
  const bar = document.getElementById('bulk-select-bar')
  if (!bar) return
  const n = multiSelectedLineIds.size
  bar.classList.toggle('hidden', n === 0)
  const countEl = document.getElementById('bulk-select-count')
  if (countEl) countEl.textContent = `${n} line${n===1?'':'s'} selected (${n>0?'Ctrl/Shift+click lines to adjust':''})`
  syncBulkDragButton()
}

function syncBulkDragButton() {
  const btn = document.getElementById('bulk-drag-toggle-btn')
  if (!btn) return
  btn.classList.toggle('active', bulkShiftArmed)
  btn.textContent = `⇄ Drag Shift: ${bulkShiftArmed ? 'On' : 'Off'}`
}

function toggleBulkDragArm() {
  if (!multiSelectedLineIds.size) return
  bulkShiftArmed = !bulkShiftArmed
  syncBulkDragButton()
}

function shiftLinesByIds(ids, delta) {
  const idSet = ids instanceof Set ? ids : new Set(ids)
  const shiftWords = (words) => {
    if (!words?.length) return
    for (const w of words) {
      if (w.time != null) w.time = Math.max(0, w.time + delta)
      if (w.end != null) w.end = Math.max(0, w.end + delta)
    }
  }
  for (const line of lines) {
    if (!idSet.has(line.id)) continue
    if (line.time != null) line.time = Math.max(0, line.time + delta)
    if (line.end != null) line.end = Math.max(0, line.end + delta)
    shiftWords(line.words)
    shiftWords(line.bgWords)
    shiftWords(line.duoWords)
  }
}

  if (!multiSelectedLineIds.size) return

    </div>
  `, [

        const delta = parseFloat(document.getElementById('shift-selected-seconds-input').value)
        closeModal()

  setTimeout(() => document.getElementById('shift-selected-seconds-input')?.focus(), 50)
}

document.getElementById('bulk-drag-toggle-btn')?.addEventListener('click', toggleBulkDragArm)

function effectiveEnd(line) {
  let end = line.end ?? 0
  const bgLast = line.bgWords?.length ? (line.bgWords[line.bgWords.length-1].end ?? 0) : 0
  const duoLast = line.duoWords?.length ? (line.duoWords[line.duoWords.length-1].end ?? 0) : 0
  return Math.max(end, bgLast, duoLast)
}

function renderEditorFull() {
  const editor = document.getElementById('word-editor')
  const empty = document.getElementById('empty-state')

  if (!selectedLineId) {
    empty.classList.remove('hidden')
    Array.from(editor.children).forEach(c => { if (c !== empty) c.remove() })
    return
  }

  empty.classList.add('hidden')
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return

  Array.from(editor.children).forEach(c => { if (c !== empty) c.remove() })

  const timingRow = document.createElement('div')
  timingRow.className = 'line-timing-row'
  timingRow.innerHTML = `<label>Line Start</label><input class="timing-sm" id="ls-input" value="${line.time!=null?line.time.toFixed(3):''}" placeholder="0.000" onchange="updateLineField('time',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><label>End</label><input class="timing-sm" id="le-input" value="${line.end!=null?line.end.toFixed(3):''}" placeholder="0.000" onchange="updateLineField('end',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="sm-btn" onclick="setLineFieldNow('time')">↙ Now</button><button class="sm-btn" onclick="setLineFieldNow('end')">↗ Now</button><button class="sm-btn danger" style="margin-left:auto" onclick="deleteLine('${line.id}')">Delete</button>`
  editor.appendChild(timingRow)

  editor.appendChild(buildWordRow(line.words, 'Main Vocals', '', line.id, 'main'))
  if (line.bgWords?.length) editor.appendChild(buildWordRow(line.bgWords, 'Background Vocals', 'lbl-bg', line.id, 'bg'))
  if (line.duoWords?.length) editor.appendChild(buildWordRow(line.duoWords, 'Duo / Harmony', 'lbl-duo', line.id, 'duo'))

  const addRow = document.createElement('div')
  addRow.style.cssText = 'display:flex;gap:8px;flex-shrink:0'
  if (!line.bgWords?.length) {
    const b = document.createElement('button')
    b.className = 'sm-btn'
    b.style.cssText = 'flex:1;padding:8px;border-style:dashed;color:var(--purple);border-color:rgba(192,87,255,.3)'
    b.textContent = '+ Background Vocals'
    b.addEventListener('click', () => addVocalLayer(line.id, 'bg'))
    addRow.appendChild(b)
  }
  if (!line.duoWords?.length) {
    const b = document.createElement('button')
    b.className = 'sm-btn'
    b.style.cssText = 'flex:1;padding:8px;border-style:dashed;color:var(--orange);border-color:rgba(255,170,87,.3)'
    b.textContent = '+ Duo / Harmony'
    b.addEventListener('click', () => addVocalLayer(line.id, 'duo'))
    addRow.appendChild(b)
  }
  if (addRow.children.length) editor.appendChild(addRow)
}

function getRoleData(line, type) {
  if (type==='bg') return { words: line.bgWords||[], text: line.bgText||null }
  if (type==='duo') return { words: line.duoWords||[], text: line.duoText||null }
  return { words: line.words||[], text: line.text||'' }
}
function setRoleData(line, type, data) {
  if (type==='bg') { line.bgWords = data.words; line.bgText = data.text }
  else if (type==='duo') { line.duoWords = data.words; line.duoText = data.text }
  else { line.words = data.words; line.text = data.text||'' }
}
function switchVocalRole(lineId, fromType, toType) {
  const line = lines.find(l=>l.id===lineId)
  if (!line || fromType===toType) return
  pushHistory('switch vocal role')
  const a = getRoleData(line, fromType)
  const b = getRoleData(line, toType)
  setRoleData(line, toType, a)
  setRoleData(line, fromType, b)
  selectedWord = null
  renderLines(); renderEditorFull(); renderPreview(audio.currentTime||0); drawWaveform()
  scheduleSessionSave()
  closeModal()
}
function promptSwitchVocalRole(lineId, fromType) {
  const labels = { main:'Main Vocals', bg:'Background Vocals', duo:'Duo / Harmony' }
  const others = ['main','bg','duo'].filter(t=>t!==fromType)
  const line = lines.find(l=>l.id===lineId)
  const rows = others.map(t=>{
    const data = getRoleData(line, t)
    const occupied = data.words?.length
    return `<button class="mbtn" data-switch-to="${t}" style="width:100%;text-align:left;margin-bottom:6px">${labels[t]}${occupied?' <span style="color:var(--muted2);font-weight:400">(swaps with existing words + timing)</span>':' <span style="color:var(--muted2);font-weight:400">(empty)</span>'}</button>`
  }).join('')
  showModal(`Move "${labels[fromType]}" to…`, `<div class="mf"><p style="color:var(--muted);margin:0 0 10px">This moves the words and timing into the other slot. If it already has content, they'll swap places instead of overwriting.</p>${rows}</div>`, [
    {label:'Cancel', fn:closeModal}
  ])
  document.querySelectorAll('#modal-body [data-switch-to]').forEach(btn => {
    btn.addEventListener('click', () => switchVocalRole(lineId, fromType, btn.dataset.switchTo))
  })
}

function buildWordRow(words, label, labelClass, lineId, type) {
  const row = document.createElement('div')
  row.className = 'word-row'
  const header = document.createElement('div')
  header.className = 'word-row-header'
  header.innerHTML = `<span class="word-row-label ${labelClass}">${label}</span>`
  const actions = document.createElement('div')
  actions.className = 'word-row-actions'
  const editBtn = document.createElement('button')
  editBtn.className = 'sm-btn'
  editBtn.textContent = 'Edit Text'
  editBtn.addEventListener('click', () => editWordsText(lineId, type))
  actions.appendChild(editBtn)
  const fillBtn = document.createElement('button')
  fillBtn.className = 'sm-btn'
  fillBtn.title = 'Fill in missing word timings by interpolating between known timings'
  fillBtn.textContent = 'Autofill Timings'
  fillBtn.addEventListener('click', () => manualAutoFillWords(lineId, type))
  actions.appendChild(fillBtn)
  const switchBtn = document.createElement('button')
  switchBtn.className = 'sm-btn'
  switchBtn.title = 'Move these words + timing to Main / Background / Duo'
  switchBtn.textContent = '⇄ Switch'
  switchBtn.addEventListener('click', () => promptSwitchVocalRole(lineId, type))
  actions.appendChild(switchBtn)
  if (type !== 'main') {
    const rmBtn = document.createElement('button')
    rmBtn.className = 'sm-btn danger'
    rmBtn.textContent = 'Remove'
    rmBtn.addEventListener('click', () => removeVocalLayer(lineId, type))
    actions.appendChild(rmBtn)
  }
  header.appendChild(actions)
  row.appendChild(header)

  const container = document.createElement('div')
  container.className = 'words-container'
  container.id = `wc-${lineId}-${type}`
  words.forEach((w, i) => {
    if (i > 0) {
      const gap = document.createElement('div')
      gap.className = `word-gap ${w.tight?'tight':''}`
      gap.title = w.tight ? 'No space before this word, click to add one' : 'Space before this word, click to join tight'
      gap.textContent = w.tight ? '‿' : '·'
      gap.addEventListener('click', (e) => { e.stopPropagation(); toggleWordGap(lineId, type, i) })
      container.appendChild(gap)
    }
    const chip = document.createElement('div')
    const isSel = selectedWord && selectedWord.lineId===lineId && selectedWord.idx===i && selectedWord.type===type
    const typeClass = type==='bg'?'bg-chip':type==='duo'?'duo-chip':''
    chip.className = `word-chip ${typeClass} ${isSel?'selected':''} ${w.time==null?'no-time':''}`
    applyWordColor(chip, i, type)
    chip.dataset.idx = i
    const wtText = document.createElement('div')
    wtText.className = 'wt-text'
    wtText.textContent = w.word
    const wtTimes = document.createElement('div')
    wtTimes.className = 'wt'
    const s1 = document.createElement('span'); s1.textContent = w.time!=null?w.time.toFixed(2):'??'
    const arrow = document.createElement('span'); arrow.style.color='var(--muted)'; arrow.textContent='→'
    const s2 = document.createElement('span'); s2.textContent = w.end!=null?w.end.toFixed(2):'??'
    wtTimes.appendChild(s1); wtTimes.appendChild(arrow); wtTimes.appendChild(s2)
    chip.appendChild(wtText)
    if (settings.showTimecodes) chip.appendChild(wtTimes)
    chip.addEventListener('click', () => selectWord(lineId, i, type))
    chip.addEventListener('dblclick', () => { if (w.time!=null) { audio.currentTime=w.time; audio.play(); setPlayIcon(false) } })
    container.appendChild(chip)
  })
  row.appendChild(container)
  return row
}

function selectWord(lineId, idx, type) {
  selectedWord = { lineId, idx, type }
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const w = words[idx]
  document.getElementById('tw-label').textContent = `"${w.word}"`
  document.getElementById('tw-label').style.color = 'var(--text)'
  document.getElementById('timing-start').value = w.time!=null?w.time.toFixed(3):''
  document.getElementById('timing-end').value = w.end!=null?w.end.toFixed(3):''

  document.querySelectorAll('.word-chip.selected').forEach(c => c.classList.remove('selected'))
  const container = document.getElementById(`wc-${lineId}-${type}`)
  if (container) container.children[idx]?.classList.add('selected')
  drawWaveform()
  scheduleSessionSave()
}

function updateEditorActiveWords(t) {
  if (!selectedLineId) return
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return
  const allTypes = [
    { words: line.words, type: 'main' },
    { words: line.bgWords||[], type: 'bg' },
    { words: line.duoWords||[], type: 'duo' }
  ]
  for (const { words, type } of allTypes) {
    const container = document.getElementById(`wc-${selectedLineId}-${type}`)
    if (!container) continue
    words.forEach((w, i) => {
      const chip = container.children[i]
      if (!chip) return
      const isActive = w.time!=null && t>=w.time && (w.end==null||t<w.end)
      const isSel = selectedWord && selectedWord.lineId===selectedLineId && selectedWord.idx===i && selectedWord.type===type
      chip.classList.toggle('active-now', isActive && !isSel)
    })
  }
}

function toggleWordGap(lineId, type, idx) {
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const w = words[idx]
  if (!w) return
  pushHistory('toggle word spacing')
  w.tight = !w.tight
  renderEditorFull()
  renderPreview(audio.currentTime||0)
  scheduleSessionSave()
}

function updateWordTime(field, val) {
  if (!selectedWord) return
  const target = getWordsForSelection(selectedWord)
  if (!target) return
  const { line, words } = target
  const t = parseFloat(val)
  if (!isNaN(t)) {
    pushHistory('word timing')
    const preservedLineEnd = line.end
    words[selectedWord.idx][field] = t
    markWordTimingEdited(words[selectedWord.idx])
    autoCorrectAfterWordEdit(line, words, selectedWord.idx, field)
    syncLineTimingFromWords(line, selectedWord.type)
    if (selectedWord.type === 'main' && preservedLineEnd != null) line.end = preservedLineEnd
    propagatePacingToMatches(line.id)
    renderLines(); renderEditorFull(); updateStatus(); drawWaveform()
    const container = document.getElementById(`wc-${selectedWord.lineId}-${selectedWord.type}`)
    const chip = container?.children[selectedWord.idx]
    if (chip) {
      const spans = chip.querySelectorAll('.wt span')
      const w = words[selectedWord.idx]
      if (spans[0]) spans[0].textContent = w.time!=null?w.time.toFixed(2):'??'
      if (spans[2]) spans[2].textContent = w.end!=null?w.end.toFixed(2):'??'
      chip.classList.toggle('no-time', w.time==null)
    }
    scheduleSessionSave()
  }
}

function setStartNow() {
  if (!selectedWord) return
  const t = captureAudioTime()
  document.getElementById('timing-start').value = t.toFixed(3)
  updateWordTime('time', t)
}
function setEndNow() {
  if (!selectedWord) return
  const t = captureAudioTime()
  const target = getWordsForSelection(selectedWord)
  if (!target) return
  const { line, words } = target
  const preservedLineEnd = line.end
  document.getElementById('timing-end').value = t.toFixed(3)
  updateWordTime('end', t)
  const nextIdx = selectedWord.idx + 1
  if (nextIdx < words.length) {
    if (!settings.autoCorrectWordTimings || !isTimingAnchor(words[nextIdx])) {
      words[nextIdx].time = t
    }
    syncLineTimingFromWords(line, selectedWord.type)
    if (selectedWord.type === 'main' && preservedLineEnd != null) line.end = preservedLineEnd
    propagatePacingToMatches(line.id)
    renderLines()
    renderEditorFull()
    updateStatus()
    drawWaveform()
    selectWord(selectedWord.lineId, nextIdx, selectedWord.type)
  }
}
function updateLineField(field, val) {
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return
  const t = parseFloat(val)
  if (!isNaN(t)) {
    pushHistory('line timing')
    const key = field==='time'?'time':'end'
    line[key]=t
    autoCorrectLineWords(line, key)
    propagatePacingToMatches(line.id)
    renderLines()
    renderEditorFull()
    drawWaveform()
    scheduleSessionSave()
  }
}
function setLineFieldNow(field) {
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return
  pushHistory('line timing')
  line[field] = audio.currentTime
  autoCorrectLineWords(line, field)
  propagatePacingToMatches(line.id)
  const el = document.getElementById(field==='time'?'ls-input':'le-input')
  if (el) el.value = line[field].toFixed(3)
  renderLines(); renderEditorFull(); drawWaveform()
  scheduleSessionSave()
}
function deleteLine(id) {
  pushHistory('delete line')
  lines = lines.filter(l=>l.id!==id)
  if (selectedLineId===id) { selectedLineId=null; selectedWord=null }
  if (multiSelectedLineIds.has(id)) { multiSelectedLineIds.delete(id); syncBulkSelectBar() }
  renderAll(); drawWaveform()
  scheduleSessionSave()
}

function removeVocalLayer(lineId, type) {

function editWordsText(lineId, type) {
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const current = joinWordsForEditing(words)
  showModal('Edit Words', `<div class="mf"><label>Words with timings kept by position</label><textarea class="mi mta" id="ew-text">${esc(current)}</textarea><div class="desc" style="margin-top:6px">Tip: use "\\" to split a word into connected sections with independent timing, e.g. "bed\\room". Existing splits show up here as "\\" too, and you can remove one to merge that split back together.</div></div>`, [
    {label:'Cancel',fn:closeModal},
    {label:'Update',primary:true,fn:()=>{
      const raw = document.getElementById('ew-text').value
      const plainTokens = splitWords(raw)
      const rawWords = []
      plainTokens.forEach(tok => {
        if (tok.includes('\\')) {
          rawWords.push({ word: tok, tight: false })
        } else if (settings.spicyLyricsPrep) {
          spicySplitToken(tok).forEach((t,pi) => rawWords.push({ word: t, tight: pi > 0 }))
        } else {
          rawWords.push({ word: tok, tight: false })
        }
      })
      let updatedRaw = []
      let oldIdx = 0
      rawWords.forEach(rw => {
        const parts = rw.word.includes('\\') ? rw.word.split('\\').filter(Boolean) : [rw.word]
        if (parts.length <= 1 || settings.preserveTimingOnWordSplit === false) {
          const old = words[oldIdx]
          if (parts.length <= 1) {
            updatedRaw.push({ word:parts[0]||rw.word, tight:!!rw.tight, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited })
          } else {
            parts.forEach((p,pi) => updatedRaw.push({ word:p, tight:pi===0?!!rw.tight:true, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited }))
          }
          oldIdx += 1
          return
        }
        let clusterLen = 1
        while (oldIdx+clusterLen < words.length && words[oldIdx+clusterLen]?.tight) clusterLen++
        if (clusterLen === parts.length) {
          for (let k = 0; k < parts.length; k++) {
            const old = words[oldIdx+k]
            updatedRaw.push({ word:parts[k], tight:k===0?!!rw.tight:true, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited })
          }
        } else {
          const spanStart = words[oldIdx], spanEndWord = words[oldIdx+clusterLen-1]
          const oldTime = spanStart?.time ?? null, oldEnd = spanEndWord?.end ?? null
          const totalLen = parts.reduce((s,p)=>s+p.length,0) || parts.length
          let cursor = oldTime
          parts.forEach((p,pi) => {
            let pTime = null, pEnd = null
            if (oldTime != null && oldEnd != null) {
              const dur = oldEnd - oldTime
              pTime = cursor
              pEnd = pi === parts.length-1 ? oldEnd : cursor + dur * (p.length / totalLen)
              cursor = pEnd
            }
            updatedRaw.push({ word:p, tight:pi===0?!!rw.tight:true, time:pTime, end:pEnd, timingEdited: pi===0?!!spanStart?.timingEdited:false })
          })
        }
        oldIdx += clusterLen
      })
      const updated = mergeStandalonePunctuation(updatedRaw)
      pushHistory('edit words')
      autoFillWordTimings(line, updated)
      if (type==='bg') { line.bgWords=updated; line.bgText=updated.length?joinWordsText(updated):null }
      else if (type==='duo') { line.duoWords=updated; line.duoText=updated.length?joinWordsText(updated):null }
      else { line.words=updated; line.text=joinWordsText(updated) }
      closeModal(); renderAll()
    }}
  ])
  setTimeout(()=>document.getElementById('ew-text')?.focus(),50)
}
