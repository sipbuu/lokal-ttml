async function searchLRCLIB() {
  const titleEl = document.getElementById('lr-title')
  const artistEl = document.getElementById('lr-artist')
  const t = titleEl?.value?.trim()
  const a = artistEl?.value?.trim()
  if (!t) return
  document.getElementById('lrclib-spinner').style.display = 'block'
  document.getElementById('lrclib-results').innerHTML = ''
  try {
    const q = new URLSearchParams({track_name:t})
    if (a) q.set('artist_name',a)
    const res = await fetch(`https://lrclib.net/api/search?${q}`)
    const data = await res.json()
    document.getElementById('lrclib-spinner').style.display = 'none'
    if (!data.length) { document.getElementById('lrclib-results').innerHTML = '<p style="color:var(--muted);font-size:12px;text-align:center;padding:12px">No results found</p>'; return }
    const container = document.getElementById('lrclib-results')
    for (const r of data.slice(0,12)) {
      const dur = r.duration ? `${Math.floor(r.duration/60)}:${String(Math.floor(r.duration%60)).padStart(2,'0')}` : ''
      const el = document.createElement('div')
      el.className = 'lrclib-result'
      el.innerHTML = `<div class="rt">${esc(r.trackName)}</div><div class="ra">${esc(r.artistName)}${r.albumName?' · '+esc(r.albumName):''}</div><div class="rb">${r.syncedLyrics?'<span class="lrclib-tag tag-synced">Synced</span>':'<span class="lrclib-tag tag-plain">Plain</span>'}${dur?`<span class="lrclib-tag tag-dur">${dur}</span>`:''}</div>`
      el.addEventListener('click', () => {
        if (r.syncedLyrics) lines = parseLRC(r.syncedLyrics)
        else if (r.plainLyrics) lines = r.plainLyrics.split('\n').filter(l=>l.trim()).map(l=>buildLineFromPlainText(l.trim()))
        scheduleSessionSave()
        closeModal(); renderAll(); drawWaveform()
      })
      container.appendChild(el)
    }
  } catch(e) {
    document.getElementById('lrclib-spinner').style.display = 'none'
    document.getElementById('lrclib-results').innerHTML = '<p style="color:var(--red);font-size:12px;text-align:center;padding:12px">Failed to connect to LRCLIB</p>'
  }
}

function renderAll() {
  scheduleSessionSave()
  renderLines(); renderEditorFull(); renderPreview(audio.currentTime||0); updateStatus()
}

function renderLines() {
  const list = document.getElementById('lines-list')
  list.innerHTML = ''
  const filtered = lines.filter(l => !filterText || l.text.toLowerCase().includes(filterText.toLowerCase()))
  for (const line of filtered) {
    const el = document.createElement('div')
    el.className = 'line-item' + (line.id===selectedLineId?' active':'')
    el.dataset.id = line.id
    const untimed = line.words.filter(w=>w.time==null).length
    el.innerHTML = `<div class="line-time">${fmtMs(line.time)}</div><div class="line-text-preview">${esc(line.text)||'<em style="color:var(--muted)">(empty)</em>'}</div><div class="line-badges"><span class="badge badge-main">${line.words.length}w</span>${line.bgWords?.length?`<span class="badge badge-bg">bg ${line.bgWords.length}w</span>`:''}${line.duoWords?.length?`<span class="badge badge-duo">duo ${line.duoWords.length}w</span>`:''}${untimed?`<span class="badge badge-notimed">${untimed} untimed</span>`:''}</div>`
    el.addEventListener('click', () => selectLine(line.id))
    el.addEventListener('dblclick', () => {
      selectLine(line.id)
      seekToLine(line, true)
    })
    list.appendChild(el)
  }
  document.getElementById('line-count').textContent = lines.length
}

function effectiveEnd(line) {
  let end = line.end ?? 0
  const bgLast = line.bgWords?.length ? (line.bgWords[line.bgWords.length-1].end ?? 0) : 0
  const duoLast = line.duoWords?.length ? (line.duoWords[line.duoWords.length-1].end ?? 0) : 0
  return Math.max(end, bgLast, duoLast)
}

function renderEditorFull() {
  const editor = document.getElementById('word-editor')
  const empty = document.getElementById('empty-state')

  if (!selectedLineId) {
    empty.classList.remove('hidden')
    Array.from(editor.children).forEach(c => { if (c !== empty) c.remove() })
    return
  }

  empty.classList.add('hidden')
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return

  Array.from(editor.children).forEach(c => { if (c !== empty) c.remove() })

  const timingRow = document.createElement('div')
  timingRow.className = 'line-timing-row'
  timingRow.innerHTML = `<label>Line Start</label><input class="timing-sm" id="ls-input" value="${line.time!=null?line.time.toFixed(3):''}" placeholder="0.000" onchange="updateLineField('time',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><label>End</label><input class="timing-sm" id="le-input" value="${line.end!=null?line.end.toFixed(3):''}" placeholder="0.000" onchange="updateLineField('end',this.value)" onkeydown="if(event.key==='Enter')this.blur()"><button class="sm-btn" onclick="setLineFieldNow('time')">↙ Now</button><button class="sm-btn" onclick="setLineFieldNow('end')">↗ Now</button><button class="sm-btn danger" style="margin-left:auto" onclick="deleteLine('${line.id}')">Delete</button>`
  editor.appendChild(timingRow)

  editor.appendChild(buildWordRow(line.words, 'Main Vocals', '', line.id, 'main'))
  if (line.bgWords?.length) editor.appendChild(buildWordRow(line.bgWords, 'Background Vocals', 'lbl-bg', line.id, 'bg'))
  if (line.duoWords?.length) editor.appendChild(buildWordRow(line.duoWords, 'Duo / Harmony', 'lbl-duo', line.id, 'duo'))

  const addRow = document.createElement('div')
  addRow.style.cssText = 'display:flex;gap:8px;flex-shrink:0'
  if (!line.bgWords?.length) {
    const b = document.createElement('button')
    b.className = 'sm-btn'
    b.style.cssText = 'flex:1;padding:8px;border-style:dashed;color:var(--purple);border-color:rgba(192,87,255,.3)'
    b.textContent = '+ Background Vocals'
    b.addEventListener('click', () => addVocalLayer(line.id, 'bg'))
    addRow.appendChild(b)
  }
  if (!line.duoWords?.length) {
    const b = document.createElement('button')
    b.className = 'sm-btn'
    b.style.cssText = 'flex:1;padding:8px;border-style:dashed;color:var(--orange);border-color:rgba(255,170,87,.3)'
    b.textContent = '+ Duo / Harmony'
    b.addEventListener('click', () => addVocalLayer(line.id, 'duo'))
    addRow.appendChild(b)
  }
  if (addRow.children.length) editor.appendChild(addRow)
}

function getRoleData(line, type) {
  if (type==='bg') return { words: line.bgWords||[], text: line.bgText||null }
  if (type==='duo') return { words: line.duoWords||[], text: line.duoText||null }
  return { words: line.words||[], text: line.text||'' }
}
function setRoleData(line, type, data) {
  if (type==='bg') { line.bgWords = data.words; line.bgText = data.text }
  else if (type==='duo') { line.duoWords = data.words; line.duoText = data.text }
  else { line.words = data.words; line.text = data.text||'' }
}
function switchVocalRole(lineId, fromType, toType) {
  const line = lines.find(l=>l.id===lineId)
  if (!line || fromType===toType) return
  pushHistory('switch vocal role')
  const a = getRoleData(line, fromType)
  const b = getRoleData(line, toType)
  setRoleData(line, toType, a)
  setRoleData(line, fromType, b)
  selectedWord = null
  renderLines(); renderEditorFull(); renderPreview(audio.currentTime||0); drawWaveform()
  scheduleSessionSave()
  closeModal()
}
function promptSwitchVocalRole(lineId, fromType) {
  const labels = { main:'Main Vocals', bg:'Background Vocals', duo:'Duo / Harmony' }
  const others = ['main','bg','duo'].filter(t=>t!==fromType)
  const line = lines.find(l=>l.id===lineId)
  const rows = others.map(t=>{
    const data = getRoleData(line, t)
    const occupied = data.words?.length
    return `<button class="mbtn" data-switch-to="${t}" style="width:100%;text-align:left;margin-bottom:6px">${labels[t]}${occupied?' <span style="color:var(--muted2);font-weight:400">(swaps with existing words + timing)</span>':' <span style="color:var(--muted2);font-weight:400">(empty)</span>'}</button>`
  }).join('')
  showModal(`Move "${labels[fromType]}" to…`, `<div class="mf"><p style="color:var(--muted);margin:0 0 10px">This moves the words and timing into the other slot. If it already has content, they'll swap places instead of overwriting.</p>${rows}</div>`, [
    {label:'Cancel', fn:closeModal}
  ])
  document.querySelectorAll('#modal-body [data-switch-to]').forEach(btn => {
    btn.addEventListener('click', () => switchVocalRole(lineId, fromType, btn.dataset.switchTo))
  })
}

function buildWordRow(words, label, labelClass, lineId, type) {
  const row = document.createElement('div')
  row.className = 'word-row'
  const header = document.createElement('div')
  header.className = 'word-row-header'
  header.innerHTML = `<span class="word-row-label ${labelClass}">${label}</span>`
  const actions = document.createElement('div')
  actions.className = 'word-row-actions'
  const editBtn = document.createElement('button')
  editBtn.className = 'sm-btn'
  editBtn.textContent = 'Edit Text'
  editBtn.addEventListener('click', () => editWordsText(lineId, type))
  actions.appendChild(editBtn)
  const fillBtn = document.createElement('button')
  fillBtn.className = 'sm-btn'
  fillBtn.title = 'Fill in missing word timings by interpolating between known timings'
  fillBtn.textContent = 'Autofill Timings'
  fillBtn.addEventListener('click', () => manualAutoFillWords(lineId, type))
  actions.appendChild(fillBtn)
  const switchBtn = document.createElement('button')
  switchBtn.className = 'sm-btn'
  switchBtn.title = 'Move these words + timing to Main / Background / Duo'
  switchBtn.textContent = '⇄ Switch'
  switchBtn.addEventListener('click', () => promptSwitchVocalRole(lineId, type))
  actions.appendChild(switchBtn)
  if (type !== 'main') {
    const rmBtn = document.createElement('button')
    rmBtn.className = 'sm-btn danger'
    rmBtn.textContent = 'Remove'
    rmBtn.addEventListener('click', () => removeVocalLayer(lineId, type))
    actions.appendChild(rmBtn)
  }
  header.appendChild(actions)
  row.appendChild(header)

  const container = document.createElement('div')
  container.className = 'words-container'
  container.id = `wc-${lineId}-${type}`
  words.forEach((w, i) => {
    if (i > 0) {
      const gap = document.createElement('div')
      gap.className = `word-gap ${w.tight?'tight':''}`
      gap.title = w.tight ? 'No space before this word, click to add one' : 'Space before this word, click to join tight'
      gap.textContent = w.tight ? '‿' : '·'
      gap.addEventListener('click', (e) => { e.stopPropagation(); toggleWordGap(lineId, type, i) })
      container.appendChild(gap)
    }
    const chip = document.createElement('div')
    const isSel = selectedWord && selectedWord.lineId===lineId && selectedWord.idx===i && selectedWord.type===type
    const typeClass = type==='bg'?'bg-chip':type==='duo'?'duo-chip':''
    chip.className = `word-chip ${typeClass} ${isSel?'selected':''} ${w.time==null?'no-time':''}`
    applyWordColor(chip, i, type)
    chip.dataset.idx = i
    const wtText = document.createElement('div')
    wtText.className = 'wt-text'
    wtText.textContent = w.word
    const wtTimes = document.createElement('div')
    wtTimes.className = 'wt'
    const s1 = document.createElement('span'); s1.textContent = w.time!=null?w.time.toFixed(2):'??'
    const arrow = document.createElement('span'); arrow.style.color='var(--muted)'; arrow.textContent='→'
    const s2 = document.createElement('span'); s2.textContent = w.end!=null?w.end.toFixed(2):'??'
    wtTimes.appendChild(s1); wtTimes.appendChild(arrow); wtTimes.appendChild(s2)
    chip.appendChild(wtText)
    if (settings.showTimecodes) chip.appendChild(wtTimes)
    chip.addEventListener('click', () => selectWord(lineId, i, type))
    chip.addEventListener('dblclick', () => { if (w.time!=null) { audio.currentTime=w.time; audio.play(); setPlayIcon(false) } })
    container.appendChild(chip)
  })
  row.appendChild(container)
  return row
}

function selectWord(lineId, idx, type) {
  selectedWord = { lineId, idx, type }
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const w = words[idx]
  document.getElementById('tw-label').textContent = `"${w.word}"`
  document.getElementById('tw-label').style.color = 'var(--text)'
  document.getElementById('timing-start').value = w.time!=null?w.time.toFixed(3):''
  document.getElementById('timing-end').value = w.end!=null?w.end.toFixed(3):''

  document.querySelectorAll('.word-chip.selected').forEach(c => c.classList.remove('selected'))
  const container = document.getElementById(`wc-${lineId}-${type}`)
  if (container) container.children[idx]?.classList.add('selected')
  drawWaveform()
  scheduleSessionSave()
}

function updateEditorActiveWords(t) {
  if (!selectedLineId) return
  const line = lines.find(l=>l.id===selectedLineId)
  if (!line) return
  const allTypes = [
    { words: line.words, type: 'main' },
    { words: line.bgWords||[], type: 'bg' },
    { words: line.duoWords||[], type: 'duo' }
  ]
  for (const { words, type } of allTypes) {
    const container = document.getElementById(`wc-${selectedLineId}-${type}`)
    if (!container) continue
    words.forEach((w, i) => {
      const chip = container.children[i]
      if (!chip) return
      const isActive = w.time!=null && t>=w.time && (w.end==null||t<w.end)
      const isSel = selectedWord && selectedWord.lineId===selectedLineId && selectedWord.idx===i && selectedWord.type===type
      chip.classList.toggle('active-now', isActive && !isSel)
    })
  }
}

function toggleWordGap(lineId, type, idx) {
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const w = words[idx]
  if (!w) return
  pushHistory('toggle word spacing')
  w.tight = !w.tight
  renderEditorFull()
  renderPreview(audio.currentTime||0)
  scheduleSessionSave()
}

function updateWordTime(field, val) {
  if (!selectedWord) return
  const target = getWordsForSelection(selectedWord)
  if (!target) return
  const { line, words } = target
  const t = parseFloat(val)
  if (!isNaN(t)) {
    pushHistory('word timing')
    const preservedLineEnd = line.end
    words[selectedWord.idx][field] = t
    markWordTimingEdited(words[selectedWord.idx])
    autoCorrectAfterWordEdit(line, words, selectedWord.idx, field)
    syncLineTimingFromWords(line, selectedWord.type)
    if (selectedWord.type === 'main' && preservedLineEnd != null) line.end = preservedLineEnd
    propagatePacingToMatches(line.id)
    renderLines(); renderEditorFull(); updateStatus(); drawWaveform()
    const container = document.getElementById(`wc-${selectedWord.lineId}-${selectedWord.type}`)
    const chip = container?.children[selectedWord.idx]
    if (chip) {
      const spans = chip.querySelectorAll('.wt span')
      const w = words[selectedWord.idx]
      if (spans[0]) spans[0].textContent = w.time!=null?w.time.toFixed(2):'??'
      if (spans[2]) spans[2].textContent = w.end!=null?w.end.toFixed(2):'??'
      chip.classList.toggle('no-time', w.time==null)
    }
    scheduleSessionSave()
  }
}

function setStartNow() {
  if (!selectedWord) return
  const t = audio.currentTime
  document.getElementById('timing-start').value = t.toFixed(3)
  updateWordTime('time', t)
}
function setEndNow() {
  if (!selectedWord) return
  const t = audio.currentTime
  const target = getWordsForSelection(selectedWord)
  if (!target) return
  const { line, words } = target
  const preservedLineEnd = line.end
  document.getElementById('timing-end').value = t.toFixed(3)
  updateWordTime('end', t)
  const nextIdx = selectedWord.idx + 1
  if (nextIdx < words.length) {
    if (!settings.autoCorrectWordTimings || !isTimingAnchor(words[nextIdx])) {
      words[nextIdx].time = t
    }
    syncLineTimingFromWords(line, selectedWord.type)
    if (selectedWord.type === 'main' && preservedLineEnd != null) line.end = preservedLineEnd
    propagatePacingToMatches(line.id)
    renderLines()
    renderEditorFull()
    updateStatus()
    drawWaveform()
    selectWord(selectedWord.lineId, nextIdx, selectedWord.type)
  }
}
function updateLineField(field, val) {

function editWordsText(lineId, type) {
  const line = lines.find(l=>l.id===lineId)
  if (!line) return
  const words = type==='bg'?line.bgWords:type==='duo'?line.duoWords:line.words
  const current = joinWordsForEditing(words)
  showModal('Edit Words', `<div class="mf"><label>Words with timings kept by position</label><textarea class="mi mta" id="ew-text">${esc(current)}</textarea><div class="desc" style="margin-top:6px">Tip: use "\\" to split a word into connected sections with independent timing, e.g. "bed\\room". Existing splits show up here as "\\" too, and you can remove one to merge that split back together.</div></div>`, [
    {label:'Cancel',fn:closeModal},
    {label:'Update',primary:true,fn:()=>{
      const raw = document.getElementById('ew-text').value
      const rawWords = settings.spicyLyricsPrep ? spicyPrepWords(raw) : splitWords(raw).map(w=>({word:w,tight:false}))
      let updatedRaw = []
      let oldIdx = 0
      rawWords.forEach(rw => {
        const parts = rw.word.includes('\\') ? rw.word.split('\\').filter(Boolean) : [rw.word]
        if (parts.length <= 1 || settings.preserveTimingOnWordSplit === false) {
          const old = words[oldIdx]
          if (parts.length <= 1) {
            updatedRaw.push({ word:parts[0]||rw.word, tight:!!rw.tight, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited })
          } else {
            parts.forEach((p,pi) => updatedRaw.push({ word:p, tight:pi===0?!!rw.tight:true, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited }))
          }
          oldIdx += 1
          return
        }
        let clusterLen = 1
        while (oldIdx+clusterLen < words.length && words[oldIdx+clusterLen]?.tight) clusterLen++
        if (clusterLen === parts.length) {
          for (let k = 0; k < parts.length; k++) {
            const old = words[oldIdx+k]
            updatedRaw.push({ word:parts[k], tight:k===0?!!rw.tight:true, time:old?.time??null, end:old?.end??null, timingEdited:!!old?.timingEdited })
          }
        } else {
          const spanStart = words[oldIdx], spanEndWord = words[oldIdx+clusterLen-1]
          const oldTime = spanStart?.time ?? null, oldEnd = spanEndWord?.end ?? null
          const totalLen = parts.reduce((s,p)=>s+p.length,0) || parts.length
          let cursor = oldTime
          parts.forEach((p,pi) => {
            let pTime = null, pEnd = null
            if (oldTime != null && oldEnd != null) {
              const dur = oldEnd - oldTime
              pTime = cursor
              pEnd = pi === parts.length-1 ? oldEnd : cursor + dur * (p.length / totalLen)
              cursor = pEnd
            }
            updatedRaw.push({ word:p, tight:pi===0?!!rw.tight:true, time:pTime, end:pEnd, timingEdited: pi===0?!!spanStart?.timingEdited:false })
          })
        }
        oldIdx += clusterLen
      })
      const updated = mergeStandalonePunctuation(updatedRaw)
      pushHistory('edit words')
      autoFillWordTimings(line, updated)
      if (type==='bg') { line.bgWords=updated; line.bgText=updated.length?joinWordsText(updated):null }
      else if (type==='duo') { line.duoWords=updated; line.duoText=updated.length?joinWordsText(updated):null }
      else { line.words=updated; line.text=joinWordsText(updated) }
      closeModal(); renderAll()
    }}
  ])
  setTimeout(()=>document.getElementById('ew-text')?.focus(),50)
}

function getWordProgress(word, t) {
  if (!word || word.time == null) return 0
  const start = word.time
  const end = word.end != null && word.end > start ? word.end : start + 0.12
  const raw = clamp((t - start) / (end - start), 0, 1)
  return 1 - Math.pow(1 - raw, 0.72)
}

function buildSyncWord(word, className, index, t, type = 'main') {
  const wrapper = document.createElement('span')
  wrapper.className = className
  wrapper.dataset.wi = index
  applyWordColor(wrapper, index, type)
  const chars = Array.from(word.word || '')
  const progress = getWordProgress(word, t)
  const litCount = progress * chars.length
  chars.forEach((ch, charIndex) => {
    const char = document.createElement('span')
    char.className = 'pc'
    const fill = clamp(litCount - charIndex, 0, 1)
    if (fill > 0) char.classList.add('lit')
    char.style.opacity = fill > 0 ? String(0.42 + fill * 0.58) : ''
    char.textContent = ch
    wrapper.appendChild(char)
  })
  if (progress >= 0.999) wrapper.classList.add('lit')
  return wrapper
}

function renderPreviewLightweight(t) {
  const container = document.getElementById('lyrics-preview')
  container.innerHTML = ''
  for (const line of lines) {
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time!=null && t>=line.time && !past
    const div = document.createElement('div')
    div.className = `pline preview-seekable ${past?'past':cur?'current':'future'}`
    div.dataset.lineId = line.id
    div.addEventListener('mouseenter', () => div.classList.add('preview-hover'))
    div.addEventListener('mouseleave', () => div.classList.remove('preview-hover'))
    div.addEventListener('click', () => {
      selectLine(line.id)
      seekToLine(line, false)
    })

    const mainDiv = document.createElement('div')
    mainDiv.className = 'pline-text'
    if (previewMode==='karaoke') {
      line.words.forEach((w,i) => {
        if (i > 0 && !w.tight) mainDiv.appendChild(document.createTextNode(' '))
        mainDiv.appendChild(buildSyncWord(w, 'pw', i, t, 'main'))
      })
    } else {
      mainDiv.textContent = line.text
    }
    div.appendChild(mainDiv)

    if (line.bgWords?.length) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'pline-bg'

        bgDiv.appendChild(buildSyncWord(w, 'pbw', i, t, 'bg'))
      })
      div.appendChild(bgDiv)
    } else if (line.bgText) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'pline-bg'
      bgDiv.textContent = line.bgText
      div.appendChild(bgDiv)
    }

    if (line.duoWords?.length) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'pline-duo'
      line.duoWords.forEach((w,i) => {
        if (i > 0 && !w.tight) duoDiv.appendChild(document.createTextNode(' '))
        duoDiv.appendChild(buildSyncWord(w, 'pdw', i, t, 'duo'))
      })
      div.appendChild(duoDiv)
    } else if (line.duoText) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'pline-duo'
      duoDiv.textContent = line.duoText
      div.appendChild(duoDiv)
    }

    container.appendChild(div)
    if (cur) setTimeout(()=>div.scrollIntoView({behavior:'smooth',block:'center'}),0)
  }
}

    const newClass = `pline preview-seekable ${hover?'preview-hover ':''}${past&&settings.dimPast?'past':cur?'current':'future'}`
    if (el.className !== newClass) el.className = newClass

    if (previewMode === 'karaoke') {
      el.querySelectorAll('.pw').forEach((sp,wi) => {

        const litCount = progress * chars.length
        chars.forEach((char, charIndex) => {
          const fill = clamp(litCount - charIndex, 0, 1)
          char.classList.toggle('lit', fill > 0)
          char.style.opacity = fill > 0 ? String(0.42 + fill * 0.58) : ''
        })
        sp.classList.toggle('lit', progress >= 0.999)
      })
      const allowAlt = settings.wordGlowStyle === 'all' || settings.wordGlowStyle === 'both'
      el.querySelectorAll('.pbw').forEach((sp,wi) => {

        chars.forEach((char, charIndex) => {

const HELD_WORD_THRESHOLD = 0.55
const PAUSE_DOTS_THRESHOLD = 3

function measureCharFractions(wrapper) {
  const chars = wrapper.querySelectorAll('.am-char')
  const widths = Array.from(chars).map(c => c.offsetWidth || 1)
  const total = widths.reduce((a,b)=>a+b,0) || 1
  let cum = 0
  wrapper._charFractions = widths.map(w => {
    const start = cum / total
    cum += w
    return { start, end: cum / total }
  })
}

function applyWordFill(wrapper, t) {
  const word = wrapper._wordData
  const progress = getWordProgress(word, t)
  const chars = wrapper.querySelectorAll('.am-char')
  const fractions = wrapper._charFractions
  chars.forEach((char, ci) => {
    const frac = fractions?.[ci] || { start: ci/chars.length, end: (ci+1)/chars.length }
    const span = Math.max(0.0001, frac.end - frac.start)
    const fill = clamp((progress - frac.start) / span, 0, 1)
    char.style.setProperty('--fill', fill.toFixed(3))
    char.classList.toggle('lit', fill > 0.001)
    char.classList.toggle('active', fill > 0.02 && fill < 0.98)
  })
  wrapper.classList.toggle('singing', progress > 0 && progress < 1)
  wrapper.classList.toggle('lit', progress >= 0.999)
}

function buildAppleWord(word, className, index, type) {
  const wrapper = document.createElement('span')
  wrapper.className = className
  wrapper.dataset.wi = index
  applyWordColor(wrapper, index, type)
  const dur = word?.time!=null && word?.end!=null ? word.end - word.time : 0
  const held = dur >= HELD_WORD_THRESHOLD
  wrapper.classList.add(held ? 'am-wave' : 'am-fill')
  wrapper._wordData = word
  Array.from(word?.word || '').forEach(ch => {
    const char = document.createElement('span')
    char.className = 'am-char'
    char.style.setProperty('--fill', '0')
    char.textContent = ch
    wrapper.appendChild(char)
  })
  return wrapper
}

function appendAppleWords(container, words, className, type) {
  words.forEach((w,i) => {
    if (i > 0 && !w.tight) container.appendChild(document.createTextNode(' '))
    container.appendChild(buildAppleWord(w, className, i, type))
  })
}

function renderPreviewApple(t) {
  const container = document.getElementById('lyrics-preview')
  container.classList.add('apple-mode')
  container.innerHTML = ''
  const timedLines = lines.filter(l => l.time != null)
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li]
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time!=null && t>=line.time && !past
    const div = document.createElement('div')
    div.className = `am-line preview-seekable ${past?'past':cur?'current':'future'}`
    div.dataset.lineId = line.id
    div.addEventListener('mouseenter', () => div.classList.add('preview-hover'))
    div.addEventListener('mouseleave', () => div.classList.remove('preview-hover'))
    div.addEventListener('click', () => { selectLine(line.id); seekToLine(line, false) })

    const row = document.createElement('div')
    row.className = 'am-row'
    const mainDiv = document.createElement('div')
    mainDiv.className = 'am-main'
    appendAppleWords(mainDiv, line.words, 'am-word', 'main')
    row.appendChild(mainDiv)

    if (line.duoWords?.length) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'am-duo'
      appendAppleWords(duoDiv, line.duoWords, 'am-word', 'duo')
      row.appendChild(duoDiv)
    } else if (line.duoText) {
      const duoDiv = document.createElement('div')
      duoDiv.className = 'am-duo'
      duoDiv.textContent = line.duoText
      row.appendChild(duoDiv)
    }
    div.appendChild(row)

    if (line.bgWords?.length) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'am-bg'
      appendAppleWords(bgDiv, line.bgWords, 'am-word am-bgword', 'bg')
      div.appendChild(bgDiv)
    } else if (line.bgText) {
      const bgDiv = document.createElement('div')
      bgDiv.className = 'am-bg'
      bgDiv.textContent = line.bgText
      div.appendChild(bgDiv)
    }

    container.appendChild(div)
    // measure real rendered character widths now that the words are laid out in the live DOM,
    // then do an immediate fill pass so the first paint already reflects proportional timing
    div.querySelectorAll('.am-word').forEach(w => { measureCharFractions(w); applyWordFill(w, t) })
    if (cur && settings.scrollPreview) setTimeout(()=>div.scrollIntoView({behavior:'smooth',block:'center'}),0)

    const nextTimed = timedLines.find(l => l.time > (line.time ?? -Infinity))
    if (nextTimed && line.time != null) {
      const gapStart = effEnd
      const gapEnd = nextTimed.time
      if (gapEnd - gapStart >= PAUSE_DOTS_THRESHOLD) {
        const dots = document.createElement('div')
        dots.className = 'am-dots'
        dots.dataset.start = gapStart
        dots.dataset.end = gapEnd
        for (let d = 0; d < 3; d++) {
          const dot = document.createElement('span')
          dot.className = 'am-dot'
          dots.appendChild(dot)
        }
        container.appendChild(dots)
      }
    }
  }
}

function updatePreviewLiveApple(t) {
  document.querySelectorAll('.am-line').forEach((el, i) => {
    if (i>=lines.length) return
    const line = lines[i]
    const effEnd = effectiveEnd(line)
    const past = effEnd > 0 && t > effEnd
    const cur = line.time!=null && t>=line.time && !past
    const hover = el.classList.contains('preview-hover')
    const newClass = `am-line preview-seekable ${hover?'preview-hover ':''}${past&&settings.dimPast?'past':cur?'current':'future'}`
    if (el.className !== newClass) el.className = newClass

    el.querySelectorAll('.am-word').forEach(w => applyWordFill(w, t))

    if (cur && settings.scrollPreview) el.scrollIntoView({behavior:'smooth',block:'center'})
  })

  document.querySelectorAll('.am-dots').forEach(el => {
    const start = parseFloat(el.dataset.start), end = parseFloat(el.dataset.end)
    const active = t >= start && t <= end
    el.classList.toggle('active', active)
    const progress = clamp((t - start) / Math.max(0.01, end - start), 0, 1)
    el.querySelectorAll('.am-dot').forEach((dot, i) => {
      dot.classList.toggle('lit', active && progress >= (i+1)/3 - 0.02)
    })
  })
}

function isHexColor(v) {
  return typeof v === 'string' && /^#([0-9a-f]{6})$/i.test(v.trim())
}

function hexToRgba(hex, alpha) {
  const value = hex.replace('#', '')
  const r = parseInt(value.slice(0, 2), 16)
  const g = parseInt(value.slice(2, 4), 16)
  const b = parseInt(value.slice(4, 6), 16)
  return `rgba(${r},${g},${b},${alpha})`
}

function withAlphaIfHex(value, alpha) {
  return isHexColor(value) ? hexToRgba(value, alpha) : value
}

function getThemeBaseVars() {
  return { ...(THEMES[settings.theme] || THEMES.dark).vars }
}

function getThemeVars() {
  return { ...getThemeBaseVars(), ...(settings.themeOverrides || {}) }
}

function applyDerivedThemeVars(vars) {
  const hasBgImage = vars['--bg-image'] && vars['--bg-image'] !== 'none'
  if (isHexColor(vars['--accent'])) {
    vars['--accent-dim'] = hexToRgba(vars['--accent'], 0.12)
    vars['--accent-dim2'] = hexToRgba(vars['--accent'], 0.06)
    vars['--accent-20'] = hexToRgba(vars['--accent'], 0.2)
    vars['--accent-25'] = hexToRgba(vars['--accent'], 0.25)
    vars['--accent-30'] = hexToRgba(vars['--accent'], 0.3)
    vars['--accent-40'] = hexToRgba(vars['--accent'], 0.4)
    vars['--accent-50'] = hexToRgba(vars['--accent'], 0.5)
    vars['--accent-70'] = hexToRgba(vars['--accent'], 0.7)
  }
  if (isHexColor(vars['--red'])) vars['--red-dim'] = hexToRgba(vars['--red'], 0.12)
  if (isHexColor(vars['--blue'])) vars['--blue-dim'] = hexToRgba(vars['--blue'], 0.12)
  if (isHexColor(vars['--purple'])) vars['--purple-dim'] = hexToRgba(vars['--purple'], 0.12)
  if (isHexColor(vars['--orange'])) vars['--orange-dim'] = hexToRgba(vars['--orange'], 0.12)
  if (hasBgImage) {
    vars['--bg'] = withAlphaIfHex(vars['--bg'], 0.72)
    vars['--surface'] = withAlphaIfHex(vars['--surface'], 0.74)
    vars['--surface2'] = withAlphaIfHex(vars['--surface2'], 0.78)
    vars['--surface3'] = withAlphaIfHex(vars['--surface3'], 0.84)
    vars['--border'] = withAlphaIfHex(vars['--border'], 0.7)
    vars['--border2'] = withAlphaIfHex(vars['--border2'], 0.8)
  }
  return vars
}

function collectThemeOverridesFromModal() {
  const nextOverrides = {}
  const accent = document.getElementById('s-accent')?.value
  if (accent) nextOverrides['--accent'] = accent
  const textScale = document.getElementById('s-textscale')?.value
  if (textScale) nextOverrides['--text-scale'] = textScale
  const bgImageValue = document.getElementById('s-bg-image')?.value || ''
  nextOverrides['--bg-image'] = bgImageValue ? `url('${bgImageValue}')` : 'none'
  nextOverrides['--bg-overlay'] = document.getElementById('s-bg-overlay')?.value || '0'
  nextOverrides['--bg-blur'] = (document.getElementById('s-bg-blur')?.value || '0') + 'px'
  nextOverrides['--bg-size'] = document.getElementById('s-bg-size')?.value || 'cover'
  nextOverrides['--bg-position'] = document.getElementById('s-bg-position')?.value || 'center'
  document.querySelectorAll('[data-theme-key]').forEach(input => {
    const key = input.getAttribute('data-theme-key')
    const value = input.value.trim()
    if (value) nextOverrides[key] = value
  })
  return nextOverrides
}

function previewThemeFromModal() {
  settings.theme = document.getElementById('s-theme')?.value || settings.theme

function loadSettings() {
  try {
    const s = localStorage.getItem('ttml-editor-settings')
    if (s) {
      const parsed = JSON.parse(s)
      settings = {
        ...settings,
        ...parsed,
        themeOverrides: { ...(parsed.themeOverrides || {}) }
      }
      if (parsed.textScale && !settings.themeOverrides['--text-scale']) settings.themeOverrides['--text-scale'] = String(parsed.textScale)
    }
  } catch {}
}

function saveSettings() {
  try { localStorage.setItem('ttml-editor-settings', JSON.stringify(settings)) } catch {}
}

function applySettings() {
  const root = document.documentElement
  const vars = applyDerivedThemeVars(getThemeVars())
  for (const [k, v] of Object.entries(vars)) root.style.setProperty(k, v)
  document.querySelectorAll('.pline-text').forEach(el => el.style.fontSize = settings.previewFontSize + 'px')
  syncPreviewStyleButton()
  drawWaveform()
}

        ${ADVANCED_THEME_KEYS.map(key => `
          <div class="settings-row">
            <div><div class="settings-code">${key}</div><div class="desc">Base theme variable override</div></div>
            <input class="mi settings-code" data-theme-key="${key}" value="${esc(settings.themeOverrides[key] ?? '')}" placeholder="${esc((THEMES[settings.theme] || THEMES.dark).vars[key] || '')}">
          </div>
        `).join('')}
      </div>
    </div>
    <div class="settings-note">Theme settings are saved locally in your browser.</div>
  `, [
    { label: 'Reset Theme', fn: () => {
      settings.theme = 'dark'
      settings.themeOverrides = {}
      settings.showAdvancedTheme = false
      saveSettings()
      applySettings()
      closeModal()
      renderEditorFull()
      renderPreview(audio.currentTime||0)
    }},
    { label: 'Save', primary:true, fn: () => {
      const prevWaveformEngine = settings.waveformEngine
      settings.previewFontSize = parseInt(document.getElementById('s-fontsize').value)
      settings.scrollPreview = document.getElementById('s-scroll').checked
      settings.dimPast = document.getElementById('s-dim').checked
      settings.wordGlowStyle = document.getElementById('s-glow').value
      settings.showTimecodes = document.getElementById('s-timecodes').checked
      settings.colorWordMarkers = document.getElementById('s-color-words').checked
      settings.previewStyle = document.getElementById('s-preview-style').value
      settings.preserveTimingOnWordSplit = document.getElementById('s-preserve-split-timing').checked
      settings.autoScrollWaveform = document.getElementById('s-autoscroll-waveform').checked
      settings.syncMatchingLinePacing = document.getElementById('s-sync-matching-lines').checked
      settings.spicyLyricsPrep = document.getElementById('s-spicy-lyrics-prep').checked
      settings.autoCorrectWordTimings = document.getElementById('s-auto-correct-words').checked
      settings.waveformEngine = document.getElementById('s-waveform-engine').value || 'auto'
      settings.theme = document.getElementById('s-theme').value || 'dark'
      settings.showAdvancedTheme = !document.getElementById('s-advanced-wrap').classList.contains('settings-hidden')
      settings.themeOverrides = collectThemeOverridesFromModal()
      saveSettings()
      applySettings()
      closeModal()
      renderPreview(audio.currentTime||0)
      if (currentAudioPath && prevWaveformEngine !== settings.waveformEngine) {
        const loadingToken = showLoadingModal('Refreshing Waveform', 'Rebuilding the waveform with the selected backend...')
        loadWaveformPeaks(currentAudioPath)
          .catch(err => showRuntimeError(`Waveform refresh failed: ${err?.message || err}`))
          .finally(() => hideLoadingModal(loadingToken))
      }
    }}
  ])
  const themeInput = document.getElementById('s-theme')
  document.querySelectorAll('[data-theme-option]').forEach(btn => {
    btn.addEventListener('click', () => {
      themeInput.value = btn.getAttribute('data-theme-option')
      document.querySelectorAll('[data-theme-option]').forEach(el => el.classList.toggle('active', el === btn))
      previewThemeFromModal()
    })
  })
  const scaleInput = document.getElementById('s-textscale')
  scaleInput.addEventListener('input', () => {
    document.getElementById('s-textscale-label').textContent = Math.round(parseFloat(scaleInput.value) * 100) + '%'
    previewThemeFromModal()
  })
  const bgFile = document.getElementById('s-bg-file')
  const bgInput = document.getElementById('s-bg-image')
  const bgPreview = document.getElementById('s-bg-preview')
  const bgClear = document.getElementById('s-bg-clear')
  document.getElementById('s-bg-upload').addEventListener('click', () => bgFile.click())
  bgFile.addEventListener('change', () => {
    const file = bgFile.files?.[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = () => {
      bgInput.value = typeof reader.result === 'string' ? reader.result : ''
      bgPreview.style.backgroundImage = bgInput.value ? `url('${bgInput.value}')` : 'none'
      bgClear.disabled = !bgInput.value
      previewThemeFromModal()
    }
    reader.readAsDataURL(file)
  })
  bgClear.addEventListener('click', () => {
    bgInput.value = ''
    bgPreview.style.backgroundImage = 'none'
    bgClear.disabled = true
    bgFile.value = ''
    previewThemeFromModal()
  })
  const syncBgPreview = () => {
    bgPreview.style.backgroundSize = document.getElementById('s-bg-size').value
    bgPreview.style.backgroundPosition = document.getElementById('s-bg-position').value
    previewThemeFromModal()
  }
  document.getElementById('s-bg-size').addEventListener('change', syncBgPreview)
  document.getElementById('s-bg-position').addEventListener('change', syncBgPreview)
  document.getElementById('s-accent').addEventListener('change', previewThemeFromModal)
  document.getElementById('s-bg-overlay').addEventListener('input', previewThemeFromModal)
  document.getElementById('s-bg-blur').addEventListener('input', previewThemeFromModal)
  document.querySelectorAll('[data-theme-key]').forEach(input => {
    input.addEventListener('input', previewThemeFromModal)
  })
  const advancedWrap = document.getElementById('s-advanced-wrap')
  document.getElementById('s-advanced-toggle').addEventListener('click', () => {
    advancedWrap.classList.toggle('settings-hidden')
    document.getElementById('s-advanced-toggle').textContent = advancedWrap.classList.contains('settings-hidden') ? 'Show Advanced Overrides' : 'Hide Advanced Overrides'
  })
}

function ttmlWordSpans(words) {
  let out = ''
  words.forEach((w, i) => {
    if (i > 0 && !w.tight) out += ' '
    out += `<span begin="${fmtTTML(w.time)}" end="${fmtTTML(w.end)}">${esc(w.word)}</span>`
  })
  return out
}

function metaListRowsHtml(items, kind) {
  return items.map((v,i) => `<div class="mf-row" style="display:flex;gap:6px;margin-bottom:6px">
    <input class="mi meta-list-input" data-kind="${kind}" data-idx="${i}" value="${esc(v)}" style="flex:1">
    <button type="button" class="sm-btn danger meta-remove-btn" data-kind="${kind}" data-idx="${i}">✕</button>
  </div>`).join('') || `<div class="desc"> none added yet! </div>`
}

function showMetadataModal() {
  const draft = {
    musicName: songMeta.musicName || '',
    album: songMeta.album || '',
    artists: [...(songMeta.artists||[])],
    songwriters: [...(songMeta.songwriters||[])],
  }
  const body = `
    <div class="mf"><label>Song Name</label><input class="mi" id="meta-musicname" value="${esc(draft.musicName)}"></div>
    <div class="mf"><label>Album</label><input class="mi" id="meta-album" value="${esc(draft.album)}"></div>
    <div class="mf"><label>Artists</label><div id="meta-artists-list">${metaListRowsHtml(draft.artists,'artists')}</div><button type="button" class="sm-btn" id="meta-add-artist">+ Add Artist</button></div>
    <div class="mf"><label>Songwriters</label><div class="desc" style="margin-bottom:6px">required by Spicy Lyrics to add each songwriter individually, using their real name</div><div id="meta-songwriters-list">${metaListRowsHtml(draft.songwriters,'songwriters')}</div><button type="button" class="sm-btn" id="meta-add-songwriter">+ Add Songwriter</button></div>
  `
  showModal('Edit Metadata', body, [
    {label:'Cancel',fn:closeModal},
    {label:'Save',primary:true,fn:()=>{
      songMeta = {
        musicName: document.getElementById('meta-musicname').value.trim(),
        album: document.getElementById('meta-album').value.trim(),
        artists: draft.artists.map(s=>s.trim()).filter(Boolean),
        songwriters: draft.songwriters.map(s=>s.trim()).filter(Boolean),
      }
      closeModal(); scheduleSessionSave()
    }}
  ])
  setTimeout(() => {
    const rerenderList = (kind) => {
      document.getElementById(`meta-${kind}-list`).innerHTML = metaListRowsHtml(draft[kind], kind)
      wireList(kind)
    }
    const wireList = (kind) => {
      document.querySelectorAll(`#meta-${kind}-list .meta-list-input`).forEach(inp => {
        inp.addEventListener('input', () => { draft[kind][+inp.dataset.idx] = inp.value })
      })
      document.querySelectorAll(`#meta-${kind}-list .meta-remove-btn`).forEach(btn => {
        btn.addEventListener('click', () => { draft[kind].splice(+btn.dataset.idx,1); rerenderList(kind) })
      })
    }
    wireList('artists'); wireList('songwriters')
    document.getElementById('meta-add-artist').addEventListener('click', () => { draft.artists.push(''); rerenderList('artists') })
    document.getElementById('meta-add-songwriter').addEventListener('click', () => { draft.songwriters.push(''); rerenderList('songwriters') })
  }, 50)
}

function exportTTML() {
  if (!lines.length) return
  const sorted = [...lines].sort((a,b)=>(a.time||0)-(b.time||0))
  const hasDuet = sorted.some(l => l.duoWords?.length)
  let metaXml = `<ttm:title>${esc(songMeta.musicName||audioFileName||'Unknown')}</ttm:title>`
  if (hasDuet) metaXml += `<ttm:agent type="person" xml:id="v1"/><ttm:agent type="person" xml:id="v2"/>`
  if (songMeta.musicName) metaXml += `<amll:meta key="musicName" value="${escAttr(songMeta.musicName)}"/>`
  for (const a of (songMeta.artists||[])) metaXml += `<amll:meta key="artists" value="${escAttr(a)}"/>`
  if (songMeta.album) metaXml += `<amll:meta key="album" value="${escAttr(songMeta.album)}"/>`
  if (songMeta.songwriters?.length) {
    metaXml += `<iTunesMetadata xmlns="http://music.apple.com/lyric-ttml-internal"><songwriters>`
    for (const s of songMeta.songwriters) metaXml += `<songwriter>${esc(s)}</songwriter>`
    metaXml += `</songwriters></iTunesMetadata>`
  }
  let xml = `<?xml version="1.0" encoding="UTF-8"?>
<tt xml:lang="en" xmlns="http://www.w3.org/ns/ttml"
    xmlns:ttm="http://www.w3.org/ns/ttml#metadata"
    xmlns:itunes="http://music.apple.com/lyric-ttml-internal"
    xmlns:amll="http://www.example.com/ns/amll">
  <head>
    <metadata>${metaXml}</metadata>
    <styling><style xml:id="s1" tts:fontFamily="Arial" tts:fontSize="100%" tts:color="white" xmlns:tts="http://www.w3.org/ns/ttml#styling"/></styling>
    <layout><region xml:id="r1" tts:textAlign="center" tts:displayAlign="after" xmlns:tts="http://www.w3.org/ns/ttml#styling"/></layout>
  </head>
  <body>
    <div region="r1">\n`
  for (const line of sorted) {
    const soloDuet = !line.words?.length && line.duoWords?.length
    if (soloDuet) {
      xml += `      <p begin="${fmtTTML(line.time)}" end="${fmtTTML(line.end)}" ttm:agent="v2">`
      xml += ttmlWordSpans(line.duoWords)
      if (line.bgWords?.length) {
        xml += `<span ttm:role="x-bg" begin="${fmtTTML(line.bgWords[0].time)}" end="${fmtTTML(line.bgWords[line.bgWords.length-1].end)}">`
        xml += ttmlWordSpans(line.bgWords)
        xml += `</span>`
      }
      xml += `</p>\n`
      continue
    }
    xml += `      <p begin="${fmtTTML(line.time)}" end="${fmtTTML(line.end)}"${hasDuet?' ttm:agent="v1"':''}>`
    xml += ttmlWordSpans(line.words)
    if (line.bgWords?.length) {
      xml += `<span ttm:role="x-bg" begin="${fmtTTML(line.bgWords[0].time)}" end="${fmtTTML(line.bgWords[line.bgWords.length-1].end)}">`
      xml += ttmlWordSpans(line.bgWords)
      xml += `</span>`
    }
    if (line.duoWords?.length) {
      xml += `<span ttm:role="x-alt" ttm:agent="v2" begin="${fmtTTML(line.duoWords[0].time)}" end="${fmtTTML(line.duoWords[line.duoWords.length-1].end)}">`
      xml += ttmlWordSpans(line.duoWords)
      xml += `</span>`
    }
    xml += `</p>\n`
  }
  xml += `    </div>\n  </body>\n</tt>`
  const suggestedName = audioFileName.replace(/\.[^.]+$/,'')+'.ttml'
  window.api.saveTTML(xml, suggestedName).then(fp => {
    if (!fp) return
    const parts = fp.replace(/\\/g,'/').split('/')
    const fileName = parts.pop()
    const dir = parts.join('/')
    showModal('Saved!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(fileName)}</strong><div class="es-path">${esc(dir)}</div><div class="es-note">Feel free to use this in Lokal by importing it from the lyrics view, or use it in any other program that supports TTML files. Thanks!</div></div>`, [{label:'Close',fn:closeModal}])
  })
}

function fmtLRCTime(t) {
  if (t == null) return '00:00.00'
  const m = Math.floor(t / 60)
  const s = t - m * 60
  return `${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}`
}

function lrcLineText(line) {
  let t = line.text || ''
  if (line.duoText) t += (t ? ' ' : '') + line.duoText
  if (line.bgText) t += (t ? ' ' : '') + `(${line.bgText})`
  return t.trim()
}

function exportLRC() {
  const timed = lines.filter(l => l.time != null).sort((a,b) => a.time - b.time)
  if (!timed.length) { showRuntimeError('No timed lines to export — add line timing first.'); return }
  let out = ''
  for (const line of timed) out += `[${fmtLRCTime(line.time)}]${lrcLineText(line)}\n`
  const suggestedName = audioFileName.replace(/\.[^.]+$/,'')+'.lrc'
  window.api.saveLRC(out, suggestedName).then(fp => {
    if (!fp) return
    const parts = fp.replace(/\\/g,'/').split('/')
    const fileName = parts.pop()
    const dir = parts.join('/')
    showModal('Saved!', `<div class="export-success"><div class="es-icon">✓</div><strong>${esc(fileName)}</strong><div class="es-path">${esc(dir)}</div><div class="es-note">Plain line-synced LRC, ready to submit to LRCLIB alongside your word-synced TTML.</div></div>`, [{label:'Close',fn:closeModal}])
  })
}

function sortLines() {
  lines.sort((a,b)=>(a.time??Infinity)-(b.time??Infinity))
  renderAll()
}
function filterLines(val) { filterText=val; renderLines(); scheduleSessionSave() }
function updateStatus() {
  document.getElementById('sb-lines').textContent = lines.length
  let timed=0, missing=0
  for (const l of lines) for (const w of l.words) { w.time!=null?timed++:missing++ }
  document.getElementById('sb-timed').textContent = timed
  document.getElementById('sb-missing').textContent = missing
}

function showModal(title, bodyHtml, buttons) {
  const opts = arguments[3] || {}
  document.getElementById('modal').dataset.locked = opts.locked ? 'true' : 'false'
  document.getElementById('modal-title').textContent = title
  document.getElementById('modal-body').innerHTML = bodyHtml
  const acts = document.getElementById('modal-actions')
  acts.innerHTML = ''
  for (const b of (buttons || [])) {
    const btn = document.createElement('button')
    btn.className = 'mbtn'+(b.primary?' primary':'')
    btn.textContent = b.label
    btn.addEventListener('click', b.fn)
    acts.appendChild(btn)
  }
  document.getElementById('modal-overlay').classList.remove('hidden')
}
function closeModal() {
  const modal = document.getElementById('modal')
  if (modal.dataset.locked === 'true') return
  modal.dataset.locked = 'false'
  document.getElementById('modal-overlay').classList.add('hidden')
}
function forceCloseModal() {
  const modal = document.getElementById('modal')
  modal.dataset.locked = 'false'
  document.getElementById('modal-overlay').classList.add('hidden')
}
document.getElementById('modal-overlay').addEventListener('mousedown', e => {
  if (e.target===document.getElementById('modal-overlay')) closeModal()
})

document.getElementById('wc-min').addEventListener('click', () => window.api.minimizeWindow?.())
document.getElementById('wc-max').addEventListener('click', async () => {
  try {
    const maximized = await window.api.toggleMaximizeWindow?.()
    setWindowMaximizedState(maximized)
  } catch {}
})
document.getElementById('wc-close').addEventListener('click', () => window.api.closeWindow?.())
window.api.onWindowMaximized?.(setWindowMaximizedState)
updateWindowControls()
document.getElementById('error-log-close').addEventListener('click', () => {
  document.getElementById('error-log').classList.remove('visible')
  document.getElementById('error-log-text').textContent = ''
})

document.getElementById('waveform-area').addEventListener('wheel', handleWaveformWheel, { passive: false })
document.getElementById('prog-track').addEventListener('wheel', handleProgressWheel, { passive: false })
window.addEventListener('resize', () => drawWaveform())
window.addEventListener('beforeunload', saveSessionNow)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveSessionNow()
})
window.addEventListener('error', (event) => {
  showRuntimeError(`${event.message || 'Unhandled error'}${event.filename ? `\n${event.filename}:${event.lineno || 0}:${event.colno || 0}` : ''}`)
})
window.addEventListener('unhandledrejection', (event) => {
  const reason = event.reason
  showRuntimeError(`Unhandled rejection: ${reason?.stack || reason?.message || reason}`)
})
audio.addEventListener('error', () => {
  const mediaError = audio.error
  showRuntimeError(`Audio element error${mediaError ? ` (code ${mediaError.code})` : ''}`)
})

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName.toLowerCase()
  if ((e.ctrlKey||e.metaKey) && !e.shiftKey && e.code==='KeyZ' && tag!=='input' && tag!=='textarea') {
    e.preventDefault()
    undoLastEdit()
    return
  }
  if (tag==='input'||tag==='textarea') return
  if (e.code==='Space') { e.preventDefault(); togglePlay() }
  if (e.code==='KeyS') { e.preventDefault(); setStartNow() }
  if (e.code==='KeyE') { e.preventDefault(); setEndNow() }
  if (e.code==='BracketLeft') { e.preventDefault(); nudgePlaybackSpeed(-1) }
  if (e.code==='BracketRight') { e.preventDefault(); nudgePlaybackSpeed(1) }
  if (e.code==='ArrowRight') { e.preventDefault(); audio.currentTime=Math.min(audioDuration,audio.currentTime+(e.shiftKey?1:.1)) }
  if (e.code==='ArrowLeft') { e.preventDefault(); audio.currentTime=Math.max(0,audio.currentTime-(e.shiftKey?1:.1)) }
  if (e.code==='Tab' && selectedWord) {
    e.preventDefault()
    const line = lines.find(l=>l.id===selectedWord.lineId)
    if (!line) return
    const words = selectedWord.type==='bg'?line.bgWords:selectedWord.type==='duo'?line.duoWords:line.words
    const next = e.shiftKey ? selectedWord.idx-1 : selectedWord.idx+1
    if (next>=0 && next<words.length) selectWord(selectedWord.lineId, next, selectedWord.type)
  }
})

loadSettings()
applySettings()
restoreSession().finally(() => {
  renderAll()
  drawWaveform()
  if (selectedWord) selectWord(selectedWord.lineId, selectedWord.idx, selectedWord.type)
})
</script>
