name: Build Electron Executable (Manual Build)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git Ref/Tag/Commit to build'
        required: false
        default: 'main'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Lokal-TTML-Editor-Windows
            build_cmd: npx electron-builder --win portable
          - os: macos-latest
            artifact_name: Lokal-TTML-Editor-macOS
            build_cmd: npx electron-builder --mac dmg zip
          - os: ubuntu-latest
            artifact_name: Lokal-TTML-Editor-Linux
            build_cmd: npx electron-builder --linux AppImage deb

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Executables
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/*.*
