name: Build Electron Executable (Nightly)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git Ref/Tag/Commit to build'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npx electron-builder --win portable --publish never
          - os: macos-latest
            build_cmd: npx electron-builder --mac dmg zip --publish never
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux AppImage deb --publish never

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Executables
        run: ${{ matrix.build_cmd }}

      - name: Rename release files (replace spaces)
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          shopt -s nullglob
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    name: Create & Update Nightly Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Get Last Commit Info
        id: commit_info
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d %H:%M:%S UTC')
          
          echo "MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "DATE=$COMMIT_DATE" >> $GITHUB_OUTPUT

      - name: Generate Nightly Banner
        run: |
          node - <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1200, height: 600 }
            });

            await page.goto(
              "https://sipbuu.me/lokalver/?v=${{ inputs.ref || 'main' }}&type=nightly&app=ttml",
              { waitUntil: "networkidle" }
            );

            await page.locator(".title-card").screenshot({
              path: "release-banner.png"
            });

            await browser.close();
          })();
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create / Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly-${{ inputs.ref || 'main' }}"
          name: "Lokal TTML Editor Nightly (${{ inputs.ref || 'main' }})"
          prerelease: true
          files: |
            release_all/**/*.*
            release-banner.png
          body: |
            ![Release Banner](https://github.com/${{ github.repository }}/releases/download/nightly-${{ inputs.ref || 'main' }}/release-banner.png)

            ---

            *This is a nightly build, code may/may not be fully functional.*
            Last commit note/date: `${{ steps.commit_info.outputs.MSG }}` at `${{ steps.commit_info.outputs.DATE }}`

            ---

            > Please report any [issues](https://github.com/sipbuu/lokal-ttml/issues) or pull requests for bugs and improvements.

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}