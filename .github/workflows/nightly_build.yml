name: Build Electron Executable (Nightly)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git Ref/Tag/Commit to build'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npx electron-builder --win portable --publish never
          - os: macos-latest
            build_cmd: npx electron-builder --mac dmg zip --publish never
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux AppImage deb --publish never

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Get Last Commit Info
        id: commit_info
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d %H:%M:%S UTC')
          
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV

      - name: Generate Nightly Banner (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node - <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1200, height: 600 }
            });

            await page.goto(
              "https://sipbuu.me/lokalver/?v=${{ inputs.ref || 'main' }}&type=nightly&app=ttml",
              { waitUntil: "networkidle" }
            );

            await page.locator(".title-card").screenshot({
              path: "release-banner.png"
            });

            await browser.close();
          })();
          EOF

      - name: Build Executables
        run: ${{ matrix.build_cmd }}

      - name: Generate Checksums
        shell: bash
        run: |
          cd release
          echo "CHECKSUM_TEXT<<EOF" >> $GITHUB_ENV
          for file in *.{exe,dmg,zip,AppImage,deb}; do
            if [ -f "$file" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                hash=$(sha256sum "$file" | awk '{print $1}')
              elif command -v shasum >/dev/null 2>&1; then
                hash=$(shasum -a 256 "$file" | awk '{print $1}')
              else
                hash=$(certutil -hashfile "$file" SHA256 | sed -n '2p' | tr -d ' \r\n')
              fi
              echo "> **$file**: \`$hash\`" >> $GITHUB_ENV
            fi
          done
          echo "EOF" >> $GITHUB_ENV
          
      - name: Create / Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly-${{ inputs.ref || 'main' }}"
          name: "Lokal TTML Editor Nightly (${{ inputs.ref || 'main' }})"
          prerelease: true
          body: |
            ![Release Banner](https://github.com/${{ github.repository }}/releases/download/nightly-${{ inputs.ref || 'main' }}/release-banner.png)

            ---

            *This is a nightly build, code may/may not be fully functional.*
            Last commit note/date: `${{ env.COMMIT_MSG }}` at `${{ env.COMMIT_DATE }}`

            ---

            > Please report any [issues](https://github.com/sipbuu/lokal-ttml/issues) or pull requests for bugs and improvements.

            ---

            ### Binary Checksums (SHA-256)

          append_body: true
          files: |
            release/*.*
            release-banner.png
