name: Release App

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Release ${{ github.ref_name }}
          body: |
            ![Release Banner](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/release-banner.png)

            ---
            
            [Add brief summary/overview here]

            ---

            ## Features added:

            * 
            
            ## Quality of Life:

            * 
            
            ## Fixed Issues:

            * 

            > Please report any [issues](https://github.com/sipbuu/lokal-ttml/issues) or pull requests for bugs and improvements.

            ---

            ### Binary Checksums (SHA-256)

            **Full Changelog**: https://github.com/sipbuu/lokal-ttml/commits/${{ github.ref_name }}

            ---

  build:
    name: Build (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: npx electron-builder --win portable --publish never
          - os: macos-latest
            build_cmd: npx electron-builder --mac dmg zip --publish never
          - os: ubuntu-latest
            build_cmd: npx electron-builder --linux AppImage deb --publish never

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate Release Banner (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node - <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 1200, height: 600 }
            });

            await page.goto(
              "https://sipbuu.me/lokalver/?v=${{ github.ref_name }}&type=release&app=ttml",
              { waitUntil: "networkidle" }
            );

            await page.locator(".title-card").screenshot({
              path: "release-banner.png"
            });

            await browser.close();
          })();
          EOF

      - name: Build Executables
        run: ${{ matrix.build_cmd }}

      - name: Generate Checksums
        shell: bash
        run: |
          cd release
          echo "CHECKSUM_TEXT<<EOF" >> $GITHUB_ENV
          for file in *.{exe,dmg,zip,AppImage,deb}; do
            if [ -f "$file" ]; then
              if command -v sha256sum >/dev/null 2>&1; then
                hash=$(sha256sum "$file" | awk '{print $1}')
              elif command -v shasum >/dev/null 2>&1; then
                hash=$(shasum -a 256 "$file" | awk '{print $1}')
              else
                hash=$(certutil -hashfile "$file" SHA256 | sed -n '2p' | tr -d ' \r\n')
              fi
              echo "> **$file**: \`$hash\`" >> $GITHUB_ENV
            fi
          done
          echo "EOF" >> $GITHUB_ENV
          
      - name: Upload Assets & Append Checksums
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          append_body: true
          body: ${{ env.CHECKSUM_TEXT }}
          files: |
            release/*.*
            release-banner.png
            release-banner.png
